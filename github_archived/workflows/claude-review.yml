# Claude Code on pull requests and on "@claude" mentions.
#   Pull requests: a security review of the diff against docs/security/cwe-controls.md, using the same rules as the
#   security-reviewer subagent, posted as a review comment. Advisory: the ci workflow is the merge gate.
#   Mentions: "@claude <request>" in an issue or pull request comment runs Claude Code with the repository's
#   CLAUDE.md, skills and hooks (it may push to a claude/ branch; it never pushes to main).
# Setup: install the Claude GitHub App on the repository and add the secret CLAUDE_CODE_OAUTH_TOKEN
# (claude setup-token) or ANTHROPIC_API_KEY. Without a secret the jobs are skipped.
name: claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  security-review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_CLAUDE_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_CLAUDE_SECRET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_CLAUDE_SECRET == 'true'
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} as the
            security-reviewer subagent defined in .claude/agents/security-reviewer.md.
            Check the diff against the 14 CWEs and controls in docs/security/cwe-controls.md, the data boundary in
            docs/domain/data-boundary.md and the non-negotiables in CLAUDE.md. Report each finding with file, line,
            CWE, a concrete failure scenario and the fix. End with PASS or FAIL. Post the result as one PR comment.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(node scripts/security/scan.mjs:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
