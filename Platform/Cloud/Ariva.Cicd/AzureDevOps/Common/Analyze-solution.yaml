# Pull request validation for Ariva. Attach it to trunk as a build validation branch policy
# (Azure Repos runs PR validation through branch policies, not a YAML pr trigger).
# Order: security gate, .NET build, unit and integration tests, web checks, API end-to-end and Playwright
# functional tests; the security report and the Playwright HTML report are published even when a step fails.
name: $(date:yyyyMMdd)$(rev:rr)

trigger: none
resources:
  repositories:
    - repository: self
      type: git
      ref: $(Build.SourceBranch)

variables:
  BuildConfiguration: 'Release'

jobs:
  - job: Phase_1
    displayName: Analyze
    timeoutInMinutes: 60
    pool:
      name: Default
      # Linux on x64 (ARV-096): Ariva.AppHost and Ariva.UnitTests keep one lock file per build platform and only
      # packages.linux-x64.lock.json is committed, so a locked restore on another architecture would find no lock file.
      demands:
        - Agent.OS -equals Linux
        - Agent.OSArchitecture -equals X64
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: 'Use Node 22'
        inputs:
          versionSpec: '22.x'

      # 1. Security gate (docs/security/cwe-controls.md). The self-test proves every rule fires on the bad
      #    fixtures and stays quiet on the good ones before the real scan is trusted.
      - script: node scripts/security/scan.mjs --self-test
        displayName: 'Security: scanner self-test'

      - script: node scripts/security/scan.mjs
        displayName: 'Security: scan (writes .verify/security-report.md)'

      # The check every host image build runs on its publish output (ARV-184): proven here before the images trust it.
      - script: node scripts/published-runtime.mjs --self-test
        displayName: 'Security: published runtime check self-test'

      # 2. .NET build; the CWE analyzers in .editorconfig run as errors.
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '10.x'
          includePreviewVersions: false

      # ARV-096: the repository's nuget.config (nuget.org only, with package source mapping) and locked mode, as in ci.yml.
      # Directory.Build.props turns locked mode on for every restore and build on an agent (TF_BUILD); a package graph that
      # differs from the committed packages.lock.json files, or a package whose content differs from its recorded hash, fails.
      - task: DotNetCoreCLI@2
        displayName: 'Dotnet Restore (locked)'
        inputs:
          command: 'restore'
          projects: 'Ariva.slnx'
          feedsToUse: 'config'
          nugetConfigPath: 'nuget.config'
          restoreArguments: '--locked-mode'

      - task: DotNetCoreCLI@2
        displayName: 'Dotnet Build'
        inputs:
          command: 'build'
          projects: 'Ariva.slnx'
          arguments: '--configuration $(BuildConfiguration) --no-restore'

      # 3. Unit tests (architecture, security and domain; the hosts boot in memory with WebApplicationFactory).
      - task: DotNetCoreCLI@2
        displayName: 'Dotnet Test'
        inputs:
          command: 'test'
          projects: |
            Platform/Backplane/Ariva.UnitTests/Ariva.UnitTests.csproj
            Platform/Backplane/Ariva.IntegrationTests/Ariva.IntegrationTests.csproj
          arguments: '--configuration $(BuildConfiguration) --no-build'
          publishTestResults: true

      # 4. Web: type check, formatting and the production build (which writes the CSP into build/nginx/default.conf).
      - script: npm ci
        displayName: 'Web: npm ci'
        workingDirectory: Platform/Frontplane/Ariva.Web

      - script: npm run check
        displayName: 'Web: npm run check'
        workingDirectory: Platform/Frontplane/Ariva.Web

      - script: npm run lint
        displayName: 'Web: npm run lint'
        workingDirectory: Platform/Frontplane/Ariva.Web

      - script: npm run build
        displayName: 'Web: npm run build'
        workingDirectory: Platform/Frontplane/Ariva.Web

      # ARV-096: dependencies audited, dev dependencies included, failing on high or critical (as ci.yml).
      - script: npm audit --audit-level=high
        displayName: 'Web: npm audit (dev dependencies included)'
        workingDirectory: Platform/Frontplane/Ariva.Web

      # 5. API end-to-end and Playwright functional tests. playwright.config.ts starts Ariva.Api.Main,
      #    Ariva.Api.Integration, Ariva.Api.Ingest, Ariva.Simulation.Api and the web preview server itself.
      - script: npm ci
        displayName: 'E2E: npm ci'
        workingDirectory: Platform/Testing/Ariva.E2E

      - script: npm audit --audit-level=high
        displayName: 'E2E: npm audit'
        workingDirectory: Platform/Testing/Ariva.E2E

      - script: npx playwright install --with-deps chromium
        displayName: 'E2E: install Chromium'
        workingDirectory: Platform/Testing/Ariva.E2E

      # Sign-in (ARV-010a) needs PostgreSQL: the hosts migrate it at startup and Ariva.Api.Main seeds the E2E accounts.
      # Same image as ci.yml, pinned by the chart's tag and digest (scripts/base-images.mjs keeps every copy equal); the
      # password is per run and dies with the container.
      - script: |
          docker run -d --name ariva-e2e-db -p 5433:5432 -e POSTGRES_PASSWORD="e2e-$(Build.BuildId)" timescale/timescaledb-ha:pg17-ts2.30@sha256:2fcc39a5d4c8a65f58691ef92c7819df5773db72397b2dd8493f114659b519c2
          for attempt in $(seq 1 60); do docker exec ariva-e2e-db pg_isready -U postgres && exit 0; sleep 2; done
          echo "PostgreSQL did not start"; exit 1
        displayName: 'E2E: start PostgreSQL'

      - script: npx playwright test
        displayName: 'E2E: API and functional tests'
        workingDirectory: Platform/Testing/Ariva.E2E
        env:
          CI: 'true'
          ARIVA_E2E_CONFIGURATION: $(BuildConfiguration)
          ARIVA_E2E_SCHEMA_UPDATE: 'true'
          Database__Host: localhost
          Database__Port: '5433'
          Database__Name: postgres
          Database__Migration__Username: postgres
          Database__Migration__Password: e2e-$(Build.BuildId)
          Database__Username: ariva_app
          Database__Password: e2e-runtime-login-$(Build.BuildId)

      # 6. Reports, published whatever the outcome.
      - task: PublishPipelineArtifact@1
        displayName: 'Publish security report'
        condition: always()
        inputs:
          targetPath: '.verify/security-report.md'
          artifact: 'security-report'
          publishLocation: 'pipeline'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Playwright report'
        condition: always()
        inputs:
          targetPath: 'Platform/Testing/Ariva.E2E/playwright-report'
          artifact: 'playwright-report'
          publishLocation: 'pipeline'
