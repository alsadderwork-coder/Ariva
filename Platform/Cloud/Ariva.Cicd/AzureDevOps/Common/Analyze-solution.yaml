# Pull request validation for Ariva. Attach it to trunk as a build validation branch policy
# (Azure Repos runs PR validation through branch policies, not a YAML pr trigger).
# Order: security gate, .NET build, unit and integration tests, web checks, API end-to-end and Playwright
# functional tests; the security report and the Playwright HTML report are published even when a step fails (the report only
# when it holds no secret, ARV-152).
name: $(date:yyyyMMdd)$(rev:rr)

trigger: none
resources:
  repositories:
    - repository: self
      type: git
      ref: $(Build.SourceBranch)

variables:
  BuildConfiguration: 'Release'

jobs:
  - job: Phase_1
    displayName: Analyze
    timeoutInMinutes: 60
    pool:
      name: Default
      # Linux on x64 (ARV-096): Ariva.AppHost and Ariva.UnitTests keep one lock file per build platform and only
      # packages.linux-x64.lock.json is committed, so a locked restore on another architecture would find no lock file.
      demands:
        - Agent.OS -equals Linux
        - Agent.OSArchitecture -equals X64
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: 'Use Node 22'
        inputs:
          versionSpec: '22.x'

      # 1. Security gate (docs/security/cwe-controls.md). The self-test proves every rule fires on the bad
      #    fixtures and stays quiet on the good ones before the real scan is trusted.
      - script: node scripts/security/scan.mjs --self-test
        displayName: 'Security: scanner self-test'

      - script: node scripts/security/scan.mjs
        displayName: 'Security: scan (writes .verify/security-report.md)'

      # ARV-152 (CWE-532): no E2E spec passes an answer's body as an expect message (Playwright keeps it as the step title
      # even when the assertion passes), and the artifact check run before the report is published is proven first.
      - script: |
          node Platform/Testing/Ariva.E2E/scripts/expect-messages.mjs --self-test
          node Platform/Testing/Ariva.E2E/scripts/expect-messages.mjs
          node Platform/Testing/Ariva.E2E/scripts/artifact-secrets.mjs --self-test
        displayName: 'Security: E2E expect messages and artifact secret check self-test'

      # The check every host image build runs on its publish output (ARV-184): proven here before the images trust it.
      - script: node scripts/published-runtime.mjs --self-test
        displayName: 'Security: published runtime check self-test'

      # 2. .NET build; the CWE analyzers in .editorconfig run as errors.
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '10.x'
          includePreviewVersions: false

      # ARV-096: the repository's nuget.config (nuget.org only, with package source mapping) and locked mode, as in ci.yml.
      # Directory.Build.props turns locked mode on for every restore and build on an agent (TF_BUILD); a package graph that
      # differs from the committed packages.lock.json files, or a package whose content differs from its recorded hash, fails.
      - task: DotNetCoreCLI@2
        displayName: 'Dotnet Restore (locked)'
        inputs:
          command: 'restore'
          projects: 'Ariva.slnx'
          feedsToUse: 'config'
          nugetConfigPath: 'nuget.config'
          restoreArguments: '--locked-mode'

      - task: DotNetCoreCLI@2
        displayName: 'Dotnet Build'
        inputs:
          command: 'build'
          projects: 'Ariva.slnx'
          arguments: '--configuration $(BuildConfiguration) --no-restore'

      # 3. Unit tests (architecture, security and domain; the hosts boot in memory with WebApplicationFactory).
      - task: DotNetCoreCLI@2
        displayName: 'Dotnet Test'
        inputs:
          command: 'test'
          projects: |
            Platform/Backplane/Ariva.UnitTests/Ariva.UnitTests.csproj
            Platform/Backplane/Ariva.IntegrationTests/Ariva.IntegrationTests.csproj
          arguments: '--configuration $(BuildConfiguration) --no-build'
          publishTestResults: true

      # 4. Web: type check, formatting and the production build (which writes the CSP into build/nginx/default.conf).
      - script: npm ci
        displayName: 'Web: npm ci'
        workingDirectory: Platform/Frontplane/Ariva.Web

      - script: npm run check
        displayName: 'Web: npm run check'
        workingDirectory: Platform/Frontplane/Ariva.Web

      - script: npm run lint
        displayName: 'Web: npm run lint'
        workingDirectory: Platform/Frontplane/Ariva.Web

      - script: npm run build
        displayName: 'Web: npm run build'
        workingDirectory: Platform/Frontplane/Ariva.Web

      # ARV-096: dependencies audited, dev dependencies included, failing on high or critical (as ci.yml).
      - script: npm audit --audit-level=high
        displayName: 'Web: npm audit (dev dependencies included)'
        workingDirectory: Platform/Frontplane/Ariva.Web

      # 5. API end-to-end and Playwright functional tests. playwright.config.ts starts Ariva.Api.Main,
      #    Ariva.Api.Integration, Ariva.Api.Ingest, Ariva.Simulation.Api and the web preview server itself.
      - script: npm ci
        displayName: 'E2E: npm ci'
        workingDirectory: Platform/Testing/Ariva.E2E

      - script: npm audit --audit-level=high
        displayName: 'E2E: npm audit'
        workingDirectory: Platform/Testing/Ariva.E2E

      - script: npx playwright install --with-deps chromium
        displayName: 'E2E: install Chromium'
        workingDirectory: Platform/Testing/Ariva.E2E

      # Sign-in (ARV-010a) needs PostgreSQL: the hosts migrate it at startup and Ariva.Api.Main seeds the E2E accounts.
      # Same image as ci.yml, pinned by the chart's tag and digest (scripts/base-images.mjs keeps every copy equal); the
      # password is per run and dies with the container.
      - script: |
          docker run -d --name ariva-e2e-db -p 5433:5432 -e POSTGRES_PASSWORD="e2e-$(Build.BuildId)" timescale/timescaledb-ha:pg17-ts2.31@sha256:cae378810532f8402c306d5a2bc6acc2c7550193d12f2b5ef9b2532efe0e98c0
          for attempt in $(seq 1 60); do docker exec ariva-e2e-db pg_isready -U postgres && exit 0; sleep 2; done
          echo "PostgreSQL did not start"; exit 1
        displayName: 'E2E: start PostgreSQL'

      # ARV-092b: Ariva.Api.Main streams every upload to clamd before it stores it, as in ci.yml: the same pinned image with
      # the repository's clamd.conf (Ariva's limits) read-only, offline (no freshclam), on loopback only. It holds about 1 GiB
      # and answers PING about 20 seconds after it starts.
      - script: |
          docker run -d --name ariva-e2e-clamd -p 127.0.0.1:3310:3310 -e CLAMAV_NO_FRESHCLAMD=true -v "$(Build.SourcesDirectory)/Platform/Cloud/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" clamav/clamav:1.4.6@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
          for attempt in $(seq 1 60); do [ "$(echo PING | nc -w 3 127.0.0.1 3310 2>/dev/null)" = "PONG" ] && exit 0; sleep 3; done
          echo "clamd did not answer PING with PONG on 127.0.0.1:3310 within three minutes"; docker logs --tail 40 ariva-e2e-clamd; exit 1
        displayName: 'E2E: start clamd'

      # ARV-152: the run's account seed as a secret variable (playwright.config.ts keeps a seed it is given), so the artifact
      # check below can derive the run's E2E account passwords and TOTP seeds and look for them. The run's other secrets
      # (simulator, mock AMAN, ACRIS and Cronz keys, the validation reader's password) are derived from it too and set as
      # variables the later steps receive (playwright.config.ts keeps a value it is given). Every value derived from the seed
      # is registered as a secret first (task.setsecret), so a failing assertion that prints one is masked in the log.
      # Stop at the first failure: Azure's script step runs on after a failing command, and the derived values must never be
      # set (--env) unless they were registered as secrets first (--mask).
      - script: |
          set -euo pipefail
          seed="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          echo "##vso[task.setvariable variable=E2E_ACCOUNT_SEED;issecret=true]$seed"
          ARIVA_E2E_ACCOUNT_SEED="$seed" node Platform/Testing/Ariva.E2E/scripts/artifact-secrets.mjs --mask azure
          ARIVA_E2E_ACCOUNT_SEED="$seed" node Platform/Testing/Ariva.E2E/scripts/artifact-secrets.mjs --env azure
        displayName: 'E2E: account seed for the run (secret variable)'

      - script: npx playwright test
        displayName: 'E2E: API and functional tests'
        workingDirectory: Platform/Testing/Ariva.E2E
        env:
          CI: 'true'
          ARIVA_E2E_ACCOUNT_SEED: $(E2E_ACCOUNT_SEED)
          ARIVA_E2E_CONFIGURATION: $(BuildConfiguration)
          ARIVA_E2E_SCHEMA_UPDATE: 'true'
          ARIVA_E2E_CLAMD: 127.0.0.1:3310
          Database__Host: localhost
          Database__Port: '5433'
          Database__Name: postgres
          Database__Migration__Username: postgres
          Database__Migration__Password: e2e-$(Build.BuildId)
          Database__Username: ariva_app
          Database__Password: e2e-runtime-login-$(Build.BuildId)

      # ARV-152 (CWE-532): no credential in the Playwright report (with its embedded zip) or the test output (traces, error
      # contexts, attachments), whatever the outcome; only when it finds none is the report published below. A finding fails
      # the run and names the file and the kind, never the value.
      # The result is this step's own output variable (e2eArtifacts.clean), which no queue-time variable can preset; an
      # unexpanded $(E2E_ACCOUNT_SEED) (the seed step did not run) counts as no seed, so --require-seed fails on it.
      - script: node scripts/artifact-secrets.mjs --require-seed playwright-report test-results && echo "##vso[task.setvariable variable=clean;isOutput=true]true"
        name: e2eArtifacts
        displayName: 'E2E: no secret in the report or the test output'
        condition: always()
        workingDirectory: Platform/Testing/Ariva.E2E
        env:
          ARIVA_E2E_ACCOUNT_SEED: $(E2E_ACCOUNT_SEED)
          Database__Migration__Password: e2e-$(Build.BuildId)
          Database__Password: e2e-runtime-login-$(Build.BuildId)

      # 6. Reports, published whatever the outcome (the Playwright report only once the check above found no secret in it).
      - task: PublishPipelineArtifact@1
        displayName: 'Publish security report'
        condition: always()
        inputs:
          targetPath: '.verify/security-report.md'
          artifact: 'security-report'
          publishLocation: 'pipeline'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Playwright report'
        condition: and(always(), eq(variables['e2eArtifacts.clean'], 'true'))
        inputs:
          targetPath: 'Platform/Testing/Ariva.E2E/playwright-report'
          artifact: 'playwright-report'
          publishLocation: 'pipeline'
