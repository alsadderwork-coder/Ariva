name: $(Build.SourceBranchName)-$(date:yyyyMMdd)$(rev:rr)

trigger:
  branches:
    include:
      - refs/heads/main
  paths:
    include:
    - Platform/Backplane/Ariva.Core
    - Platform/Backplane/Ariva.Infra
    - Platform/Backplane/Ariva.Di
    - Platform/Backplane/Ariva.Utilities
    - Platform/Backplane/Ariva.Api.Common
    - Platform/Backplane/Ariva.Api.Integration
    - Platform/Backplane/Ariva.Resources
    - Platform/Backplane/Ariva.ServiceDefaults
    - Platform/Business/Ariva.Business.Contracts
    - nuget.config
    - Directory.Build.props
    - Directory.Packages.props


  batch: True

variables:
 - name: artifact-name
   value: api-integration

resources:
  repositories:
  - repository: self
    type: git
    ref: $(Build.SourceBranch)
  pipelines:
  - pipeline: Build-k8s-all
    source: Build-k8s-all
    trigger: true


jobs:
- job: Phase_1
  displayName: Deploy
  pool:
    name: Default
    demands:
    - Agent.OS -equals Linux
  steps:
  - checkout: self
    clean: true

  - task: Docker@2
    displayName: Build Docker Image
    inputs:
      containerRegistry: 'Dalil Container Registry'
      repository: 'ariva/$(artifact-name)'
      command: 'buildAndPush'
      Dockerfile: 'Platform/Backplane/Ariva.Api.Integration/Dockerfile'
      buildContext: '.'
      tags: |
        $(Build.SourceBranchName)
        $(Build.BuildNumber)
      addBaseImageData: false
