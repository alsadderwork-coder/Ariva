# Release Ariva to the k8s-dev namespace with helmfile.
# Variable group "ariva" must hold (as secrets):
#   JUPITER-KUBECONFIG-B64                 base64 kubeconfig for the cluster
#   ACR-USERNAME, ACR-PASSWORD             registry credentials this pipeline writes into the pull secret dalilacr-secret
#                                          (ARV-209: never a Helm value, which Helm keeps in its release record)
#   ARIVA-K8S-DEV-BASE-APPSETTINGS         appsettings.base.k8s-dev.json content, without any password or secret (ARV-083b: every
#                                          pod mounts it, so every host and job refuses to start while it gives one; no user or
#                                          password in Redis:ConnectionString either)
#   ARIVA-K8S-DEV-<SERVICE>-APPSETTINGS    appsettings.service.k8s-dev.json content per service
#   ARIVA-K8S-DEV-DB-SUPERUSER-PASSWORD    TimescaleDB "postgres" superuser (database administrator only)
#   ARIVA-K8S-DEV-DB-MIGRATION-PASSWORD    TimescaleDB migration login; the migration job reads it from the timescaledb-credentials
#                                          Secret this pipeline writes (key migration-password; the chart's migration.passwordSecret,
#                                          ARV-083b), never from the base appsettings
#   ARIVA-K8S-DEV-KAFKA-<HOST>-USERNAME, ARIVA-K8S-DEV-KAFKA-<HOST>-PASSWORD
#   ARIVA-K8S-DEV-REDIS-<HOST>-USERNAME, ARIVA-K8S-DEV-REDIS-<HOST>-PASSWORD
#                                          each host's own Kafka principal and Redis ACL user (ARV-083b), <HOST> one of MAIN,
#                                          INGEST, STREAM, CRONZ and INTEGRATION, and for Kafka also TOPICS, the topics job's own
#                                          principal: twenty-two variables, each name its own (letters, digits, dot, underscore,
#                                          hyphen) and each password its own (no database password either), 16 printable ASCII
#                                          characters or more without a space; this pipeline writes them into the Secrets
#                                          ariva-kafka-<host>, ariva-kafka-topics and ariva-redis-<host>. Optional in k8s-dev (its brokers may be
#                                          plaintext and its Redis without users): a pair left out entirely is skipped with a
#                                          warning, half a pair fails the release. The site's administrators grant each the ACLs
#                                          of wiki 04 section 6.2a
#   ARIVA-K8S-DEV-DB-LOGIN-<LOGIN>-USERNAME, ARIVA-K8S-DEV-DB-LOGIN-<LOGIN>-PASSWORD
#                                          each host's own database login and the availability ledger's (ARV-083a), <LOGIN> one
#                                          of MAIN, INGEST, STREAM, CRONZ, INTEGRATION and AVAILABILITY: twelve variables, each
#                                          name a plain lower-case identifier of its own (ariva_app_main, for one) and each
#                                          password its own, 16 printable ASCII characters or more; this pipeline writes them
#                                          into the Secrets ariva-db-login-<login>, and the migration job creates the logins
# Both database passwords are read only when the database volume is first initialised (wiki 04, section 6.2).
name: $(Build.SourceBranchName)-$(NAMESPACE)-$(Date:yyyyMMdd)$(Rev:rr)

trigger: none

variables:
  - group: ariva
  - name: ENVIRONMENT
    value: "k8s-dev"
  - name: NAMESPACE
    value: "ariva-k8s-dev"
  - name: K8SCLUSTERCONTEXT
    value: "jupiter"
  # The image tag to deploy. The Build-k8s-<service> pipelines tag every image with the branch name ("main") and the
  # build number (main-yyyyMMddrr); override it when queueing the run to deploy a specific build.
  - name: BUILD_NUMBER
    value: "main"

pool:
  name: Default
  demands:
    - Agent.OS -equals Linux

steps:
  - checkout: self
    clean: true
    persistCredentials: true

  - script: |
      if command -v kubectl >/dev/null 2>&1; then
        echo "kubectl is already installed. Skipping."
        kubectl version --client
      else
        echo "Installing kubectl..."
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/kubectl
        kubectl version --client
      fi
    displayName: "Install kubectl (if needed)"

  - script: |
      HELM_VERSION="3.19.0"
      if command -v helm >/dev/null 2>&1 && helm version --short | grep -q "v${HELM_VERSION}"; then
        echo "Helm v${HELM_VERSION} is already installed. Skipping."
      else
        echo "Installing Helm v${HELM_VERSION}..."
        curl -LO "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
        tar -xzf helm-v${HELM_VERSION}-linux-amd64.tar.gz
        chmod +x linux-amd64/helm
        sudo mv linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v${HELM_VERSION}-linux-amd64.tar.gz
      fi
      helm version --short
    displayName: "Install Helm 3.19.0 (if needed)"

  - script: |
      HELMFILE_VERSION="1.1.7"
      if command -v helmfile >/dev/null 2>&1 && helmfile --version | grep -q "v${HELMFILE_VERSION}"; then
        echo "Helmfile v${HELMFILE_VERSION} is already installed. Skipping."
      else
        echo "Installing Helmfile v${HELMFILE_VERSION}..."
        curl -L "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" -o helmfile.tar.gz
        tar -xzf helmfile.tar.gz
        chmod +x helmfile
        sudo mv helmfile /usr/local/bin/helmfile
        rm -f helmfile.tar.gz
      fi
      helmfile --version
      helm plugin list | grep -q '^diff' || helm plugin install https://github.com/databus23/helm-diff --version v3.13.0
    displayName: "Install Helmfile v1.1.7 and Helm Diff (if needed)"

  - script: |
      mkdir -p $(Build.SourcesDirectory)/_cicd
      mkdir -p $(Build.SourcesDirectory)/_cicd/api-main
      mkdir -p $(Build.SourcesDirectory)/_cicd/api-ingest
      mkdir -p $(Build.SourcesDirectory)/_cicd/api-stream
      mkdir -p $(Build.SourcesDirectory)/_cicd/api-cronz
      mkdir -p $(Build.SourcesDirectory)/_cicd/api-integration
      mkdir -p $(Build.SourcesDirectory)/_cicd/simulation
      echo "$(JUPITER-KUBECONFIG-B64)" | base64 --decode > $(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml
    displayName: "Isolated KubeConfig Setup"

  - script: |
      echo '$(ARIVA-K8S-DEV-BASE-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/appsettings.base.$(ENVIRONMENT).json
      echo '$(ARIVA-K8S-DEV-API-MAIN-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/api-main/appsettings.service.$(ENVIRONMENT).json
      echo '$(ARIVA-K8S-DEV-API-INGEST-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/api-ingest/appsettings.service.$(ENVIRONMENT).json
      echo '$(ARIVA-K8S-DEV-API-STREAM-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/api-stream/appsettings.service.$(ENVIRONMENT).json
      echo '$(ARIVA-K8S-DEV-API-CRONZ-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/api-cronz/appsettings.service.$(ENVIRONMENT).json
      echo '$(ARIVA-K8S-DEV-API-INTEGRATION-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/api-integration/appsettings.service.$(ENVIRONMENT).json
      echo '$(ARIVA-K8S-DEV-SIMULATION-APPSETTINGS)' > $(Build.SourcesDirectory)/_cicd/simulation/appsettings.service.$(ENVIRONMENT).json
    displayName: "Write appsettings to files"

  - script: |
      set -e
      export KUBECONFIG="$(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml"

      kubectl create namespace $(NAMESPACE) --dry-run=client -o yaml | kubectl apply -f -

      kubectl create secret generic base-appsettings-secret \
        --from-file=appsettings.base.$(ENVIRONMENT).json=$(Build.SourcesDirectory)/_cicd/appsettings.base.$(ENVIRONMENT).json \
        --namespace=$(NAMESPACE) --dry-run=client -o yaml | kubectl apply -f -

      for svc in api-main api-ingest api-stream api-cronz api-integration simulation; do
        kubectl create secret generic ${svc}-appsettings-secret \
          --from-file=appsettings.service.$(ENVIRONMENT).json=$(Build.SourcesDirectory)/_cicd/${svc}/appsettings.service.$(ENVIRONMENT).json \
          --namespace=$(NAMESPACE) --dry-run=client -o yaml | kubectl apply -f -
      done
    displayName: "Create Kubernetes secrets"

  # The TimescaleDB release's credentials (ARV-062). The passwords reach the step as environment variables and the
  # secret through files, never through a command line.
  - script: |
      set -e
      export KUBECONFIG="$(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml"
      # An undefined variable reaches the step as its own macro text, which is public in this file: refuse it, and any
      # password under 16 characters, before the database is initialised with it (V13.2.3, no default credentials).
      for name in DB_SUPERUSER_PASSWORD DB_MIGRATION_PASSWORD; do
        value="${!name}"
        # Written as \$\( so Azure DevOps does not read it as a macro.
        if [[ "$value" == \$\(* ]]; then
          echo "##vso[task.logissue type=error]$name is not defined in the variable group"; exit 1
        fi
        if [ "${#value}" -lt 16 ]; then
          echo "##vso[task.logissue type=error]$name must have at least 16 characters"; exit 1
        fi
      done
      umask 077
      trap 'rm -f "$(Build.SourcesDirectory)/_cicd/db-superuser-password" "$(Build.SourcesDirectory)/_cicd/db-migration-password"' EXIT
      printf '%s' "$DB_SUPERUSER_PASSWORD" > "$(Build.SourcesDirectory)/_cicd/db-superuser-password"
      printf '%s' "$DB_MIGRATION_PASSWORD" > "$(Build.SourcesDirectory)/_cicd/db-migration-password"
      kubectl create secret generic timescaledb-credentials \
        --from-file=superuser-password=$(Build.SourcesDirectory)/_cicd/db-superuser-password \
        --from-file=migration-password=$(Build.SourcesDirectory)/_cicd/db-migration-password \
        --namespace=$(NAMESPACE) --dry-run=client -o yaml | kubectl apply -f -
    displayName: "Create the TimescaleDB credentials secret"
    env:
      DB_SUPERUSER_PASSWORD: $(ARIVA-K8S-DEV-DB-SUPERUSER-PASSWORD)
      DB_MIGRATION_PASSWORD: $(ARIVA-K8S-DEV-DB-MIGRATION-PASSWORD)

  # ARV-209 (crypto inventory K40): the registry pull secret, written here from the pipeline's secrets and never given to
  # Helm as a value (Helm keeps every value in its release record, readable by anyone who can read the namespace's Secrets).
  # The credentials reach the step as environment variables (unset once the auth field is built) and the Secret through a
  # file in the agent's temporary folder (0600, removed on exit), never through a command line; the docker config holds only
  # the base64 auth field, so no character of the password needs JSON escaping. The Secret is applied server side under
  # this release's own field manager, against the pipeline's cluster context, which writes no last-applied-configuration
  # annotation. A client-side apply writes one, holding a whole copy of the Secret's data, and a server-side apply leaves an
  # existing one in place; the archived GitHub release wrote dalilacr-secret with a client-side apply, so the step removes
  # that annotation, or the old credential's copy would outlive its rotation. A secret an earlier release let the chart
  # render is taken out of Helm's hands (its ownership annotations and label removed, resource-policy keep), so the next
  # upgrade, whose chart no longer renders it, does not delete it. Helm's earlier release records still hold the password
  # that release was given: rotate it after the first release with this step (wiki 04 section 6.2), and never roll back to a
  # revision older than it.
  - script: |
      set -e
      export KUBECONFIG="$(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml"
      for name in ACR_USERNAME ACR_PASSWORD; do
        value="${!name}"
        # Written as \$\( so Azure DevOps does not read it as a macro.
        if [[ -z "$value" || "$value" == \$\(* ]]; then
          echo "##vso[task.logissue type=error]$name is not defined in the variable group"; exit 1
        fi
      done
      if [[ "$ACR_USERNAME" == *:* ]]; then
        echo "##vso[task.logissue type=error]ACR_USERNAME must not contain a colon"; exit 1
      fi
      umask 077
      config="$(Agent.TempDirectory)/registry-dockerconfig.json"
      trap 'rm -f "$config"' EXIT
      auth="$(printf '%s:%s' "$ACR_USERNAME" "$ACR_PASSWORD" | base64 -w0)"
      printf '{"auths":{"dalil.azurecr.io":{"auth":"%s"}}}' "$auth" > "$config"
      unset auth value ACR_USERNAME ACR_PASSWORD
      kubectl create secret generic dalilacr-secret --type=kubernetes.io/dockerconfigjson \
        --from-file=.dockerconfigjson="$config" \
        --namespace="$(NAMESPACE)" --dry-run=client -o yaml \
        | kubectl apply --context="$(K8SCLUSTERCONTEXT)" --server-side --force-conflicts --field-manager=ariva-release -f -
      rm -f "$config"
      kubectl annotate secret dalilacr-secret --context="$(K8SCLUSTERCONTEXT)" --namespace="$(NAMESPACE)" --overwrite \
        meta.helm.sh/release-name- meta.helm.sh/release-namespace- kubectl.kubernetes.io/last-applied-configuration- \
        helm.sh/resource-policy=keep
      kubectl label secret dalilacr-secret --context="$(K8SCLUSTERCONTEXT)" --namespace="$(NAMESPACE)" app.kubernetes.io/managed-by-
    displayName: "Create the registry pull secret"
    env:
      ACR_USERNAME: $(ACR-USERNAME)
      ACR_PASSWORD: $(ACR-PASSWORD)

  # ARV-083a: each host's database login and the availability ledger's, one Secret each (the chart's databaseLogins:
  # ariva-db-login-<login>, keys username and password), which only that host and the migration job get. The names and
  # passwords reach the step as environment variables and each Secret through files in the agent's temporary folder (0600,
  # removed on exit), never through a command line or the log (a failure names the variable, never its value), and each
  # Secret is applied server side under this release's own field manager, so no last-applied-configuration annotation keeps
  # a copy of it. The migration job creates or updates each login from a SCRAM-SHA-256 verifier and stops before any script
  # when two logins share a name or a password (wiki 04 section 6.2).
  - script: |
      set -e
      export KUBECONFIG="$(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml"
      umask 077
      folder="$(Agent.TempDirectory)/db-logins"
      trap 'rm -rf "$folder"' EXIT
      mkdir -p "$folder"
      for login in MAIN INGEST STREAM CRONZ INTEGRATION AVAILABILITY; do
        user_variable="DB_LOGIN_${login}_USERNAME"
        password_variable="DB_LOGIN_${login}_PASSWORD"
        user="${!user_variable}"
        password="${!password_variable}"
        # Written as \$\( so Azure DevOps does not read it as a macro.
        if [[ -z "$user" || "$user" == \$\(* || -z "$password" || "$password" == \$\(* ]]; then
          echo "##vso[task.logissue type=error]$user_variable or $password_variable is not defined in the variable group"; exit 1
        fi
        if [[ ! "$user" =~ ^[a-z_][a-z0-9_]{0,62}$ || "$user" == pg_* ]]; then
          echo "##vso[task.logissue type=error]$user_variable must be a plain lower-case PostgreSQL identifier, not pg_"; exit 1
        fi
        # Printable ASCII only (space to tilde, no newline): the migration job derives the verifier without SASLprep.
        if [ "${#password}" -lt 16 ] || ( LC_ALL=C; [[ "$password" =~ [^\ -~] ]] ); then
          echo "##vso[task.logissue type=error]$password_variable must have at least 16 printable ASCII characters"; exit 1
        fi
        printf '%s' "$user" > "$folder/username"
        printf '%s' "$password" > "$folder/password"
        kubectl create secret generic "ariva-db-login-${login,,}" \
          --from-file=username="$folder/username" --from-file=password="$folder/password" \
          --namespace="$(NAMESPACE)" --dry-run=client -o yaml \
          | kubectl apply --context="$(K8SCLUSTERCONTEXT)" --server-side --force-conflicts --field-manager=ariva-release -f -
        rm -f "$folder/username" "$folder/password"
      done
      unset user password
    displayName: "Create the host database login secrets"
    env:
      DB_LOGIN_MAIN_USERNAME: $(ARIVA-K8S-DEV-DB-LOGIN-MAIN-USERNAME)
      DB_LOGIN_MAIN_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-MAIN-PASSWORD)
      DB_LOGIN_INGEST_USERNAME: $(ARIVA-K8S-DEV-DB-LOGIN-INGEST-USERNAME)
      DB_LOGIN_INGEST_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-INGEST-PASSWORD)
      DB_LOGIN_STREAM_USERNAME: $(ARIVA-K8S-DEV-DB-LOGIN-STREAM-USERNAME)
      DB_LOGIN_STREAM_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-STREAM-PASSWORD)
      DB_LOGIN_CRONZ_USERNAME: $(ARIVA-K8S-DEV-DB-LOGIN-CRONZ-USERNAME)
      DB_LOGIN_CRONZ_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-CRONZ-PASSWORD)
      DB_LOGIN_INTEGRATION_USERNAME: $(ARIVA-K8S-DEV-DB-LOGIN-INTEGRATION-USERNAME)
      DB_LOGIN_INTEGRATION_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-INTEGRATION-PASSWORD)
      DB_LOGIN_AVAILABILITY_USERNAME: $(ARIVA-K8S-DEV-DB-LOGIN-AVAILABILITY-USERNAME)
      DB_LOGIN_AVAILABILITY_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-AVAILABILITY-PASSWORD)

  # ARV-083b: each host's Kafka principal and Redis ACL user, one Secret each (the chart's kafkaLogins and redisLogins:
  # ariva-kafka-<host> and ariva-redis-<host>, keys username and password), which only that host gets, and the topics job's own
  # Kafka principal (ariva-kafka-topics, the chart's kafkaTopics.adminSecretName; k8s-dev uses it once that value names it,
  # api-main's principal until then). As the host database login step above: the names and passwords reach the step as
  # environment variables and each Secret through files in the agent's temporary folder (0600, removed on exit), never through a
  # command line or the log (a failure names the variable, never its value), each Secret applied server side under this
  # release's own field manager. Refused (the ARV-083b review): two principals or two Redis users with one name, and a password
  # that is another credential's, the database passwords included. Optional in k8s-dev: a pair left out entirely is skipped (the
  # chart's secrets are optional outside k8s-prd), half a pair fails.
  - script: |
      set -e
      export KUBECONFIG="$(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml"
      umask 077
      folder="$(Agent.TempDirectory)/host-credentials"
      trap 'rm -rf "$folder"' EXIT
      mkdir -p "$folder"
      # Every password of the release seen so far: the database's, then each credential written below.
      seen=()
      for name in DB_SUPERUSER_PASSWORD DB_MIGRATION_PASSWORD DB_LOGIN_MAIN_PASSWORD DB_LOGIN_INGEST_PASSWORD DB_LOGIN_STREAM_PASSWORD \
          DB_LOGIN_CRONZ_PASSWORD DB_LOGIN_INTEGRATION_PASSWORD DB_LOGIN_AVAILABILITY_PASSWORD; do
        value="${!name}"
        # Written as \$\( so Azure DevOps does not read it as a macro.
        if [[ -n "$value" && "$value" != \$\(* ]]; then seen+=("$value"); fi
      done
      declare -A users=()
      for pair in KAFKA:MAIN KAFKA:INGEST KAFKA:STREAM KAFKA:CRONZ KAFKA:INTEGRATION KAFKA:TOPICS \
          REDIS:MAIN REDIS:INGEST REDIS:STREAM REDIS:CRONZ REDIS:INTEGRATION; do
        kind="${pair%%:*}"
        host="${pair##*:}"
        user_variable="${kind}_${host}_USERNAME"
        password_variable="${kind}_${host}_PASSWORD"
        user="${!user_variable}"
        password="${!password_variable}"
        [[ "$user" == \$\(* ]] && user=""
        [[ "$password" == \$\(* ]] && password=""
        if [[ -z "$user" && -z "$password" ]]; then
          echo "##vso[task.logissue type=warning]$user_variable and $password_variable are not defined: ariva-${kind,,}-${host,,} is not written"; continue
        fi
        if [[ -z "$user" || -z "$password" ]]; then
          echo "##vso[task.logissue type=error]$user_variable and $password_variable are defined together or not at all"; exit 1
        fi
        if [[ ! "$user" =~ ^[A-Za-z0-9._-]{1,128}$ || "$user" == default ]]; then
          echo "##vso[task.logissue type=error]$user_variable must be letters, digits, dot, underscore or hyphen, and never Redis's default user"; exit 1
        fi
        if [[ -n "${users[$kind:$user]:-}" ]]; then
          echo "##vso[task.logissue type=error]$user_variable names what ${users[$kind:$user]} names: each principal and each Redis user has a name of its own"; exit 1
        fi
        users["$kind:$user"]="$user_variable"
        # Printable ASCII without a space: the same password works in a SCRAM user and a Redis ACL rule.
        if [ "${#password}" -lt 16 ] || ( LC_ALL=C; [[ "$password" =~ [^!-~] ]] ); then
          echo "##vso[task.logissue type=error]$password_variable must have at least 16 printable ASCII characters without a space"; exit 1
        fi
        for other in "${seen[@]}"; do
          if [[ "$other" == "$password" ]]; then
            echo "##vso[task.logissue type=error]$password_variable is another credential's password: each has its own"; exit 1
          fi
        done
        seen+=("$password")
        printf '%s' "$user" > "$folder/username"
        printf '%s' "$password" > "$folder/password"
        kubectl create secret generic "ariva-${kind,,}-${host,,}" \
          --from-file=username="$folder/username" --from-file=password="$folder/password" \
          --namespace="$(NAMESPACE)" --dry-run=client -o yaml \
          | kubectl apply --context="$(K8SCLUSTERCONTEXT)" --server-side --force-conflicts --field-manager=ariva-release -f -
        rm -f "$folder/username" "$folder/password"
      done
      unset user password value seen users
    displayName: "Create the host Kafka and Redis credential secrets"
    env:
      KAFKA_MAIN_USERNAME: $(ARIVA-K8S-DEV-KAFKA-MAIN-USERNAME)
      KAFKA_MAIN_PASSWORD: $(ARIVA-K8S-DEV-KAFKA-MAIN-PASSWORD)
      KAFKA_INGEST_USERNAME: $(ARIVA-K8S-DEV-KAFKA-INGEST-USERNAME)
      KAFKA_INGEST_PASSWORD: $(ARIVA-K8S-DEV-KAFKA-INGEST-PASSWORD)
      KAFKA_STREAM_USERNAME: $(ARIVA-K8S-DEV-KAFKA-STREAM-USERNAME)
      KAFKA_STREAM_PASSWORD: $(ARIVA-K8S-DEV-KAFKA-STREAM-PASSWORD)
      KAFKA_CRONZ_USERNAME: $(ARIVA-K8S-DEV-KAFKA-CRONZ-USERNAME)
      KAFKA_CRONZ_PASSWORD: $(ARIVA-K8S-DEV-KAFKA-CRONZ-PASSWORD)
      KAFKA_INTEGRATION_USERNAME: $(ARIVA-K8S-DEV-KAFKA-INTEGRATION-USERNAME)
      KAFKA_INTEGRATION_PASSWORD: $(ARIVA-K8S-DEV-KAFKA-INTEGRATION-PASSWORD)
      KAFKA_TOPICS_USERNAME: $(ARIVA-K8S-DEV-KAFKA-TOPICS-USERNAME)
      KAFKA_TOPICS_PASSWORD: $(ARIVA-K8S-DEV-KAFKA-TOPICS-PASSWORD)
      REDIS_MAIN_USERNAME: $(ARIVA-K8S-DEV-REDIS-MAIN-USERNAME)
      REDIS_MAIN_PASSWORD: $(ARIVA-K8S-DEV-REDIS-MAIN-PASSWORD)
      REDIS_INGEST_USERNAME: $(ARIVA-K8S-DEV-REDIS-INGEST-USERNAME)
      REDIS_INGEST_PASSWORD: $(ARIVA-K8S-DEV-REDIS-INGEST-PASSWORD)
      REDIS_STREAM_USERNAME: $(ARIVA-K8S-DEV-REDIS-STREAM-USERNAME)
      REDIS_STREAM_PASSWORD: $(ARIVA-K8S-DEV-REDIS-STREAM-PASSWORD)
      REDIS_CRONZ_USERNAME: $(ARIVA-K8S-DEV-REDIS-CRONZ-USERNAME)
      REDIS_CRONZ_PASSWORD: $(ARIVA-K8S-DEV-REDIS-CRONZ-PASSWORD)
      REDIS_INTEGRATION_USERNAME: $(ARIVA-K8S-DEV-REDIS-INTEGRATION-USERNAME)
      REDIS_INTEGRATION_PASSWORD: $(ARIVA-K8S-DEV-REDIS-INTEGRATION-PASSWORD)
      DB_SUPERUSER_PASSWORD: $(ARIVA-K8S-DEV-DB-SUPERUSER-PASSWORD)
      DB_MIGRATION_PASSWORD: $(ARIVA-K8S-DEV-DB-MIGRATION-PASSWORD)
      DB_LOGIN_MAIN_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-MAIN-PASSWORD)
      DB_LOGIN_INGEST_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-INGEST-PASSWORD)
      DB_LOGIN_STREAM_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-STREAM-PASSWORD)
      DB_LOGIN_CRONZ_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-CRONZ-PASSWORD)
      DB_LOGIN_INTEGRATION_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-INTEGRATION-PASSWORD)
      DB_LOGIN_AVAILABILITY_PASSWORD: $(ARIVA-K8S-DEV-DB-LOGIN-AVAILABILITY-PASSWORD)

  - script: |
      set -e
      export KUBECONFIG="$(Build.SourcesDirectory)/_cicd/jupiter-kube-config.yaml"
      helmfile apply \
        -f Platform/Cloud/Ariva.K8s/Helm/helmfile-k8s.yaml.gotmpl \
        -e dev \
        --state-values-set buildNumber=$(BUILD_NUMBER) \
        --namespace $(NAMESPACE) \
        --kube-context $(K8SCLUSTERCONTEXT) \
        --set releaseVersion=$(Build.BuildNumber)
    # Applies the timescaledb release first (waited for), then ariva-platform with its migration and Kafka topics jobs.
    displayName: "Version and Release"
