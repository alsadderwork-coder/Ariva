##
## ClamAV daemon settings for Ariva's malware scan of uploads (ARV-092b). docker-compose.dev.yml, the Aspire AppHost
## and the E2E jobs (ci.yml, security-zap.yml, Azure DevOps) mount this file read-only at /etc/clamav/clamd.conf over the
## pinned image's own (clamav/clamav:1.4.6). The image's defaults are kept; only OfficialDatabaseOnly and the size limits at the
## end are Ariva's. The chart renders its own clamd.conf beside api-main (ARV-092c) and its test holds these settings equal there.
## The image starts offline with CLAMAV_NO_FRESHCLAMD=true and scans with the signature snapshot it carries.
##

# The image's defaults.
LogFile /var/log/clamav/clamd.log
LogTime yes
# The image's start script (/init) waits for this socket before it reports clamd started: keep it.
LocalSocket /tmp/clamd.sock
# Ariva.Api.Main speaks INSTREAM over TCP (MalwareScan:Host, MalwareScan:Port). No TCPAddr: clamd listens on every
# address inside the container, and every run publishes the port on the machine's loopback address only. The image's
# health check (clamdcheck.sh) sends PING to localhost:3310 and expects PONG.
TCPSocket 3310
User clamav

# Only the signatures ClamAV publishes (main, daily, bytecode) are loaded, never an unsigned signature file someone put in the
# signature folder (.fp, .sfp, .ndb and the like, which could whitelist a threat or add verdicts of their own). Ignore lists
# (.ign2) still load.
OfficialDatabaseOnly yes

# Ariva's limits. The largest upload Ariva takes is a 100 MiB video, and Ariva.Api.Main refuses anything over
# MalwareScan:MaxStreamBytes (100 MiB) before it reaches clamd, so clamd must take a whole 100 MiB stream and scan it
# whole. 105M (the defaults are 100M) leaves room over that limit, so the largest upload never sits on clamd's own edge:
# clamd ends an INSTREAM longer than StreamMaxLength with an error, and treats a file over MaxFileSize as not scanned.
StreamMaxLength 105M
MaxFileSize 105M
# Archives and other containers are extracted and scanned up to this amount in all (the default).
MaxScanSize 400M
# Content clamd could not scan whole (over MaxFileSize, MaxScanSize or MaxRecursion) is reported as a detection
# (Heuristics.Limits.Exceeded.*) rather than clean, so Ariva refuses it instead of storing what was never scanned.
AlertExceedsMax yes
