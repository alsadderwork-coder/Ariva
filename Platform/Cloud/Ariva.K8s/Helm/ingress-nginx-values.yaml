# ingress-nginx controller values for a site that runs Ariva (ARV-084). The site's to apply, with its own release of the
# ingress-nginx Helm chart (kubernetes/ingress-nginx; written against chart 4.15.1, controller 1.15); Ariva's pipelines and
# tooling never install, upgrade or change the controller. Merge these keys into the site's controller values, for example
# as one more values file of the site's release. chart-security.mjs checks every key below (controllerValuesFindings in
# tests/checks.mjs), reading the file as Helm reads it (YAML 1.1: an unquoted on, yes or y is true, so every value below but true,
# false and a whole number is quoted, and the file carries no YAML tag such as !!binary or a site's own !site, directive, anchor,
# alias or second document; valuesTextFindings) and each value as the ingress-nginx chart renders it: it renders every ConfigMap value as a template and writes
# the ConfigMap keys, the controller's arguments and the top-level names unquoted, so the check refuses a "{{" in a ConfigMap
# value, a key that is not a plain name and a line break in any other setting of this file (ARV-288a). scripts/ops/tls-check.mjs
# checks the result on the live hosts in the release gate.
#
# The controller is shared: these settings reach every Ingress it serves. The two snippet settings let anyone who may create
# an Ingress for it write nginx configuration; where other teams create Ingresses, give Ariva a controller of its own. The
# Ariva chart refuses a list of directives in its own Ingresses' site annotations (templates/validate.yaml), which keeps a
# careless snippet out but cannot stop a deliberate author: that is the trust model these two settings state.
controller:
  # The Ariva chart's Ingresses carry server-snippet, configuration-snippet and modsecurity-snippet annotations (the response
  # headers, the 421 for other hosts, the plain HTTP refusal, the upload rule); without this the controller drops them. The
  # chart writes allow-snippet-annotations "true" into the controller's ConfigMap from this value: never also under config,
  # where the key would appear twice.
  allowSnippetAnnotations: true
  # Keep the admission webhook on (the chart's default): it tests the configuration of every Ingress before it is admitted,
  # so an Ingress that would break nginx is refused instead of stopping the controller's reloads.
  config:
    # Snippet annotations are Critical in ingress-nginx's annotation risk model (1.12 and later); at High, the default, the
    # controller refuses them.
    annotations-risk-level: "Critical"
    # TLS 1.2 and 1.3 only (ASVS 5.0 V12.1.1). The protocols and suites are the controller's: ingress-nginx writes them at the
    # http level, and nginx keeps them for every host it selects by SNI, so no Ingress annotation can set them per host.
    ssl-protocols: "TLSv1.2 TLSv1.3"
    # The Mozilla intermediate TLS 1.2 suites (Server Side TLS guidelines 6.0, ssl-config.mozilla.org; ASVS 5.0 V12.1.2):
    # ECDHE key exchange with AES-128-GCM, AES-256-GCM or ChaCha20-Poly1305, for ECDSA and for RSA certificates, in Mozilla's
    # order, and nothing else (no CBC, no static RSA key exchange, no DHE, which ingress-nginx's default list carries). TLS 1.3
    # keeps OpenSSL's suites, all AEAD and Mozilla's set (TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384,
    # TLS_CHACHA20_POLY1305_SHA256).
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    # ssl-prefer-server-ciphers has no ConfigMap key: ingress-nginx writes ssl_prefer_server_ciphers on at the http level
    # whenever ssl-ciphers is set. Mozilla's intermediate configuration leaves the order to the client (server_preferred_order
    # false), every suite above being strong; the Ariva chart's Ingresses set the annotation ssl-prefer-server-ciphers "false",
    # which turns it off in each Ariva host's server block (an option nginx does apply per host).
    # No session tickets (Mozilla intermediate; the controller's default, kept explicit).
    ssl-session-tickets: "false"
    # HSTS (ASVS 5.0 V3.4.1): one year with includeSubDomains, no preload. The controller sends its own HSTS from a Lua header
    # filter in each location, over HTTPS. The Ariva chart sets this same value itself on every response of its hosts (its
    # server-snippet, with more_set_headers, which replaces the controller's), so these keys are not what Ariva's hosts rely
    # on: they keep the controller's own value at a year as well (controllers before 1.15 default to six months, 15724800).
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    hsts-preload: "false"
    # TLS ends at this controller, so X-Forwarded-* headers from clients are not trusted (the Ariva hosts trust only the
    # controller's pod network, Security:ForwardedHeaders). Put an L4 load balancer that keeps the client address in front, or
    # use PROXY protocol, never an L7 proxy that ends TLS before the controller.
    use-forwarded-headers: "false"
    # ModSecurity: the Ariva chart enables it on its own Ingresses (enable-modsecurity and modsecurity-snippet); the controller
    # loads the module whenever a location enables it, so it stays off for everyone else here. Keep it "false" (ARV-091): on,
    # the controller loads /etc/nginx/modsecurity/modsecurity.conf at the http level, whose audit log records 5xx and 4xx but
    # 404 with the request line and every request header (bearer tokens, the refresh cookie), and libmodsecurity lets that
    # level's audit settings override the SecAuditEngine Off of every Ariva Ingress.
    enable-modsecurity: "false"
    # The access log's format (ARV-091, ASVS 5.0 V16.2.5, CWE-532): ingress-nginx 1.15's default (log-format-upstream in
    # internal/ingress/controller/config/config.go), except that the request line is written without its query string:
    # "$request_method $uri $server_protocol" where the default writes "$request". A query string can hold a credential (the
    # live hub's access_token, a credential sent by mistake) or personal data (a user search's text). $uri is the normalised
    # path, which nginx escapes in the log as it does $request. The other fields are the default's, in its order. No log format
    # here may write $request, $request_uri, $args, $query_string, an $arg_ variable, the body, the Authorization header or a
    # cookie (controllerValuesFindings). nginx still names the full request line in its error log; the Ariva chart keeps the
    # one URL that carries a credential, /hubs, off every host but the hub's own Ingress, which logs only critical errors.
    log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id'
    # Left at the controller's defaults on purpose (ARV-091; controllerValuesFindings refuses the values in brackets):
    # - error-log-level: notice, or warn, error, crit, alert, emerg (never info, which writes every ModSecurity match with
    #   the matched input, or debug: ingress-nginx's nginx is built with debug support, which writes every request header);
    # - log-format-escape-none: off (on, nginx writes control characters unescaped, so a request could forge log lines);
    # - enable-opentelemetry: off (on, the controller exports a span per request whose http.target holds the query string;
    #   the chart also keeps it off on the live hub's Ingress, and the Ariva hosts trace themselves with query values redacted);
    # - main-snippet, http-snippet, server-snippet, location-snippet and stream-snippet (ARV-288): none
    #   with an access_log, log_format, error_log, rewrite_log or modsecurity directive (they would get around the format
    #   above and the chart's per Ingress guards), none naming proxy_cache_path, proxy_cache or proxy_store, or the fastcgi_,
    #   uwsgi_ or scgi_ one, none writing an include, client_body_in_file_only, a *_by_lua directive or a rewrite (ARV-284),
    #   none writing load_module, ssl_engine, lua_package_path, lua_package_cpath or a js_ or perl directive (code from
    #   the controller's disk: a module, an OpenSSL engine, Lua modules, njs or Perl; ARV-288), and none writing a *_pass,
    #   mirror, auth_request or satisfy directive (a location of the controller's own that proxies, copies or authenticates
    #   elsewhere, with the requests' headers, or lets a password past a source range; ARV-288a);
    # - plugins: unset or empty (ingress-nginx runs each Lua plugin it names, from /etc/nginx/lua/plugins, on every request
    #   of every Ingress; ARV-288);
    # - global-auth-url and every other global-auth- key (global-auth-signin, global-auth-signin-redirect-param,
    #   global-auth-method, global-auth-response-headers, global-auth-request-redirect, global-auth-snippet,
    #   global-auth-cache-key, global-auth-cache-duration, global-auth-always-set-cookie): unset or empty, in any case, and no
    #   enable-global-auth "true" (ARV-288a). With global-auth-url the controller sends every request to every Ingress first
    #   to that URL, with its headers (bearer tokens, the refresh cookie), and takes headers and cookies from the answers;
    #   Ariva authenticates every request itself, and its chart refuses the same per Ingress (every auth- annotation but
    #   the five documented auth-tls keys and basic authentication). global-auth-snippet is refused whole, so the snippet rules above do not read it;
    #   global-auth-cache-key would cache the answers in the auth_cache zone (ARV-206: the controller keeps no copy of an
    #   answer, which can carry a credential, border data or personal data).
    # - custom-http-errors: unset or empty, and no default backend (the ingress-nginx chart's top-level defaultBackend.enabled
    #   at any value its template reads as true, the string "false" and 2 included, or a default-backend-service under
    #   controller.extraArgs; ARV-288a): with them every request to every Ingress answered with
    #   one of those codes is proxied again to the default backend, with its Authorization and Cookie headers and its original
    #   URI (the live hub's access token). The Ariva hosts write their own error answers.
    # - controller.extraArgs: none, or only annotations-prefix (nginx.ingress.kubernetes.io), enable-annotation-validation
    #   (true) and default-ssl-certificate (ARV-288a), each key read as the controller reads it (the flag name before its first
    #   "=", so "annotations-prefix=site.example": "" is that flag): the chart's annotations and its guards
    #   (templates/validate.yaml) read the default prefix only, so under another prefix a site's <prefix>/server-snippet or
    #   <prefix>/auth-url would reach nginx past every guard, and another flag can change what the controller reads.
    # - controller.configMapNamespace and controller.customTemplate: empty (ARV-288a): the controller would read its ConfigMap
    #   from another namespace, or write nginx.conf from a template of a ConfigMap, neither of which this check sees.
    # - allow-cross-namespace-resources: unset or "false" (ARV-288a, CWE-863): true, an Ingress's auth-secret or
    #   auth-tls-secret could name a Secret of another namespace, which the controller would read for it.
    # - controller.enableAnnotationValidations: unset or true, and no enable-annotation-validation under controller.extraArgs
    #   but true (ARV-288a): the controller's own checks of annotation values (the --enable-annotation-validation flag of 1.15,
    #   which the ingress-nginx chart writes false from that value; it is no ConfigMap key), which the chart's guards stand behind.
