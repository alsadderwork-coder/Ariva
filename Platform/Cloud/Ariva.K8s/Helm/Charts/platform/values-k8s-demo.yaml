# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
environment: k8s-demo
buildNumber: trunk
imageRepository: dalil.azurecr.io/ariva
replicas: 1
domain: dalilhub.tech
webSubDomain: demo-ariva
simulationSubDomain: simulation-demo-ariva
apiMainSubDomain: api-main-demo-ariva
apiIngestSubDomain: api-ingest-demo-ariva
apiStreamSubDomain: api-stream-demo-ariva
apiCronzSubDomain: api-cronz-demo-ariva
apiIntegrationSubDomain: api-integration-demo-ariva
# Identifies this cluster in telemetry (K8s Cluster Name). Set to the real cluster identity.
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-demo
releaseVersion: v-0.0.0

# Ingress definitions
ingresses:
  - name: api-main
    comment: Ariva API Main Ingress
    subdomain: api-main-demo-ariva
    serviceName: api-main-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-ingest
    comment: Ariva API Ingest Ingress (vendor webhooks)
    subdomain: api-ingest-demo-ariva
    serviceName: api-ingest-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-cronz
    comment: Ariva API Cronz Ingress (TickerQ dashboard)
    subdomain: api-cronz-demo-ariva
    serviceName: api-cronz-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-integration
    comment: Ariva API Integration Ingress (AODB push)
    subdomain: api-integration-demo-ariva
    serviceName: api-integration-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: simulation
    comment: Ariva Simulation Ingress
    subdomain: simulation-demo-ariva
    serviceName: simulation-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: web
    comment: Ariva Web Ingress
    subdomain: demo-ariva
    serviceName: web-service
    annotations:
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "5m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  # ADR-0026: the web app and the API share one host, so the refresh cookie (Path=/api/auth, SameSite=Strict) and
  # SignalR need no cross-origin calls. A separate Ingress object because the web ingress rewrites every path to /.
  - name: web-api
    comment: Ariva API on the web host (/api and /hubs to Ariva.Api.Main)
    subdomain: demo-ariva
    serviceName: api-main-service
    paths:
      - /api
      - /hubs
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
