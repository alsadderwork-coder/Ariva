# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Environment files (values-k8s-dev.yaml and friends) override these defaults.

environment: k8s-dev
buildNumber: trunk
imageRepository: dalil.azurecr.io/ariva
imagePullPolicy: Always
# Optional digests per service (api-main, api-ingest, api-stream, api-cronz, api-integration, simulation, web), set by a
# release that verified the images' signatures: the pods then pull <repository>/<service>:<buildNumber>@<digest>.
imageDigests: {}
replicas: 1
releaseVersion: v-0.0.0

# Uploaded files (ARV-018): floor plans. PVCs can only grow; never lower size below the live capacity.
# ReadWriteMany (for example storageClassName azurefile-csi on AKS) is required before api-main scales out.
fileStorage:
  existingClaim: ""
  storageClassName: ""   # empty uses the cluster default storage class
  size: 2Gi
  accessMode: ReadWriteOnce
domain: dalilhub.tech
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-dev

# Data Protection key-protection certificate (ARV-008): a kubernetes.io/tls secret created out of band (cert-manager or
# kubectl create secret tls), mounted read-only into every API pod at /app/secrets/dataprotection.
dataProtectionSecretName: ariva-dataprotection

# Access token keys (ARV-010a, ADR-0026), created out of band; see wiki/04-Deployment-Guide.md for generation and the
# 90-day rotation. ariva-token-public (public.pem, plus previous.pem during a rotation) is mounted into every API pod;
# ariva-token-signing (signing.key, P-256 PKCS#8) only into api-main.
tokenPublicSecretName: ariva-token-public
tokenSigningSecretName: ariva-token-signing
# Integration token key ring (ARV-042), mounted by api-integration only
integrationTokenPublicSecretName: ariva-integration-token-public
integrationTokenSigningSecretName: ariva-integration-token-signing

# Schema migration Job (ARV-006): api-main --migrate as a Helm hook before each upgrade. The migration login comes
# from Database:Migration in base-appsettings-secret; hosts use the DML-only runtime login.
migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 900

# Validation reader login (ARV-104g1): the only database login that reads the shadow nowcast (a member of
# ariva_validation_reader and nothing else, created and updated by the migration job, script 0049). Its name and password
# come from the secret secretName (keys username and password), created out of band per environment like the appsettings
# secrets (wiki/04, section 6.2), and reach only api-main, which hosts the validation service, and the database-migration
# job, as Database__ValidationReader__Username and Password (the chart test fails if another workload gets them).
# optional true lets a release run without the secret: no login then reads the shadow nowcast and the validation results
# show no shadow figures. k8s-prd sets it false (the chart refuses true there). Without the secret, a production upgrade
# fails at the migration job (a pre-upgrade hook) before any pod changes; on a first install the job runs after the objects
# (post-install) and also fails, and the new api-main pods wait in CreateContainerConfigError until the secret exists.
validationReader:
  secretName: ariva-validation-reader
  optional: true

# Kafka topics Job (ARV-062): api-main --provision-topics as a Helm hook before each upgrade (after the first install).
# It creates the missing ariva.* topics and their dead-letter topics, never changes an existing one, and fails the
# release when the broker cannot be reached within activeDeadlineSeconds. While it is on, api-main runs with
# Kafka:ProvisionTopics false. adminSecretName (keys username and password) gives the job its own SASL principal with
# create rights on the ariva. prefix, so the hosts' principal can do without them (recommended in production); empty
# uses the hosts' principal (kafkaSecretName), which then keeps create rights.
kafkaTopics:
  job: true
  adminSecretName: ""
  backoffLimit: 1
  activeDeadlineSeconds: 600

# The simulation host (sensor, AODB and AMAN emulators) is deployed unless an environment turns it off.
simulationEnabled: true

# Demo International Airport (DMO) topology and zone profile v12 in Ariva.Api.Main (ARV-019). Fictional data: refused
# in k8s-prd by the chart (validate.yaml) and by the API itself.
demoSeed: false

# MQTT transport of api-ingest (ARV-024): an MQTT 3.1.1 and 5 broker that only takes device data in, over TLS terminated
# in the pod with the kubernetes.io/tls secret below (ingress-nginx carries HTTP only). Devices sign in with their code
# and credential and publish to ariva/v1/devices/<code>/<dialect>. The Service keeps the client address
# (externalTrafficPolicy Local) so a device's allowed networks still apply; use LoadBalancer or NodePort per site.
mqtt:
  enabled: false
  port: 8883
  tlsSecretName: ariva-mqtt-tls
  serviceType: ClusterIP

# Per service overrides follow the AMAN key style, for example:
# apiMainReplicas: 2
# apiMainHpaMin: 1
# apiMainHpaMax: 3
# apiMainCpuRequest: 250m
# apiMainMemRequest: 750Mi
# apiMainCpuLimit: 1000m
# apiMainMemLimit: 1000Mi

# OpenTelemetry export (rendered by the ariva-platform.otelEnv helper).
otel:
  endpoint: ""
  protocol: grpc

# Registry credentials for dalilacr-secret. Leave the password empty to skip rendering the secret
# (for example when it is created out of band). The release pipeline passes these with set flags.
imageCredentials:
  registry: dalil.azurecr.io
  username: ""
  password: ""

# Ingress definitions (see templates/ingresses.yaml); environment files provide the list.
ingresses: []
