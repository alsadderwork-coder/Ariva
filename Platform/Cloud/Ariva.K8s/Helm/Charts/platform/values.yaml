# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Environment files (values-k8s-dev.yaml and friends) override these defaults.

environment: k8s-dev
buildNumber: trunk
imageRepository: dalil.azurecr.io/ariva
imagePullPolicy: Always
# Optional digests per service (api-main, api-ingest, api-stream, api-cronz, api-integration, simulation, web), set by a
# release that verified the images' signatures: the pods then pull <repository>/<service>:<buildNumber>@<digest>.
imageDigests: {}
replicas: 1

# Pod grace period of every API host (ARV-165), in seconds: the kubelet kills the process this long after SIGTERM. The
# hosts' shutdown timeout is 50 s (Hosting:ShutdownSeconds) and they refuse to start unless it ends 5 s before this; the
# chart passes the value to each host as Hosting__GracePeriodSeconds. At least 60.
terminationGracePeriodSeconds: 60
releaseVersion: v-0.0.0

# Uploaded files (ARV-018): floor plans. PVCs can only grow; never lower size below the live capacity.
# ReadWriteMany (for example storageClassName azurefile-csi on AKS) is required before api-main scales out.
fileStorage:
  existingClaim: ""
  storageClassName: ""   # empty uses the cluster default storage class
  size: 2Gi
  accessMode: ReadWriteOnce
domain: dalilhub.tech
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-dev

# Data Protection key-protection certificate (ARV-008): a kubernetes.io/tls secret created out of band (cert-manager or
# kubectl create secret tls), mounted read-only into every API pod at /app/secrets/dataprotection.
dataProtectionSecretName: ariva-dataprotection

# Access token keys (ARV-010a, ADR-0026), created out of band; see wiki/04-Deployment-Guide.md for generation and the
# 90-day rotation. ariva-token-public (public.pem, plus previous.pem during a rotation) is mounted into every API pod;
# ariva-token-signing (signing.key, P-256 PKCS#8) only into api-main.
tokenPublicSecretName: ariva-token-public
tokenSigningSecretName: ariva-token-signing
# Integration token key ring (ARV-042), mounted by api-integration only
integrationTokenPublicSecretName: ariva-integration-token-public
integrationTokenSigningSecretName: ariva-integration-token-signing

# Server CAs of the hosts' database and Redis connections (ARV-082a): each a secret with the key ca.crt (PEM), the CA that
# issued the TimescaleDB server certificate (the timescaledb release's tls.secretName, for example the site's internal CA
# through cert-manager) or the Redis server certificate, created out of band like the other secrets. Only ca.crt is
# mounted, read-only, at /app/secrets/database-ca and /app/secrets/redis-ca in the five API pods and the migration and
# topics jobs (not the web pod or the simulator). Optional for the chart, as the Kafka CA: in k8s-prd every host verifies
# the servers against them (Database:RootCertificate, Redis:CaCertificatePath) and refuses to start without the files;
# dev and demo run without them. Kubernetes secret names (validate.yaml).
databaseCaSecretName: ariva-database-ca
redisCaSecretName: ariva-redis-ca

# Pod TLS (ARV-082b): the ingress reaches the pods over TLS and verifies them. Off by default, so dev, demo and localk8s render
# plain HTTP as before; k8s-prd turns it on and the chart refuses it off there (validate.yaml, and the Helmfile state value
# podTls). With it on:
# - each API host serves HTTPS only, on container port 8443 (named https; no 8080), from its own kubernetes.io/tls secret
#   (secretNames.<service>), issued by the site's cluster CA for the Service's names (for api-main: api-main-service,
#   api-main-service.<namespace>.svc and api-main-service.<namespace>.svc.cluster.local). Only tls.crt and tls.key are
#   projected, mode 0440 (read through the pod's fsGroup 10001), as a whole directory at /app/secrets/pod-tls: Kestrel reloads
#   a renewed certificate from it, which a subPath mount would never receive;
# - the web pod's nginx serves TLS on 3443 only, from secretNames.web at /etc/nginx/tls (names web-service and so on); the
#   ConfigMap web-nginx-listen, mounted over the image's /etc/nginx/listen.d, replaces its plain "listen 3000" with
#   "listen 3443 ssl" (TLS 1.2 and 1.3, the TLS 1.2 suites ECDHE with AEAD only). nginx reads the certificate when it
#   starts: a renewed one reaches the web pods at their next restart (every release restarts them);
# - every Service serves 443 (name https) to its pods' https port, so the internal addresses are https://<service> with no
#   port; every Ingress proxies HTTPS to port 443 and verifies the pod's certificate against caSecretName under the name
#   <service>.<namespace>.svc, TLS 1.2 or 1.3, with up to two intermediate CAs between the pod's certificate and the
#   cluster CA (proxy-ssl-verify-depth 2; OpenSSL counts only the intermediates, so 1 would take one).
#   caSecretName is a secret in the release's namespace whose only key is ca.crt, the cluster CA (an Opaque secret).
#   ingress-nginx verifies the pods, and holds the proxy-ssl-protocols floor, only when that secret holds ca.crt: a secret
#   without it loads without error and the Ingress proxies HTTPS to the pods unverified, silently. Never point caSecretName
#   at a kubernetes.io/tls secret without ca.crt (the CA's own key pair, or one of the pods' certificates); and keep tls.key
#   out of it, or ingress-nginx copies that key to the controller and presents it to the pods. validate.yaml refuses both
#   when the release can see the secret; a render that cannot (helm template, or before the secret exists) does not.
# Create the secrets out of band (cert-manager or kubectl create secret tls) before the release; the pods wait for them.
# The simulator serves plain HTTP and calls the hosts over plain HTTP: the chart refuses it, and an Ingress to it, with pod
# TLS on. Secret names are Kubernetes secret names; empty means the default (validate.yaml).
podTls:
  enabled: false
  caSecretName: ariva-cluster-ca
  secretNames:
    api-main: ariva-api-main-tls
    api-ingest: ariva-api-ingest-tls
    api-stream: ariva-api-stream-tls
    api-cronz: ariva-api-cronz-tls
    api-integration: ariva-api-integration-tls
    web: ariva-web-tls

# The ingress controller (ARV-085): the pods that proxy every request to the hosts and the web app.
# - namespaceSelector and podSelector select its pods (label selectors, as in a NetworkPolicy peer): with networkPolicies on,
#   the pods an Ingress routes to take connections from these pods alone. The defaults are the ingress-nginx Helm chart's
#   pod labels in its usual namespace, ingress-nginx (Kubernetes sets kubernetes.io/metadata.name on every namespace). Both
#   must select something; a controller on the host network is not a pod the selectors can match: give it a NetworkPolicy of
#   the site's own.
# - podNetworks: the controller pods' network, CIDRs (for example the cluster's pod CIDR, 10.244.0.0/16 on AKS with kubenet or
#   Azure CNI Overlay). Every API host gets them as Security:ForwardedHeaders:KnownNetworks (Security__ForwardedHeaders__
#   KnownNetworks__0, __1 and so on): the only peers whose X-Forwarded-For and X-Forwarded-Proto it trusts, so rate limits and
#   logs see the client and not the controller (ASVS 5.0 V4.1.3). The controller sets those headers itself, as it ends TLS
#   (use-forwarded-headers false in Helm/ingress-nginx-values.yaml). Required in k8s-prd, where the chart refuses an IPv4
#   prefix shorter than /14 or an IPv6 prefix shorter than /48; never 0.0.0.0/0 or ::/0 anywhere. Empty elsewhere leaves the
#   hosts' appsettings in force. Network addresses only (no address bits after the prefix, so 10.244.1.0/16 is refused).
#   k8s-prd also refuses an IPv6 network that would trust IPv4 clients wider than a /14: a dual-stack pod sees an IPv4 client as
#   ::ffff:a.b.c.d, and .NET matches it against an IPv6 network with a mask of (prefix mod 32) bits, so a prefix from /65 to /77
#   or /97 to /109 is refused, and so is any network holding the IPv4-mapped block ::ffff:0:0/96 (::/64, ::ffff:0:0/96). Cilium's
#   default IPv6 pod pool, fd00::/104, is refused by this rule: give a prefix that holds it outside those ranges (fd00::/96, for
#   example) or the controller's IPv4 pod network. The hosts refuse to start on each of these values; the chart refuses them first.
ingressController:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  podNetworks: []

# NetworkPolicies (ARV-085; wiki/05, the firewall matrix): every Ariva pod (the five API hosts, the web pod, the simulator and
# the migration and topics jobs, by their app label) denies all traffic in and out, and the chart allows exactly the
# matrix's flows. Off by default, so dev, demo and localk8s render as before: their clusters' Kafka, Redis and controller
# labels are not fixed in the repository, dev and demo run the simulator, and a local cluster's network may enforce no
# NetworkPolicy at all (Docker Desktop's does not), where on would prove nothing. k8s-prd turns it on and the chart refuses it
# off there (validate.yaml, and the Helmfile state value networkPolicies). Needs a CNI that enforces NetworkPolicy (Calico,
# Cilium, Antrea, the cloud's network policy engine).
# With it on:
# - in: the ingress controller (ingressController) to each pod an Ingress routes to, on its serving port only (8443 for an API
#   host and 3443 for the web pod with podTls, 8080 and 3000 without; 8080 for the simulator); the sensor networks to
#   api-ingest's MQTT port (mqtt.enabled); in dev and demo, the simulator to api-main, api-ingest and api-integration on 8080
#   and api-integration to the simulator's AODB and AMAN emulators. api-stream and the jobs take nothing.
# - out: DNS for every pod but the web pod (which needs nothing); the database for the API hosts and the migration job; Kafka
#   for the API hosts, the topics job and the simulator (the AMAN feed emulator); Redis for the API hosts; the OTLP collector
#   for the API hosts and the simulator; Loki for the API hosts; the SMTP relay for api-integration (alert email) and
#   api-cronz (the scheduled reports, ARV-060); the outbound endpoints (AODB, immigration, AMAN's API, alert gateways) for
#   api-integration only.
# - the kubelet's probes need no rule: they come from the pod's own node, and a NetworkPolicy does not block a pod's resident
#   node (Kubernetes lists it among what network policies cannot do). Where the CNI filters host traffic anyway (a host
#   firewall), add a NetworkPolicy of the site's own for the nodes' addresses to the probe ports.
# Every destination is a list of NetworkPolicy peers (to) and TCP ports. A peer is an ipBlock (cidr, optional except), or a
# podSelector with an optional namespaceSelector (without one, pods of the release's namespace). An empty to opens nothing:
# the destination stays denied. k8s-prd refuses an ipBlock wider than /8 (IPv4) or /16 (IPv6), 0.0.0.0/0 and ::/0 among
# them, and a namespaceSelector that selects every namespace with no podSelector. NetworkPolicies add up: a site allows any
# other flow (a backup job, a metrics scraper) with a NetworkPolicy of its own.
# The jobs are Helm hooks: on an upgrade they run before the release's objects change, under the previous release's policies.
networkPolicies:
  enabled: false
  # kube-dns (CoreDNS) in kube-system, on 53 UDP and TCP (fixed). With NodeLocal DNSCache add its address, for example
  # - ipBlock: { cidr: 169.254.20.10/32 }
  dns:
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  # TimescaleDB (Charts/timescaledb, its pods app: timescaledb in this namespace), or the site's PostgreSQL.
  database:
    to:
      - podSelector:
          matchLabels:
            app: timescaledb
    ports: [5432]
  # Kafka's brokers, every one (a client connects to each broker it is told of), behind Kafka:BootstrapServers; the common
  # charts' label in this namespace by default. Add the brokers' own ports when they advertise others.
  kafka:
    to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: kafka
    ports: [9092]
  # Redis (Redis:ConnectionString); add 26379 for Sentinel.
  redis:
    to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: redis
    ports: [6379]
  # The OTLP collector (otel.endpoint): gRPC 4317, HTTP 4318. Empty: no export leaves the pods.
  otlp:
    to: []
    ports: [4317, 4318]
  # Loki (Loki:Uri), when the hosts send logs there; required with logging.collector loki (ARV-091a).
  loki:
    to: []
    ports: [3100]
  # The SMTP relay (Email:Smtp): STARTTLS 587 or implicit TLS 465. api-integration (alert email, ARV-040) and api-cronz (the
  # scheduled reports, ARV-060).
  smtp:
    to: []
    ports: [587, 465]
  # The outbound endpoints of api-integration (ARV-045, the OutboundEndpoint records): AODB, immigration, AMAN's API, the SMS
  # gateway and the operations centre's webhooks. One entry each, a name (a DNS label), its peers (the CIDRs the endpoint's
  # addresses resolve to) and its ports, for example
  # - name: aodb
  #   to:
  #     - ipBlock: { cidr: 10.20.30.0/24 }
  #   ports: [443]
  outbound: []
  # The sensor networks allowed to reach api-ingest's MQTT listener (mqtt.enabled; required with it). The MQTT Service keeps
  # the device's address (externalTrafficPolicy Local), so the peers are the sensor VLANs, for example
  # - ipBlock: { cidr: 10.30.0.0/16 }
  mqttSensors:
    from: []

# Schema migration Job (ARV-006): api-main --migrate as a Helm hook before each upgrade. The migration login comes
# from Database:Migration in base-appsettings-secret; hosts use the DML-only runtime login.
migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 900
  # Retention periods in whole days (ARV-111a, docs/privacy/data-inventory.md). After the scripts, the job sets each hypertable's
  # TimescaleDB retention policy and each relational period (table retention_period, which the Cronz retention job reads) to
  # these, with the migration login; the chart passes them as Database__Retention__* (environment variables win over the
  # appsettings files). A period that is already in force is left alone. The chart refuses an unknown key or a value out of
  # range (validate.yaml). Defaults: the scripts' values and the Proposed periods of docs/product/decisions.md (2026-10-16).
  retention:
    rawSensingDays: 90        # sensing_event, sensing_batch, device_health_event: the contract's dispute window (TC-62); 7 to 3650
    deskZoneReadingDays: 7    # desk_zone_reading (desk-level border data); 2 to 90
    laneStaffingDays: 90      # lane_staffing (the open desks alert's backtest history); 90 to 3650
    alertEmailDays: 180       # email_message, with staff email addresses (TC-67); 30 to 3650
    integrationCallDays: 400  # integration_call, the Integration API call record (TC-68); 30 to 3650
    reportDeliveryDays: 400   # report_delivery (TC-66); 30 to 3650
    advertisingPlayDays: 400  # advertising_play, the proof of play (ARV-144, Proposed); 30 to 3650

# Validation reader login (ARV-104g1): the only database login that reads the shadow nowcast (a member of
# ariva_validation_reader and nothing else, created and updated by the migration job, script 0049). Its name and password
# come from the secret secretName (keys username and password), created out of band per environment like the appsettings
# secrets (wiki/04, section 6.2), and reach only api-main, which hosts the validation service, and the database-migration
# job, as Database__ValidationReader__Username and Password (the chart test fails if another workload gets them).
# optional true lets a release run without the secret: no login then reads the shadow nowcast and the validation results
# show no shadow figures. k8s-prd sets it false (the chart refuses true there). Without the secret, a production upgrade
# fails at the migration job (a pre-upgrade hook) before any pod changes; on a first install the job runs after the objects
# (post-install) and also fails, and the new api-main pods wait in CreateContainerConfigError until the secret exists.
validationReader:
  secretName: ariva-validation-reader
  optional: true

# Kafka topics Job (ARV-062): api-main --provision-topics as a Helm hook before each upgrade (after the first install).
# It creates the missing ariva.* topics and their dead-letter topics, never changes an existing one, and fails the
# release when the broker cannot be reached within activeDeadlineSeconds. While it is on, api-main runs with
# Kafka:ProvisionTopics false. adminSecretName (keys username and password) gives the job its own SASL principal with
# create rights on the ariva. prefix, so the hosts' principal can do without them (recommended in production); empty
# uses the hosts' principal (kafkaSecretName), which then keeps create rights.
kafkaTopics:
  job: true
  adminSecretName: ""
  backoffLimit: 1
  activeDeadlineSeconds: 600

# The simulation host (sensor, AODB and AMAN emulators) is deployed unless an environment turns it off.
simulationEnabled: true

# Demo International Airport (DMO) topology and zone profile v12 in Ariva.Api.Main (ARV-019). Fictional data: refused
# in k8s-prd by the chart (validate.yaml) and by the API itself.
demoSeed: false

# MQTT transport of api-ingest (ARV-024): an MQTT 3.1.1 and 5 broker that only takes device data in, over TLS terminated
# in the pod with the kubernetes.io/tls secret below (ingress-nginx carries HTTP only). Devices sign in with their code
# and credential and publish to ariva/v1/devices/<code>/<dialect>. The Service keeps the client address
# (externalTrafficPolicy Local) so a device's allowed networks still apply; use LoadBalancer or NodePort per site.
mqtt:
  enabled: false
  port: 8883
  tlsSecretName: ariva-mqtt-tls
  serviceType: ClusterIP

# Per service overrides follow the AMAN key style, for example:
# apiMainReplicas: 2
# apiMainHpaMin: 1
# apiMainHpaMax: 3
# apiMainCpuRequest: 250m
# apiMainMemRequest: 750Mi
# apiMainCpuLimit: 1000m
# apiMainMemLimit: 1000Mi

# OpenTelemetry export (rendered by the ariva-platform.otelEnv helper). Empty endpoint: no OTLP export. k8s-prd sends
# telemetry over TLS only: the chart refuses an endpoint there that does not start with https:// (ARV-082a, validate.yaml).
# headersSecret (ARV-091a): for a collector that authenticates senders, the Kubernetes Secret (name) and its key (key) holding
# OTEL_EXPORTER_OTLP_HEADERS, the headers every OTLP exporter sends (logs, traces and metrics): comma-separated key=value
# pairs with percent-encoded values, for example Authorization=Bearer%20<token> for the Collector's bearertokenauth or
# Authorization=Basic%20<base64 of user:password> for its basicauth (wiki 04). With a name, the five API hosts and the simulator (which exports to the same endpoint in dev
# and demo) get it as OTEL_EXPORTER_OTLP_HEADERS (secretKeyRef, not optional), and the chart requires an https:// endpoint in
# every environment; outside vm-local a host refuses the headers from a configuration file or with a plain endpoint. Empty name:
# none. Never the headers themselves: otel takes endpoint, protocol and headersSecret only.
otel:
  endpoint: ""
  protocol: grpc
  headersSecret:
    name: ""
    key: headers

# Log shipping and the log pseudonym key (ARV-091a; docs/security/log-inventory.md sections 1, 2 and 10.6). Nothing is set by
# default, so dev, demo and localk8s render as before; k8s-prd requires both, and so does required true (below).
# - collector: where the five API hosts send their logs, otlp or loki; empty declares none. In k8s-prd a host refuses to start
#   without a collector over TLS, and the chart refuses a release without this value:
#   - otlp: the OpenTelemetry collector at otel.endpoint (logs, traces and metrics; SigNoz, which the system alerts need). The
#     chart requires otel.endpoint, an https:// URL, in every environment that sets otlp, and with networkPolicies on, the
#     collector's peers (networkPolicies.otlp).
#   - loki: the site's Loki, whose address is Loki:Uri in the appsettings secret (the chart cannot read it). The chart gives the
#     five API hosts Loki__Enabled "true", so in k8s-prd a host refuses to start until that secret holds an https Loki:Uri; with
#     networkPolicies on, the chart requires Loki's peers and port (networkPolicies.loki).
# - pseudonymKeySecret: the Kubernetes Secret (name) and its key (key) that hold Logging:PseudonymKey, base64 of 32 or more
#   random bytes (for example openssl rand -base64 32), with which every host hashes desk codes and track ids into the same
#   pseudonyms on the same UTC day. With a name, the five API hosts get it as Logging__PseudonymKey (secretKeyRef, not
#   optional: the pods wait for the Secret). Empty name: none, and each process draws a key of its own. Create the Secret in
#   the release's namespace before the release; when the release can see the cluster, the chart refuses one that is missing,
#   has no such key or holds a value that is not base64 of 32 or more bytes. One key per deployment (never the border's and the
#   airport's alike), and never readable by those who read the logs. The key itself is never a value of this chart: there is
#   no setting for it, and the chart test fails on a literal Logging__PseudonymKey.
# - lokiCredentialsSecret: for a Loki (or a gateway in front of it) that authenticates senders, the Kubernetes Secret (name) and
#   its keys (usernameKey, passwordKey) that hold the user name and password the hosts send with every batch (HTTP basic
#   authentication, over https only). With a name, the five API hosts get them as Loki__Username and Loki__Password
#   (secretKeyRef, not optional); outside vm-local a host refuses them from the appsettings files. Empty name: none. Never the
#   values themselves.
# - required: true makes the chart require collector and pseudonymKeySecret.name in any environment. The Helmfiles' prd release
#   sets it (state value logShipping), so no values file can drop either there.
logging:
  collector: ""
  pseudonymKeySecret:
    name: ""
    key: pseudonym-key
  lokiCredentialsSecret:
    name: ""
    usernameKey: username
    passwordKey: password
  required: false

# System monitoring (ARV-125b): SigNoz alert rules and dashboards rendered into the ConfigMaps ariva-monitoring-alerts and
# ariva-monitoring-dashboards, which an operator imports into the site's SigNoz (v0.146.0; wiki/10 section 1). Nothing
# here is a credential: the SigNoz address, its API key and the notification channels' settings stay in SigNoz.
# Thresholds are the defaults of wiki/10 section 2 (Proposed where the wiki gives none); TC-36 tunes them per site in the
# site's values file. templates/validate.yaml refuses a value out of range.
monitoring:
  enabled: true
  # The deployment.environment every rule and dashboard reads (the hosts' Application:Environment, which the chart's
  # appsettings set to environment). Empty: environment. One SigNoz may take several environments without mixing them.
  environment: ""
  # Names of SigNoz notification channels every rule notifies (created in SigNoz first). Empty: choose them after import.
  channels: []
  alerts:
    # No ariva.health.status from a service for the window: every pod of it is down or silent. One rule per service.
    hostDown: { enabled: true, minutes: 5, severity: critical, services: [api-main, api-ingest, api-stream, api-cronz, api-integration] }
    # A readiness check Unhealthy (readiness answers 503) for the whole window.
    readinessFailing: { enabled: true, minutes: 5, severity: critical }
    # The MassTransit bus Degraded (readiness stays 200, the owner's ARV-125 decision).
    busDegraded: { enabled: true, minutes: 2, severity: warning }
    # The kafka readiness check Degraded (ARV-165): no broker answers the host's producer.
    kafkaUnavailable: { enabled: true, minutes: 2, severity: critical }
    # The database readiness check Unhealthy.
    databaseUnavailable: { enabled: true, minutes: 2, severity: critical }
    # The queue engine more than records behind a sensing topic for the whole window ("lag growing for several minutes").
    streamConsumerLag: { enabled: true, minutes: 5, records: 1000, severity: critical }
    # The oldest unsent outbox row older than minutes.
    outboxBacklog: { enabled: true, minutes: 5, severity: critical }
    # Any dead letter (sent, kept or failed) in the window.
    deadLetters: { enabled: true, minutes: 15, severity: warning }
    # A volume Ariva's data lives on fuller than usedPercent for the window, from the site collector's kubelet volume
    # metrics (external). claims names the PersistentVolumeClaims (the TimescaleDB release's by default) and namespaces
    # the namespaces they are in (empty: the release's namespace), so a claim of the same name elsewhere is not read.
    disk: { enabled: true, minutes: 15, usedPercent: 75, severity: critical, claims: [data-timescaledb-0], namespaces: [] }
    # A certificate an Ariva host loaded ends within warningDays (warning) or criticalDays (critical).
    certificateExpiry: { enabled: true, warningDays: 30, criticalDays: 7 }
    # The certificate cert-manager manages in namespaces (empty: the release's namespace) that ends soonest (the ingress
    # certificate among them), from cert-manager's metric scraped by the site collector (external; silent where
    # cert-manager is not scraped). namespaceLabel is the label that carries the certificate's namespace in SigNoz:
    # namespace as cert-manager exports it, or exported_namespace when the scrape adds a namespace label of its own.
    ingressCertificateExpiry: { enabled: true, warningDays: 30, criticalDays: 7, namespaces: [], namespaceLabel: namespace }
    # No AMAN record other than refused ones for T_stale (2 minutes). Border deployments only: turn it on there.
    amanFeedStale: { enabled: false, minutes: 2, severity: critical }
    # The share of monitored devices Offline above share for the whole window.
    devicesOffline: { enabled: true, minutes: 5, share: 0.2, severity: warning }
    # A Kafka producer fatal error or recreation (ARV-167) in the window.
    kafkaProducerFatal: { enabled: true, minutes: 5, severity: critical }
    # A consumed topic missing (ARV-176) for the whole window.
    consumedTopicMissing: { enabled: true, minutes: 5, severity: warning }
    # A consumer whose topic exists but whose connect keeps failing, for the whole window.
    consumerUnconnected: { enabled: true, minutes: 5, severity: warning }

# Registry credentials for dalilacr-secret. Leave the password empty to skip rendering the secret
# (for example when it is created out of band). The release pipeline passes these with set flags.
imageCredentials:
  registry: dalil.azurecr.io
  username: ""
  password: ""

# Ingress definitions (see templates/ingresses.yaml); environment files provide the list. Each entry: name, comment,
# subdomain (the host is <subdomain>.<domain>), serviceName, paths (default /), tlsSecretName (default tlsSecretName),
# tokenInQuery (the live hub, ARV-035), annotations (the site's own), sourceRanges (ARV-085) and plainHttp (ARV-084):
# - sourceRanges: the client networks allowed to reach the Ingress, CIDRs, as ingress-nginx's allowlist-source-range (the
#   name ingress-nginx 1.15 reads first; whitelist-source-range is its older alias, refused here like the annotation itself:
#   set sourceRanges). Any other client is answered 403. Required on the Cronz dashboard's Ingress (api-cronz-service) in
#   k8s-prd, the management network only, and refused there wider than /8 (IPv4) or /16 (IPv6), 0.0.0.0/0 and ::/0 among them.
#   The controller must see the client's own address: an L4 load balancer that keeps it (externalTrafficPolicy Local) or the
#   PROXY protocol, never a proxy that rewrites it.
# - plainHttp: refuse (the default) answers 403 to any request over plain HTTP and never redirects (ASVS 5.0 V4.1.2), for the
#   machine hosts (api-main, api-ingest, api-integration); redirect sends a browser to HTTPS (308), for the web host and the
#   Cronz dashboard. The Ingresses of one host share one mode, and in k8s-prd an Ingress to api-main-service,
#   api-ingest-service or api-integration-service on a host without the web app refuses (validate.yaml).
# - tokenInQuery (ARV-035, ARV-091): true only on the live hub's Ingress, whose paths are /hubs or under it (validate.yaml
#   refuses /hubs on any other Ingress, and any other path on this one): its WebSocket URL carries the access token, so it
#   keeps no access log and logs only critical errors. Every host without such an Ingress (api-main's own host among them)
#   answers /hubs and anything under it 404, in any case, at its server level, so the token never reaches a logged location;
#   the hub's own host answers 404 to every spelling of /hubs but the lowercase one, which only the hub's Ingress serves.
# Every Ingress keeps the ModSecurity audit log off (SecAuditEngine Off, ARV-091): it would record the request line and
# headers (bearer tokens, the refresh cookie). A site's modsecurity-snippet may not turn it back on, and no annotation may
# write a modsecurity, access_log or error_log directive (validate.yaml).
# Every Ingress answers 404 to /health, /healthz and anything under them, at its host's server level, before any location
# (ARV-085): the probes stay private, on the pods' own ports, and no Ingress routes them (validate.yaml refuses such a path).
# The 404 is judged on the request's own path, so no Ingress rewrites one: validate.yaml refuses the annotations rewrite-target
# and use-regex and any snippet that writes a rewrite directive (the chart needs none: every path reaches its pod as it is).
# Every Ingress gets, from the chart: HSTS max-age=31536000; includeSubDomains over HTTPS (no preload), nosniff and
# Content-Security-Policy frame-ancestors 'none' on every response, the ingress's own (421, the redirect, 403, 413, 502,
# 503, 504) included; the affinity cookie Secure, SameSite=Strict, Path=/; ssl-prefer-server-ciphers false (Mozilla
# intermediate). The controller's TLS (protocols, suites, its own HSTS and snippet settings) is the site's:
# Platform/Cloud/Ariva.K8s/Helm/ingress-nginx-values.yaml. A site's server-snippet, configuration-snippet and
# modsecurity-snippet are appended to the chart's; no annotation may set a key the chart sets, from-to-www-redirect (its
# server carries none of these headers), custom-headers, or name Strict-Transport-Security, X-Content-Type-Options,
# Content-Security-Policy or more_clear_headers (validate.yaml).
ingresses: []
