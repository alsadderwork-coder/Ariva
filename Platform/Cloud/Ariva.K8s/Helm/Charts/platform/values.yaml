# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Environment files (values-k8s-dev.yaml and friends) override these defaults.

environment: k8s-dev
buildNumber: trunk
imageRepository: dalil.azurecr.io/ariva
imagePullPolicy: Always
replicas: 1
releaseVersion: v-0.0.0

# Uploaded files (ARV-018): floor plans. PVCs can only grow; never lower size below the live capacity.
# ReadWriteMany (for example storageClassName azurefile-csi on AKS) is required before api-main scales out.
fileStorage:
  existingClaim: ""
  storageClassName: ""   # empty uses the cluster default storage class
  size: 2Gi
  accessMode: ReadWriteOnce
domain: dalilhub.tech
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-dev

# Data Protection key-protection certificate (ARV-008): a kubernetes.io/tls secret created out of band (cert-manager or
# kubectl create secret tls), mounted read-only into every API pod at /app/secrets/dataprotection.
dataProtectionSecretName: ariva-dataprotection

# Access token keys (ARV-010a, ADR-0026), created out of band; see wiki/04-Deployment-Guide.md for generation and the
# 90-day rotation. ariva-token-public (public.pem, plus previous.pem during a rotation) is mounted into every API pod;
# ariva-token-signing (signing.key, P-256 PKCS#8) only into api-main.
tokenPublicSecretName: ariva-token-public
tokenSigningSecretName: ariva-token-signing

# Schema migration Job (ARV-006): api-main --migrate as a Helm hook before each upgrade. The migration login comes
# from Database:Migration in base-appsettings-secret; hosts use the DML-only runtime login.
migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 900

# The simulation host (sensor, AODB and AMAN emulators) is deployed unless an environment turns it off.
simulationEnabled: true

# Demo International Airport (DMO) topology and zone profile v12 in Ariva.Api.Main (ARV-019). Fictional data: refused
# in k8s-prd by the chart (validate.yaml) and by the API itself.
demoSeed: false

# Per service overrides follow the AMAN key style, for example:
# apiMainReplicas: 2
# apiMainHpaMin: 1
# apiMainHpaMax: 3
# apiMainCpuRequest: 250m
# apiMainMemRequest: 750Mi
# apiMainCpuLimit: 1000m
# apiMainMemLimit: 1000Mi

# OpenTelemetry export (rendered by the ariva-platform.otelEnv helper).
otel:
  endpoint: ""
  protocol: grpc

# Registry credentials for dalilacr-secret. Leave the password empty to skip rendering the secret
# (for example when it is created out of band). The release pipeline passes these with set flags.
imageCredentials:
  registry: dalil.azurecr.io
  username: ""
  password: ""

# Ingress definitions (see templates/ingresses.yaml); environment files provide the list.
ingresses: []
