# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
environment: k8s-dev
buildNumber: trunk
imageRepository: dalil.azurecr.io/ariva
replicas: 1
domain: dalilhub.tech
webSubDomain: dev-ariva
simulationSubDomain: simulation-dev-ariva
apiMainSubDomain: api-main-dev-ariva
apiIngestSubDomain: api-ingest-dev-ariva
apiStreamSubDomain: api-stream-dev-ariva
apiCronzSubDomain: api-cronz-dev-ariva
apiIntegrationSubDomain: api-integration-dev-ariva
# Identifies this cluster in telemetry (K8s Cluster Name). Set to the real cluster identity.
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-dev
releaseVersion: v-0.0.0

# Uploaded files (ARV-018): floor plans. PVCs can only grow; never lower size below the live capacity.
# ReadWriteMany (for example storageClassName azurefile-csi on AKS) is required before api-main scales out.
fileStorage:
  existingClaim: ""
  storageClassName: ""   # empty uses the cluster default storage class
  size: 2Gi
  accessMode: ReadWriteOnce

# Ingress definitions
ingresses:
  - name: api-main
    comment: Ariva API Main Ingress
    subdomain: api-main-dev-ariva
    serviceName: api-main-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "21m"  # ARV-018: a 20 MB floor plan plus multipart framing
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-ingest
    comment: Ariva API Ingest Ingress (vendor webhooks)
    subdomain: api-ingest-dev-ariva
    serviceName: api-ingest-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-cronz
    comment: Ariva API Cronz Ingress (TickerQ dashboard)
    subdomain: api-cronz-dev-ariva
    serviceName: api-cronz-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-integration
    comment: Ariva API Integration Ingress (AODB push)
    subdomain: api-integration-dev-ariva
    serviceName: api-integration-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "1m"  # ARV-043: the largest Integration API body is a 1 MB batch (ARV-044 raises it for 5 MB AIDX)
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: simulation
    comment: Ariva Simulation Ingress
    subdomain: simulation-dev-ariva
    serviceName: simulation-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: web
    comment: Ariva Web Ingress
    subdomain: dev-ariva
    serviceName: web-service
    annotations:
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "5m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  # ADR-0026: the web app and the API share one host, so the refresh cookie (Path=/api/auth, SameSite=Strict) and
  # SignalR need no cross-origin calls. A separate Ingress object because the web ingress rewrites every path to /.
  - name: web-api
    comment: Ariva API on the web host (/api to Ariva.Api.Main)
    subdomain: dev-ariva
    serviceName: api-main-service
    paths:
      - /api
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "21m"  # ARV-018: a 20 MB floor plan plus multipart framing

  # The live hub (ARV-035) on its own Ingress: its WebSocket URL carries the access token, so this one keeps no access log,
  # no ModSecurity audit log and only critical errors (tokenInQuery in templates/ingresses.yaml).
  - name: web-hubs
    comment: Ariva live hub on the web host (/hubs to Ariva.Api.Main)
    subdomain: dev-ariva
    serviceName: api-main-service
    tokenInQuery: true
    paths:
      - /hubs
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "64k"
