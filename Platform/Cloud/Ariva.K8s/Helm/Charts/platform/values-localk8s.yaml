# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Local Kubernetes (Docker Desktop, kind, k3d) with images built locally and hosts on localhost.
environment: k8s-dev
buildNumber: local
imageRepository: dalil.azurecr.io/ariva
imagePullPolicy: IfNotPresent
replicas: 1
domain: localhost
webSubDomain: ariva
simulationSubDomain: simulation-ariva
apiMainSubDomain: api-main-ariva
apiIngestSubDomain: api-ingest-ariva
apiStreamSubDomain: api-stream-ariva
apiCronzSubDomain: api-cronz-ariva
apiIntegrationSubDomain: api-integration-ariva
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: localk8s
releaseVersion: v-0.0.0

# Uploaded files (ARV-018): floor plans. PVCs can only grow; never lower size below the live capacity.
# ReadWriteMany (for example storageClassName azurefile-csi on AKS) is required before api-main scales out.
fileStorage:
  existingClaim: ""
  storageClassName: ""   # empty uses the cluster default storage class
  size: 2Gi
  accessMode: ReadWriteOnce

# Validation reader login (ARV-104g1; values.yaml): optional here, so a release without the secret still runs (the validation
# results then show no shadow figures); create the secret (keys username and password) to give api-main the reader.
validationReader:
  secretName: ariva-validation-reader
  optional: true

# Ingress definitions
ingresses:
  - name: api-main
    comment: Ariva API Main Ingress
    subdomain: api-main-ariva
    serviceName: api-main-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "21m"  # ARV-018: a 20 MB floor plan plus multipart framing
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: simulation
    comment: Ariva Simulation Ingress
    subdomain: simulation-ariva
    serviceName: simulation-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: web
    comment: Ariva Web Ingress
    subdomain: ariva
    serviceName: web-service
    annotations:
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "5m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  # ADR-0026: the web app and the API share one host, so the refresh cookie (Path=/api/auth, SameSite=Strict) and
  # SignalR need no cross-origin calls. A separate Ingress object because the web ingress rewrites every path to /.
  - name: web-api
    comment: Ariva API on the web host (/api to Ariva.Api.Main)
    subdomain: ariva
    serviceName: api-main-service
    paths:
      - /api
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "21m"  # ARV-018: a 20 MB floor plan plus multipart framing

  # The live hub (ARV-035) on its own Ingress: its WebSocket URL carries the access token, so this one keeps no access log,
  # no ModSecurity audit log and only critical errors (tokenInQuery in templates/ingresses.yaml).
  - name: web-hubs
    comment: Ariva live hub on the web host (/hubs to Ariva.Api.Main)
    subdomain: ariva
    serviceName: api-main-service
    tokenInQuery: true
    paths:
      - /hubs
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "64k"
