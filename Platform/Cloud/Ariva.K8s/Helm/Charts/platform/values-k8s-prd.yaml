# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Production defaults. Replace domain and subdomains with the customer's own names at deployment.
environment: k8s-prd
# Required: passed by the release pipeline (--set buildNumber=...). The chart refuses trunk or empty here.
buildNumber: ""
imageRepository: dalil.azurecr.io/ariva
replicas: 1
domain: dalilhub.tech
webSubDomain: ariva
simulationSubDomain: simulation-ariva
apiMainSubDomain: api-main-ariva
apiIngestSubDomain: api-ingest-ariva
apiStreamSubDomain: api-stream-ariva
apiCronzSubDomain: api-cronz-ariva
apiIntegrationSubDomain: api-integration-ariva
# Identifies this cluster in telemetry (K8s Cluster Name). Set to the real cluster identity.
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-prd
releaseVersion: v-0.0.0
imagePullPolicy: IfNotPresent
simulationEnabled: false
apiMainHpaMin: 2
apiMainHpaMax: 4
apiIngestHpaMin: 2
apiIngestHpaMax: 4
apiStreamHpaMin: 2
apiStreamHpaMax: 4
webHpaMin: 2
webHpaMax: 3

# Ingress definitions
ingresses:
  - name: api-main
    comment: Ariva API Main Ingress
    subdomain: api-main-ariva
    serviceName: api-main-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-ingest
    comment: Ariva API Ingest Ingress (vendor webhooks)
    subdomain: api-ingest-ariva
    serviceName: api-ingest-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-cronz
    comment: Ariva API Cronz Ingress (TickerQ dashboard)
    subdomain: api-cronz-ariva
    serviceName: api-cronz-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: api-integration
    comment: Ariva API Integration Ingress (AODB push)
    subdomain: api-integration-ariva
    serviceName: api-integration-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rewrite-target: /

  - name: web
    comment: Ariva Web Ingress
    subdomain: ariva
    serviceName: web-service
    annotations:
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "5m"
      nginx.ingress.kubernetes.io/rewrite-target: /
