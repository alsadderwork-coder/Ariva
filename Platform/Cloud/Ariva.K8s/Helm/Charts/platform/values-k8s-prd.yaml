# Default values for ariva-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Production defaults. Replace domain and subdomains with the customer's own names at deployment.
environment: k8s-prd
# Required: passed by the release pipeline (--set buildNumber=...). The chart refuses trunk or empty here.
buildNumber: ""
imageRepository: dalil.azurecr.io/ariva
replicas: 1
domain: dalilhub.tech
webSubDomain: ariva
simulationSubDomain: simulation-ariva
apiMainSubDomain: api-main-ariva
apiIngestSubDomain: api-ingest-ariva
apiStreamSubDomain: api-stream-ariva
apiCronzSubDomain: api-cronz-ariva
apiIntegrationSubDomain: api-integration-ariva
# Identifies this cluster in telemetry (K8s Cluster Name). Set to the real cluster identity.
# TLS certificate secret for every ingress host (created out of band, for example by cert-manager)
tlsSecretName: ariva-tls
clusterName: k8s-prd
releaseVersion: v-0.0.0

# Uploaded files (ARV-018): floor plans. PVCs can only grow; never lower size below the live capacity.
# ReadWriteMany (for example storageClassName azurefile-csi on AKS) is required before api-main scales out.
fileStorage:
  existingClaim: ""
  # Production runs api-main with 2 to 4 replicas, so the class must support ReadWriteMany: azurefile-csi on AKS
  # (mount options uid=10001,gid=10001,dir_mode=0750,file_mode=0640), NFS, CephFS or Longhorn RWX on premises.
  # Set it per customer cluster; with a class that cannot do ReadWriteMany the claim stays Pending and the install
  # waits, which is the intended loud failure.
  storageClassName: ""
  size: 2Gi
  accessMode: ReadWriteMany
imagePullPolicy: IfNotPresent
simulationEnabled: false

# Pod TLS (ARV-082b; values.yaml): the ingress reaches every pod over TLS and verifies it against the cluster CA. Required in
# production (the chart refuses it off). Create the cluster CA secret (caSecretName, key ca.crt) and each pod's
# kubernetes.io/tls secret (secretNames, for the Service's names) in the namespace first; a site may rename them here.
podTls:
  enabled: true

# The ingress controller (ARV-085; values.yaml): its pods (the ingress-nginx chart's labels in the namespace ingress-nginx by
# default) and their network. Required in production: podNetworks becomes every API host's Security:ForwardedHeaders:
# KnownNetworks, the only proxies whose X-Forwarded-For it trusts (IPv4 /14 or narrower, IPv6 /48 or narrower and not one that
# trusts IPv4 clients, values.yaml). 10.244.0.0/16 is the pod CIDR of AKS with kubenet or Azure CNI Overlay by default; replace
# it with the site cluster's pod CIDR (or the controller nodes' pod ranges) at deployment.
ingressController:
  podNetworks:
    - 10.244.0.0/16

# NetworkPolicies (ARV-085; values.yaml): default deny for every Ariva pod and exactly the firewall matrix's flows. Required in
# production (the chart refuses it off). Check the peers against the site's cluster before the release: kube-dns, TimescaleDB,
# Kafka and Redis by their labels; give the OTLP collector, Loki, the SMTP relay and api-integration's outbound endpoints
# (networkPolicies.otlp, loki, smtp and outbound) their peers, or they stay unreachable; with mqtt.enabled, the sensor
# networks (networkPolicies.mqttSensors.from).
networkPolicies:
  enabled: true
  # Loki, the log collector below (ARV-091a): required with logging.collector loki. 192.0.2.0/24 is a documentation network
  # (RFC 5737) that holds no Loki, so no log reaches Loki until the site gives its Loki's peers and port (TLS) here at
  # deployment; the go-live record checks that the hosts' lines arrive (wiki 13, checklist item 15).
  loki:
    to:
      - ipBlock:
          cidr: 192.0.2.0/24
    ports: [3100]

# Log shipping and the log pseudonym key (ARV-091a; values.yaml). Required in production: the chart refuses a release without a
# collector or without the key's Secret, and a host refuses to start without a collector over TLS or with the key from a file.
# - collector loki: the hosts get Loki__Enabled "true" from the chart, and Loki's https address is Loki:Uri in
#   base-appsettings-secret; a host refuses to start until it is there. A site that sends its logs to the OpenTelemetry
#   collector instead (SigNoz, which the system alerts need) sets collector otlp with an https otel.endpoint and the collector's
#   peers in networkPolicies.otlp. Record the choice, its access and its retention in the go-live record. A Loki that
#   authenticates senders takes its user name and password from a Secret the site creates (lokiCredentialsSecret, values.yaml).
# - pseudonymKeySecret: the site creates this Secret in the release's namespace before the release, with the key pseudonym-key
#   holding base64 of 32 or more random bytes (for example openssl rand -base64 32), one per deployment (never the border's and
#   the airport's alike), and never gives it to those who read the logs: with it, a day's pseudonym of any desk code can be
#   recomputed. Only the five API pods read it. A site may rename the Secret or its key here.
logging:
  collector: loki
  pseudonymKeySecret:
    name: ariva-log-pseudonym-key
    key: pseudonym-key

# Validation reader login (ARV-104g1; values.yaml): required in production, so the pilot's ground-truth proof always has its
# reader; create the secret (keys username and password) before the release (wiki/04, section 6.2).
validationReader:
  secretName: ariva-validation-reader
  optional: false

# Retention periods (ARV-111a; values.yaml, docs/privacy/data-inventory.md): the migration job applies them after the scripts.
# Raw sensing keeps the 90-day default until the contract's dispute window is known (TC-62); the relational periods are the
# Proposed defaults (TC-66 to TC-68). Change them here, per environment, and the next release applies them.
migration:
  retention:
    rawSensingDays: 90
    deskZoneReadingDays: 7
    laneStaffingDays: 90
    alertEmailDays: 180
    integrationCallDays: 400
    reportDeliveryDays: 400
    advertisingPlayDays: 400

apiMainHpaMin: 2
apiMainHpaMax: 4
apiIngestHpaMin: 2
apiIngestHpaMax: 4
apiStreamHpaMin: 2
apiStreamHpaMax: 4
webHpaMin: 2
webHpaMax: 3

# Ingress definitions
ingresses:
  - name: api-main
    comment: Ariva API Main Ingress
    subdomain: api-main-ariva
    serviceName: api-main-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "21m"  # ARV-018: a 20 MB floor plan plus multipart framing

  - name: api-ingest
    comment: Ariva API Ingest Ingress (vendor webhooks)
    subdomain: api-ingest-ariva
    serviceName: api-ingest-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  - name: api-cronz
    comment: Ariva API Cronz Ingress (TickerQ dashboard)
    subdomain: api-cronz-ariva
    serviceName: api-cronz-service
    # Plain HTTP redirected to HTTPS (ARV-084): the TickerQ dashboard, opened in a browser. The machine hosts refuse it (the default).
    plainHttp: redirect
    # The dashboard answers the management network only (ARV-085, wiki 04): required here, as allowlist-source-range; any other
    # client gets 403. 192.0.2.0/24 is a documentation network (RFC 5737) that no client has, so the dashboard stays closed
    # until the site's management network replaces it at deployment.
    sourceRanges:
      - 192.0.2.0/24
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  - name: api-integration
    comment: Ariva API Integration Ingress (AODB push)
    subdomain: api-integration-ariva
    serviceName: api-integration-service
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "1m"  # ARV-043: the token exchange and the JSON batches take at most 1 MB

  - name: api-integration-feeds
    comment: Ariva API Integration feeds (AIDX up to 5 MB; ARV-044)
    subdomain: api-integration-ariva
    serviceName: api-integration-service
    # Path-scoped: the request path reaches the pod as it is (no Ingress rewrites a path, ARV-085).
    paths:
      - /api/v1/integration/
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "5m"  # ARV-044: only the authenticated feed endpoints take 5 MB (AIDX); the host stops JSON batches at 1 MB

  - name: web
    comment: Ariva Web Ingress
    subdomain: ariva
    serviceName: web-service
    # Plain HTTP redirected to HTTPS (ARV-084): the web app, opened in a browser. The machine hosts refuse it (the default).
    plainHttp: redirect
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "5m"

  # ADR-0026: the web app and the API share one host, so the refresh cookie (Path=/api/auth, SameSite=Strict) and
  # SignalR need no cross-origin calls. A separate Ingress object, as its annotations (timeouts, body size) are not the web's.
  - name: web-api
    comment: Ariva API on the web host (/api to Ariva.Api.Main)
    subdomain: ariva
    serviceName: api-main-service
    # Plain HTTP redirected to HTTPS (ARV-084): the web host, opened in a browser. The machine hosts refuse it (the default).
    plainHttp: redirect
    paths:
      - /api
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "21m"  # ARV-018: a 20 MB floor plan plus multipart framing

  # The live hub (ARV-035) on its own Ingress: its WebSocket URL carries the access token, so this one keeps no access log,
  # no ModSecurity audit log and only critical errors (tokenInQuery in templates/ingresses.yaml).
  - name: web-hubs
    comment: Ariva live hub on the web host (/hubs to Ariva.Api.Main)
    subdomain: ariva
    serviceName: api-main-service
    # Plain HTTP redirected to HTTPS (ARV-084): the web host, opened in a browser. The machine hosts refuse it (the default).
    plainHttp: redirect
    tokenInQuery: true
    paths:
      - /hubs
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "64k"
