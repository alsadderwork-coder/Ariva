---
#ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-integration-configmap
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
data:
  DOTNET_ENVIRONMENT: {{ .Values.environment | quote }}
  RELEASE_VERSION: {{ .Values.releaseVersion | quote }}
  # ARV-165: the pod's grace period, so the host checks its 50 s shutdown timeout fits inside it
  Hosting__GracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 | quote }}
  # ARV-176: the startup probe's allowance below, at its worst: the kubelet's ticks run from before the container starts, so
  # the failureThreshold-th failure comes as early as initialDelaySeconds 10 + periodSeconds 15 x (failureThreshold 9 - 1);
  # the host checks that its consumers' waits at start (topics 60 s, readiness 30 s) fit inside it; the render test checks the two agree
  Hosting__StartupAllowanceSeconds: "130"
---
#Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-integration-deployment
  labels:
    app: api-integration
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiIntegrationReplicas | default .Values.replicas }}
  selector:
    matchLabels:
      app: api-integration
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: api-integration
    spec:
      # ARV-165: the host stops within its 50 s shutdown timeout (the bus 35 s, a stop during retries needing up to 25 s), then disposes and exits
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      imagePullSecrets:
        - name: dalilacr-secret
      volumes:
        # Kafka cluster CA (ARV-020): PEM ca.crt for SASL over TLS; optional, absent where Kafka is plaintext
        - name: kafka-ca
          secret:
            secretName: {{ .Values.kafkaCaSecretName | default "ariva-kafka-ca" }}
            optional: true
            defaultMode: 0444
        {{- include "ariva-platform.serverCaVolumes" . | nindent 8 }}
        {{- if include "ariva-platform.podTls" . }}
        {{- include "ariva-platform.podTlsVolume" (list . "api-integration") | nindent 8 }}
        {{- end }}
        # Writable scratch space; the root filesystem is read-only (CWE-269)
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Data Protection key-protection certificate (ARV-008): kubernetes.io/tls secret, read-only
        - name: dataprotection-certificate
          secret:
            secretName: {{ .Values.dataProtectionSecretName | default "ariva-dataprotection" }}
            defaultMode: 0400
        # Access token public keys (ARV-010a): public.pem, and previous.pem during a key rotation; read-only
        - name: token-public
          secret:
            secretName: {{ .Values.tokenPublicSecretName | default "ariva-token-public" }}
            defaultMode: 0444
        # Integration token key ring (ARV-042): its own P-256 pair, apart from the user ring; only this pod mounts it
        - name: integration-token-public
          secret:
            secretName: {{ .Values.integrationTokenPublicSecretName | default "ariva-integration-token-public" }}
            defaultMode: 0444
        - name: integration-token-signing
          secret:
            secretName: {{ .Values.integrationTokenSigningSecretName | default "ariva-integration-token-signing" }}
            defaultMode: 0400
        - name: api-integration-appsettings-base-volume
          secret:
            secretName: base-appsettings-secret
        - name: api-integration-appsettings-volume
          secret:
            secretName: api-integration-appsettings-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Group ownership of the secret volumes, so the app user can read the 0400 key files (as in api-main)
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-integration-container
          image: {{ include "ariva-platform.image" (list . "api-integration") }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            {{- include "ariva-platform.apiPorts" . | nindent 12 }}
          volumeMounts:
            - name: kafka-ca
              mountPath: /app/secrets/kafka-ca
              readOnly: true
            {{- include "ariva-platform.serverCaMounts" . | nindent 12 }}
            {{- if include "ariva-platform.podTls" . }}
            {{- include "ariva-platform.podTlsMount" . | nindent 12 }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: dataprotection-certificate
              mountPath: /app/secrets/dataprotection
              readOnly: true
            - name: token-public
              mountPath: /app/secrets/token-public
              readOnly: true
            - name: integration-token-public
              mountPath: /app/secrets/integration-token-public
              readOnly: true
            - name: integration-token-signing
              mountPath: /app/secrets/integration-token-signing
              readOnly: true
            - name: api-integration-appsettings-base-volume
              mountPath: /app/appsettings.base.{{ .Values.environment }}.json
              subPath: appsettings.base.{{ .Values.environment }}.json
            - name: api-integration-appsettings-volume
              mountPath: /app/appsettings.service.{{ .Values.environment }}.json
              subPath: appsettings.service.{{ .Values.environment }}.json
          env:
            {{- include "ariva-platform.otelEnv" . | nindent 12 }}
            {{- if (.Values.ingressController | default dict).podNetworks }}
            # The ingress controller's pod network, the only trusted proxies (ARV-085): Security:ForwardedHeaders:KnownNetworks
            {{- include "ariva-platform.forwardedHeadersEnv" . | nindent 12 }}
            {{- end }}
            # Kafka SASL password (ARV-020); optional, absent where Kafka is plaintext
            - name: Kafka__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaSecretName | default "ariva-kafka" }}
                  key: password
                  optional: true
          envFrom:
            - configMapRef:
                name: api-integration-configmap
          startupProbe:
            {{ include "ariva-platform.apiProbe" (list . "/health/startup") }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 9
            timeoutSeconds: 5
          readinessProbe:
            {{ include "ariva-platform.apiProbe" (list . "/health/readiness") }}
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.apiIntegrationCpuRequest | default "100m" }}
              memory: {{ .Values.apiIntegrationMemRequest | default "512Mi" }}
            limits:
              cpu: {{ .Values.apiIntegrationCpuLimit | default "500m" }}
              memory: {{ .Values.apiIntegrationMemLimit | default "750Mi" }}
          livenessProbe:
            {{ include "ariva-platform.apiProbe" (list . "/health/liveness") }}
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 5
---
#HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-integration-hpa
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-integration-deployment
  minReplicas: {{ .Values.apiIntegrationHpaMin | default 1 }}
  maxReplicas: {{ .Values.apiIntegrationHpaMax | default 1 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: api-integration-service
  labels:
    app: api-integration
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: api-integration
  type: ClusterIP
  ports:
    {{- include "ariva-platform.apiServicePorts" (list . "api-integration") | nindent 4 }}
