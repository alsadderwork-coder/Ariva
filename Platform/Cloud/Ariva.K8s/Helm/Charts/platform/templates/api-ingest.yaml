---
#ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-ingest-configmap
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
data:
  DOTNET_ENVIRONMENT: {{ .Values.environment | quote }}
  RELEASE_VERSION: {{ .Values.releaseVersion | quote }}
  {{- if and .Values.mqtt .Values.mqtt.enabled }}
  # MQTT transport (ARV-024): TLS with the mounted kubernetes.io/tls secret
  Ingest__Mqtt__Enabled: "true"
  Ingest__Mqtt__Port: {{ .Values.mqtt.port | default 8883 | quote }}
  Ingest__Mqtt__RequireTls: "true"
  Ingest__Mqtt__CertificatePath: "/app/secrets/mqtt-tls/tls.crt"
  Ingest__Mqtt__CertificateKeyPath: "/app/secrets/mqtt-tls/tls.key"
  {{- end }}
---
#Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ingest-deployment
  labels:
    app: api-ingest
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiIngestReplicas | default .Values.replicas }}
  selector:
    matchLabels:
      app: api-ingest
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: api-ingest
    spec:
      imagePullSecrets:
        - name: dalilacr-secret
      volumes:
        # Kafka cluster CA (ARV-020): PEM ca.crt for SASL over TLS; optional, absent where Kafka is plaintext
        - name: kafka-ca
          secret:
            secretName: {{ .Values.kafkaCaSecretName | default "ariva-kafka-ca" }}
            optional: true
            defaultMode: 0444
        # Writable scratch space; the root filesystem is read-only (CWE-269)
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Data Protection key-protection certificate (ARV-008): kubernetes.io/tls secret, read-only
        - name: dataprotection-certificate
          secret:
            secretName: {{ .Values.dataProtectionSecretName | default "ariva-dataprotection" }}
            defaultMode: 0400
        # Access token public keys (ARV-010a): public.pem, and previous.pem during a key rotation; read-only
        - name: token-public
          secret:
            secretName: {{ .Values.tokenPublicSecretName | default "ariva-token-public" }}
            defaultMode: 0444
        {{- if and .Values.mqtt .Values.mqtt.enabled }}
        # MQTT server certificate (ARV-024): kubernetes.io/tls secret, read-only
        - name: mqtt-tls
          secret:
            secretName: {{ .Values.mqtt.tlsSecretName }}
            defaultMode: 0400
        {{- end }}
        - name: api-ingest-appsettings-base-volume
          secret:
            secretName: base-appsettings-secret
        - name: api-ingest-appsettings-volume
          secret:
            secretName: api-ingest-appsettings-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Group ownership of the secret volumes, so the app user can read the 0400 key files (as in api-main)
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-ingest-container
          image: {{ include "ariva-platform.image" (list . "api-ingest") }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
            {{- if and .Values.mqtt .Values.mqtt.enabled }}
            - name: mqtt
              containerPort: {{ .Values.mqtt.port | default 8883 }}
            {{- end }}
          volumeMounts:
            - name: kafka-ca
              mountPath: /app/secrets/kafka-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dataprotection-certificate
              mountPath: /app/secrets/dataprotection
              readOnly: true
            - name: token-public
              mountPath: /app/secrets/token-public
              readOnly: true
            {{- if and .Values.mqtt .Values.mqtt.enabled }}
            - name: mqtt-tls
              mountPath: /app/secrets/mqtt-tls
              readOnly: true
            {{- end }}
            - name: api-ingest-appsettings-base-volume
              mountPath: /app/appsettings.base.{{ .Values.environment }}.json
              subPath: appsettings.base.{{ .Values.environment }}.json
            - name: api-ingest-appsettings-volume
              mountPath: /app/appsettings.service.{{ .Values.environment }}.json
              subPath: appsettings.service.{{ .Values.environment }}.json
          env:
            {{- include "ariva-platform.otelEnv" . | nindent 12 }}
            # Kafka SASL password (ARV-020); optional, absent where Kafka is plaintext
            - name: Kafka__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaSecretName | default "ariva-kafka" }}
                  key: password
                  optional: true
          envFrom:
            - configMapRef:
                name: api-ingest-configmap
          startupProbe:
            httpGet: { path: /health/startup, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health/readiness, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.apiIngestCpuRequest | default "250m" }}
              memory: {{ .Values.apiIngestMemRequest | default "512Mi" }}
            limits:
              cpu: {{ .Values.apiIngestCpuLimit | default "1000m" }}
              memory: {{ .Values.apiIngestMemLimit | default "1000Mi" }}
          livenessProbe:
            httpGet: { path: /health/liveness, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 5
---
#HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-ingest-hpa
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-ingest-deployment
  minReplicas: {{ .Values.apiIngestHpaMin | default 1 }}
  maxReplicas: {{ .Values.apiIngestHpaMax | default 1 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: api-ingest-service
  labels:
    app: api-ingest
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: api-ingest
  type: ClusterIP
  ports:
    - name: api-ingest-service-port
      port: 80
      targetPort: 8080
{{- if and .Values.mqtt .Values.mqtt.enabled }}
---
#Service (MQTT over TLS, ARV-024)
apiVersion: v1
kind: Service
metadata:
  name: api-ingest-mqtt-service
  labels:
    app: api-ingest
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: api-ingest
  type: {{ .Values.mqtt.serviceType | default "ClusterIP" }}
  {{- if ne (.Values.mqtt.serviceType | default "ClusterIP") "ClusterIP" }}
  # The device's address is checked against its allowed networks; Local keeps it.
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - name: mqtt
      port: {{ .Values.mqtt.port | default 8883 }}
      targetPort: mqtt
{{- end }}
