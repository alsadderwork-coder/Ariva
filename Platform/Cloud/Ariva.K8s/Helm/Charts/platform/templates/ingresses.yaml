{{- /*
One Ingress per entry of ingresses (values.yaml). The chart's annotations come from ariva-platform.ingressChartAnnotations
(_helpers.tpl): plain HTTP refused or redirected (plainHttp, ARV-084), the response headers of every host (HSTS, nosniff,
frame-ancestors 'none', on the ingress's own responses too), the affinity cookie Secure with SameSite=Strict, ModSecurity
with its audit log off (ARV-091), the live hub's logging (ARV-035) and /hubs answered 404 on every host without the hub's
Ingress (ARV-091) and, with pod TLS (ARV-082b), HTTPS to the pods verified against the cluster CA under the backend
Service's name. A site's own annotations are added after them: its server-snippet, configuration-snippet and
modsecurity-snippet are appended to the chart's (validate.yaml refuses one that would undo them), and any other key the
chart sets is refused by validate.yaml, so no Ingress carries a key twice.
*/ -}}
{{- $snippets := list "nginx.ingress.kubernetes.io/server-snippet" "nginx.ingress.kubernetes.io/configuration-snippet" "nginx.ingress.kubernetes.io/modsecurity-snippet" }}
{{- range $ingress := .Values.ingresses }}
{{- $chart := include "ariva-platform.ingressChartAnnotations" (list $ $ingress) | fromYaml }}
{{- $annotations := deepCopy $chart }}
{{- range $key, $value := ($ingress.annotations | default dict) }}
{{- if has $key $snippets }}
{{- $_ := set $annotations $key (printf "%s%s" (index $chart $key | default "") (toString $value)) }}
{{- else if not (hasKey $chart $key) }}
{{- $_ := set $annotations $key (toString $value) }}
{{- end }}
{{- end }}
---
#Ingress: {{ $ingress.comment }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ingress.name }}-ingress
  labels:
    {{- include "ariva-platform.labels" $ | nindent 4 }}
  # Pod TLS (ARV-082b), when on: HTTPS to the pods, whose certificate must chain to the cluster CA in podTls.caSecretName and
  # name the backend Service as the pods see it; TLS 1.2 or 1.3; up to two intermediate CAs below the cluster CA (the depth
  # counts intermediates only). ingress-nginx verifies, and applies these protocols, only when that secret holds ca.crt
  # (validate.yaml refuses one without it, or with a tls.key, when it can see the secret); it denies the location with 503
  # when it cannot read the secret at all.
  # The live hub (tokenInQuery): its WebSocket carries the access token as access_token in its URL (ARV-035, CWE-598), so no
  # access log and only critical errors, and no log line ever holds the request line with the token. The ModSecurity audit
  # log is off on every Ingress (ARV-091), and every other host answers /hubs 404 before any location.
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: nginx
  # TLS on every host (Platform/Cloud/CLAUDE.md); the certificate secret is per environment or per ingress.
  tls:
    - hosts:
        - "{{ $ingress.subdomain }}.{{ $.Values.domain }}"
      secretName: {{ $ingress.tlsSecretName | default $.Values.tlsSecretName | required "tlsSecretName must be set in the environment values" }}
  rules:
    - host: "{{ $ingress.subdomain }}.{{ $.Values.domain }}"
      http:
        paths:
          {{- $service := $ingress.serviceName }}
          {{- range ($ingress.paths | default (list "/")) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: {{ if include "ariva-platform.podTls" $ }}443{{ else }}80{{ end }}
          {{- end }}
{{- end }}
