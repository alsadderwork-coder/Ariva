{{- range .Values.ingresses }}
---
#Ingress: {{ .comment }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-ingress
  labels:
    {{- include "ariva-platform.labels" $ | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "ariva-{{ .name }}"
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($host != "{{ .subdomain }}.{{ $.Values.domain }}") {
        return 421;
      }
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRule FILES "@rx \.(exe|dll|bat|cmd|com|msi|sh|ps1|php|jsp|asp|aspx)$" "id:100001,phase:2,deny,status:403,log,msg:'Dangerous file upload blocked'"
      {{- if .tokenInQuery }}
      SecAuditEngine Off
      {{- end }}
    {{- if .tokenInQuery }}
    # The SignalR WebSocket carries the access token as access_token in its URL (ARV-035, CWE-598): no access log, no
    # ModSecurity audit log and only critical errors here, so no log line ever holds the request line with the token.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      error_log /dev/stderr crit;
    {{- end }}
    {{- range $key, $value := .annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  # TLS on every host (Platform/Cloud/CLAUDE.md); the certificate secret is per environment or per ingress.
  tls:
    - hosts:
        - "{{ .subdomain }}.{{ $.Values.domain }}"
      secretName: {{ .tlsSecretName | default $.Values.tlsSecretName | required "tlsSecretName must be set in the environment values" }}
  rules:
    - host: "{{ .subdomain }}.{{ $.Values.domain }}"
      http:
        paths:
          {{- $service := .serviceName }}
          {{- range (.paths | default (list "/")) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: 80
          {{- end }}
{{- end }}
