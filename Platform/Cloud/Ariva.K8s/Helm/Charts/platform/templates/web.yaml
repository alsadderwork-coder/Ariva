{{- if include "ariva-platform.podTls" . }}
---
#ConfigMap: the web pod's nginx listener with pod TLS (ARV-082b)
# Mounted over the image's /etc/nginx/listen.d, which default.conf includes inside its one server block: it hides the image's
# plain listen.d/plain.conf ("listen 3000"), so nginx answers TLS on 3443 and nothing else. TLS 1.2 and 1.3; the TLS 1.2
# suites ECDHE with AEAD only, the database's list (ARV-082a). nginx reads the certificate when it starts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-listen
  labels:
    app: web
    {{- include "ariva-platform.labels" . | nindent 4 }}
data:
  tls.conf: |
    listen 3443 ssl;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL;
    ssl_session_tickets off;
{{- end }}
---
#Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webReplicas | default .Values.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: dalilacr-secret
      # nginx writes its cache, pid file and temp files here; the root filesystem is read-only (CWE-269)
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        {{- if include "ariva-platform.podTls" . }}
        {{- include "ariva-platform.podTlsVolume" (list . "web") | nindent 8 }}
        # The TLS listener (ARV-082b): the whole directory, so the image's plain listener is hidden
        - name: nginx-listen
          configMap:
            name: web-nginx-listen
            defaultMode: 0444
            items:
              - key: tls.conf
                path: tls.conf
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        {{- if include "ariva-platform.podTls" . }}
        # Group ownership of the certificate volume, so nginx (uid 10001) reads the 0440 key
        fsGroup: 10001
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-container
          image: {{ include "ariva-platform.image" (list . "web") }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            {{- if include "ariva-platform.podTls" . }}
            - name: pod-tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: nginx-listen
              mountPath: /etc/nginx/listen.d
              readOnly: true
            {{- end }}
          ports:
            {{- if include "ariva-platform.podTls" . }}
            - name: https
              containerPort: 3443
            {{- else }}
            - containerPort: 3000
            {{- end }}
          startupProbe:
            {{- if include "ariva-platform.podTls" . }}
            httpGet: { path: /healthz, port: 3443, scheme: HTTPS }
            {{- else }}
            httpGet: { path: /healthz, port: 3000 }
            {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          readinessProbe:
            {{- if include "ariva-platform.podTls" . }}
            httpGet: { path: /healthz, port: 3443, scheme: HTTPS }
            {{- else }}
            httpGet: { path: /healthz, port: 3000 }
            {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 3
          resources:
            requests:
              cpu: {{ .Values.webCpuRequest | default "50m" }}
              memory: {{ .Values.webMemRequest | default "64Mi" }}
            limits:
              cpu: {{ .Values.webCpuLimit | default "250m" }}
              memory: {{ .Values.webMemLimit | default "128Mi" }}
          livenessProbe:
            {{- if include "ariva-platform.podTls" . }}
            httpGet: { path: /healthz, port: 3443, scheme: HTTPS }
            {{- else }}
            httpGet: { path: /healthz, port: 3000 }
            {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 3
---
#HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-deployment
  minReplicas: {{ .Values.webHpaMin | default 1 }}
  maxReplicas: {{ .Values.webHpaMax | default 1 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: web
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  type: ClusterIP
  ports:
    {{- if include "ariva-platform.podTls" . }}
    # Pod TLS (ARV-082b): 443 to nginx's TLS listener
    - name: https
      port: 443
      targetPort: https
    {{- else }}
    - name: web-service-port
      port: 80
      targetPort: 3000
    {{- end }}
