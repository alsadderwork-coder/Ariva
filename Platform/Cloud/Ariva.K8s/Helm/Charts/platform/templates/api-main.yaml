---
#ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-main-configmap
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
data:
  DOTNET_ENVIRONMENT: {{ .Values.environment | quote }}
  RELEASE_VERSION: {{ .Values.releaseVersion | quote }}
---
#Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-main-deployment
  labels:
    app: api-main
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiMainReplicas | default .Values.replicas }}
  selector:
    matchLabels:
      app: api-main
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: api-main
    spec:
      imagePullSecrets:
        - name: dalilacr-secret
      volumes:
        # Writable scratch space; the root filesystem is read-only (CWE-269)
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: api-main-appsettings-base-volume
          secret:
            secretName: base-appsettings-secret
        - name: api-main-appsettings-volume
          secret:
            secretName: api-main-appsettings-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-main-container
          image: "{{ .Values.imageRepository }}/api-main:{{ .Values.buildNumber }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: api-main-appsettings-base-volume
              mountPath: /app/appsettings.base.{{ .Values.environment }}.json
              subPath: appsettings.base.{{ .Values.environment }}.json
            - name: api-main-appsettings-volume
              mountPath: /app/appsettings.service.{{ .Values.environment }}.json
              subPath: appsettings.service.{{ .Values.environment }}.json
          env:
            {{- include "ariva-platform.otelEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: api-main-configmap
          startupProbe:
            httpGet: { path: /health/startup, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health/readiness, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.apiMainCpuRequest | default "250m" }}
              memory: {{ .Values.apiMainMemRequest | default "750Mi" }}
            limits:
              cpu: {{ .Values.apiMainCpuLimit | default "1000m" }}
              memory: {{ .Values.apiMainMemLimit | default "1000Mi" }}
          livenessProbe:
            httpGet: { path: /health/liveness, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 5
---
#HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-main-hpa
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-main-deployment
  minReplicas: {{ .Values.apiMainHpaMin | default 1 }}
  maxReplicas: {{ .Values.apiMainHpaMax | default 1 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: api-main-service
  labels:
    app: api-main
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: api-main
  type: ClusterIP
  ports:
    - name: api-main-service-port
      port: 80
      targetPort: 8080
