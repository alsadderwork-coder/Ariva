---
#ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-main-configmap
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
data:
  DOTNET_ENVIRONMENT: {{ .Values.environment | quote }}
  RELEASE_VERSION: {{ .Values.releaseVersion | quote }}
  # ARV-165: the pod's grace period, so the host checks its 50 s shutdown timeout fits inside it
  Hosting__GracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 | quote }}
  # ARV-176: the startup probe's allowance below, at its worst: the kubelet's ticks run from before the container starts, so
  # the failureThreshold-th failure comes as early as initialDelaySeconds 10 + periodSeconds 15 x (failureThreshold 9 - 1);
  # the host checks that its consumers' waits at start (topics 60 s, readiness 30 s) fit inside it; the render test checks the two agree
  Hosting__StartupAllowanceSeconds: "130"
  # Floor plans and other uploaded files (ARV-018), on the files volume below
  Storage__LocalRoot: /app/data/files
  {{- if .Values.kafkaTopics.job }}
  # The kafka-topics Job creates the topics before each release (ARV-062), so this host never needs create rights
  Kafka__ProvisionTopics: "false"
  {{- end }}
  {{- if .Values.demoSeed }}
  # Demo International Airport (ARV-019); the API refuses this outside vm-local, k8s-dev and k8s-demo
  Seed__DemoTopology: "true"
  {{- end }}
---
#Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-main-deployment
  labels:
    app: api-main
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiMainReplicas | default .Values.replicas }}
  {{- if eq (.Values.fileStorage.accessMode | default "ReadWriteOnce") "ReadWriteOnce" }}
  # A ReadWriteOnce volume attaches to one node: stop the old pod before starting the new one, or a rollout to
  # another node waits on the attach forever (ARV-018)
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: api-main
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: api-main
    spec:
      # ARV-165: the host stops within its 50 s shutdown timeout (the bus 35 s, a stop during retries needing up to 25 s), then disposes and exits
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      imagePullSecrets:
        - name: dalilacr-secret
      volumes:
        # Kafka cluster CA (ARV-020): PEM ca.crt for SASL over TLS; optional, absent where Kafka is plaintext
        - name: kafka-ca
          secret:
            secretName: {{ .Values.kafkaCaSecretName | default "ariva-kafka-ca" }}
            optional: true
            defaultMode: 0444
        {{- include "ariva-platform.serverCaVolumes" . | nindent 8 }}
        {{- if include "ariva-platform.podTls" . }}
        {{- include "ariva-platform.podTlsVolume" (list . "api-main") | nindent 8 }}
        {{- end }}
        # Writable scratch space; the root filesystem is read-only (CWE-269). 128Mi: the upload in progress is buffered here
        # (the upload policy takes one per host, 20 MB by default, an advertisement video up to Advertising:Videos:MaxMegabytes,
        # at most 100, so raise sizeLimit with it; parts over 64 KB of a form, over 30 KB of the site
        # configuration bundle; ARV-018, ARV-096), and so is any form of at most 1 MB sent to another action, which MVC reads
        # whatever the action binds (docs/security/costly-operations.md section 15 item 13, ARV-096b)
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        # Data Protection key-protection certificate (ARV-008): kubernetes.io/tls secret, read-only
        - name: dataprotection-certificate
          secret:
            secretName: {{ .Values.dataProtectionSecretName | default "ariva-dataprotection" }}
            defaultMode: 0400
        # Access token public keys (ARV-010a): public.pem, and previous.pem during a key rotation; read-only
        - name: token-public
          secret:
            secretName: {{ .Values.tokenPublicSecretName | default "ariva-token-public" }}
            defaultMode: 0444
        # Access token signing key (ARV-010a): only Ariva.Api.Main signs tokens; no other pod mounts it
        - name: token-signing
          secret:
            secretName: {{ .Values.tokenSigningSecretName | default "ariva-token-signing" }}
            defaultMode: 0400
        # Uploaded files (ARV-018): floor plans, under generated names only
        - name: files
          persistentVolumeClaim:
            claimName: {{ .Values.fileStorage.existingClaim | default "ariva-files" }}
        - name: api-main-appsettings-base-volume
          secret:
            secretName: base-appsettings-secret
        - name: api-main-appsettings-volume
          secret:
            secretName: api-main-appsettings-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the files volume writable by the app user (block volumes; Azure Files takes uid and gid mount options)
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-main-container
          image: {{ include "ariva-platform.image" (list . "api-main") }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            {{- include "ariva-platform.apiPorts" . | nindent 12 }}
          volumeMounts:
            - name: kafka-ca
              mountPath: /app/secrets/kafka-ca
              readOnly: true
            {{- include "ariva-platform.serverCaMounts" . | nindent 12 }}
            {{- if include "ariva-platform.podTls" . }}
            {{- include "ariva-platform.podTlsMount" . | nindent 12 }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: files
              mountPath: /app/data/files
            - name: dataprotection-certificate
              mountPath: /app/secrets/dataprotection
              readOnly: true
            - name: token-public
              mountPath: /app/secrets/token-public
              readOnly: true
            - name: token-signing
              mountPath: /app/secrets/token-signing
              readOnly: true
            - name: api-main-appsettings-base-volume
              mountPath: /app/appsettings.base.{{ .Values.environment }}.json
              subPath: appsettings.base.{{ .Values.environment }}.json
            - name: api-main-appsettings-volume
              mountPath: /app/appsettings.service.{{ .Values.environment }}.json
              subPath: appsettings.service.{{ .Values.environment }}.json
          env:
            {{- include "ariva-platform.otelEnv" . | nindent 12 }}
            {{- if (.Values.ingressController | default dict).podNetworks }}
            # The ingress controller's pod network, the only trusted proxies (ARV-085): Security:ForwardedHeaders:KnownNetworks
            {{- include "ariva-platform.forwardedHeadersEnv" . | nindent 12 }}
            {{- end }}
            {{- with include "ariva-platform.loggingEnv" . | trim }}
            # Log shipping and the log pseudonym key (ARV-091a; values logging)
            {{- . | nindent 12 }}
            {{- end }}
            # Kafka SASL password (ARV-020); optional, absent where Kafka is plaintext
            - name: Kafka__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaSecretName | default "ariva-kafka" }}
                  key: password
                  optional: true
            # The validation reader login (ARV-104g1): only this host and the migration job get it
            {{- include "ariva-platform.validationReaderEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: api-main-configmap
          startupProbe:
            {{ include "ariva-platform.apiProbe" (list . "/health/startup") }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 9
            timeoutSeconds: 5
          readinessProbe:
            {{ include "ariva-platform.apiProbe" (list . "/health/readiness") }}
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.apiMainCpuRequest | default "250m" }}
              memory: {{ .Values.apiMainMemRequest | default "750Mi" }}
            limits:
              cpu: {{ .Values.apiMainCpuLimit | default "1000m" }}
              memory: {{ .Values.apiMainMemLimit | default "1000Mi" }}
          livenessProbe:
            {{ include "ariva-platform.apiProbe" (list . "/health/liveness") }}
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 5
---
#HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-main-hpa
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-main-deployment
  minReplicas: {{ .Values.apiMainHpaMin | default 1 }}
  maxReplicas: {{ .Values.apiMainHpaMax | default 1 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: api-main-service
  labels:
    app: api-main
    {{- include "ariva-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: api-main
  type: ClusterIP
  ports:
    {{- include "ariva-platform.apiServicePorts" (list . "api-main") | nindent 4 }}
