{{- /*
Release guards. Renders nothing; fails the render when a rule is broken.
- Production never deploys a moving tag: buildNumber must be an explicit build (ARV-002).
- No environment deploys the "latest" tag.
- Production never seeds the fictional demo airport (ARV-019).
- The MQTT transport always has its TLS secret (ARV-024): device credentials never cross the network in clear.
- The validation reader login (ARV-104g1) comes from a secret named by validationReader.secretName, and production
  requires it (optional false), so the pilot's ground-truth proof always has its reader.
- The database connections (ARV-232, databaseConnections): every host's poolSize is a whole number from 2 to 100 (the bounds
  of the hosts' Database:MaxPoolSize), the other counts and the replica counts whole numbers, and the connections every replica
  may hold, over each host's largest replica count and the extra pods of a rolling update, with the migration job's and the
  operators' share, fit serverMaxConnections less superuserReserved.
- The retention periods (ARV-111a, migration.retention) are whole numbers of days within their bounds (the same bounds as
  RetentionSettings in Ariva.Infra), and no other key is given.
- The monitoring thresholds (ARV-125b) are in range: minutes 1 to 1440, a severity of warning or critical, usedPercent
  1 to 99, share above 0 and at most 1, criticalDays below warningDays (both 1 to 365), hours 6 to 168 (ARV-092c, the bounds of
  the hosts' MalwareScan:MaxSignatureAgeHours), records 0 or more, claims,
  services and namespaces Kubernetes names, namespaceLabel namespace or exported_namespace, channels and the monitoring
  environment plain names; every rule source has its values and no values name an unknown rule.
- The servers' CA secrets (ARV-082a, databaseCaSecretName and redisCaSecretName; empty means the default name) are
  Kubernetes secret names.
- Production sends telemetry over TLS only (ARV-082a): in k8s-prd a set otel.endpoint starts with https:// (empty turns
  OTLP export off).
- The collector's sender headers (ARV-091a): otel is a map of endpoint, protocol and headersSecret (name and key) only, so the
  headers (OTEL_EXPORTER_OTLP_HEADERS) can never be a value; with headersSecret named, otel.endpoint is an https:// URL in
  every environment.
- Pod TLS (ARV-082b, values podTls): enabled is true or false, and true in k8s-prd, where the hosts listen on HTTPS only;
  caSecretName and every secretNames entry are Kubernetes secret names, and secretNames names only the services that serve
  TLS. With it on, the simulator (plain HTTP both ways) is off, every Ingress routes to a service that serves TLS, no
  Ingress sets backend-protocol or a proxy-ssl annotation of its own (the chart sets them), and an Ingress that sets
  proxy-next-upstream keeps error and timeout in it, so a pod that briefly refuses new connections while it rebinds a
  renewed certificate (about 5 s) costs a retry on another pod, not an error. No Ingress annotation value (a site's
  configuration-snippet, server-snippet or any other) writes a proxy_ssl or grpc_ssl directive, a *_pass directive
  (proxy_pass, grpc_pass, fastcgi_pass and the others) or a *_by_lua block, so no snippet turns the verification off or
  proxies around it; the chart's own snippets are not values and write none of them.
- The pod TLS cluster CA (ARV-082b): when the release can see the cluster, the secret podTls.caSecretName in the release's
  namespace holds ca.crt and no tls.key (ariva-platform.podTlsCaRefusal); without ca.crt ingress-nginx would proxy to the
  pods unverified, and silently. lookup sees nothing when rendering offline (helm template) or before the secret exists,
  and the guard then passes: create the secret before the release, whose render against the cluster then judges it.
- Ingress transport and headers (ARV-084): every ingresses entry's plainHttp is refuse or redirect (empty: refuse); the
  Ingresses of one host share it; in k8s-prd an Ingress to api-main-service, api-ingest-service or api-integration-service
  on a host that does not serve web-service refuses (the machine hosts never redirect, ASVS 5.0 V4.1.2). A site annotation
  sets no key the chart sets (ariva-platform.ingressChartAnnotations) but the three snippets, which the chart appends to its
  own; the Ingresses of one host carry the same site server-snippet (ingress-nginx applies one per host); a site's
  modsecurity-snippet sets no SecRuleEngine or SecAuditEngine (the chart's). No annotation sets from-to-www-redirect (it makes
  ingress-nginx generate a server of its own for www.<host>, which carries none of the chart's headers and needs a
  certificate for a host the chart's tls section does not list) or custom-headers (a ConfigMap the chart cannot read, whose
  more_set_headers would replace the chart's), and no annotation value names Strict-Transport-Security,
  X-Content-Type-Options, Content-Security-Policy or more_clear_headers, so no site setting replaces or removes the headers.
- Network policies, trusted proxies and private probes (ARV-085):
  - ingressController: its namespaceSelector and podSelector are label selectors that select something; podNetworks is a list
    of CIDRs (network addresses: no address bits after the prefix, so 10.244.1.0/16 is refused), never 0.0.0.0/0 or ::/0,
    required in k8s-prd and there no wider than /14 (IPv4) or /48 (IPv6), and no IPv6 network that trusts IPv4 clients wider
    than a /14 (ariva-platform.mappedClientsRefusal: the IPv4-mapped block or a network holding it, a prefix from /65 to /77 or
    /97 to /109): every API host trusts X-Forwarded-For from these networks alone (Security:ForwardedHeaders:KnownNetworks)
    and refuses to start on any of these, so the chart refuses what the hosts would.
  - networkPolicies: enabled is true or false, and true in k8s-prd; no unknown key; dns, database, kafka, redis, otlp, loki
    and smtp each a list of peers (to) and, but for dns, one or more TCP ports; outbound a list of entries with a unique name
    (a DNS label), peers (one or more) and ports; mqttSensors.from a list of peers. A peer is an ipBlock (cidr and optional
    except, valid CIDRs) or a podSelector with an optional namespaceSelector, never both and never empty; in k8s-prd no ipBlock
    wider than /8 (IPv4) or /16 (IPv6), so never 0.0.0.0/0 or ::/0, and no namespaceSelector selecting every namespace
    without a podSelector. With it on: dns, database, kafka and redis have peers (the hosts need them); a set otel.endpoint
    has otlp peers; mqtt.enabled has mqttSensors peers; every Ingress routes to a service of the chart (whose pods the
    controller may then reach).
  - ingresses: sourceRanges is a list of CIDRs, required on every Ingress to api-cronz-service in k8s-prd and there no wider
        than /8 (IPv4) or /16 (IPv6); no annotation sets allowlist-source-range or whitelist-source-range (sourceRanges does); no
        path routes /health, /healthz or anything under them (the probes stay on the pods' ports; the chart's server-snippet
        answers them 404); no annotation sets rewrite-target or use-regex, and no annotation value writes a rewrite directive:
        the 404 is judged on the request's own path, before any rewrite, which could otherwise take another path to /health on
        the pod.
- Credentials out of the ingress's logs (ARV-091, ASVS 5.0 V16.2.5, CWE-532):
  - a site's modsecurity-snippet sets no SecRuleEngine, SecAuditEngine, SecAuditLog... or SecDebugLog... setting, no
    ctl:auditEngine or ctl:auditLogParts, and loads no rules (Include, SecRemoteRules): the chart keeps the ModSecurity audit
    log off on every Ingress, as it would record the request line and headers (bearer tokens, the refresh cookie) and, with
    part C, bodies, and the debug log writes the same values at its higher levels; nor does it expand a macro of the
    request's values (%{REQUEST_HEADERS...}, REQUEST_COOKIES, REQUEST_LINE, REQUEST_URI, REQUEST_BODY, FULL_REQUEST,
    QUERY_STRING, ARGS, XML, MATCHED_VAR or a TX capture), which a rule's msg or logdata would copy into the error log;
  - no annotation value writes a modsecurity directive (modsecurity, modsecurity_rules, modsecurity_rules_file ..., its name
    quoted or not), which could load the controller's modsecurity.conf or turn the audit log back on, or an access_log or
    error_log directive, which could write the request line with its query string (nginx's combined format) or log the live
    hub below critical;
  - tokenInQuery is true or false; an Ingress with tokenInQuery routes /hubs or paths under it only, and an Ingress that
    routes /hubs (in any case) or a path under it has tokenInQuery: the live hub's URL carries the access token, and the
    chart's server-snippet answers /hubs 404 on every host without such an Ingress. On that Ingress enable-access-log and
    enable-opentelemetry are the chart's ("false"), so no site annotation turns them on.
- Log shipping and the log pseudonym key (ARV-091a, ASVS 5.0 V16.4.2, V16.4.3, CWE-532; values logging):
  - logging is a map of collector, pseudonymKeySecret (name and key), lokiCredentialsSecret (name, usernameKey and passwordKey)
    and required, nothing else, so neither the key nor Loki's credentials can ever be a value; collector is otlp, loki or empty;
    each Secret's name is a Kubernetes secret name and its keys Secret keys; the pseudonym key's Secret key is one that is
    not 43 or more characters of base64's alphabet (the key itself, put there by mistake, would land in every manifest). No
    message repeats a logging value.
  - k8s-prd, and any release with logging.required true (the Helmfiles' prd), needs a collector and the Secret's name.
  - otlp needs otel.endpoint, an https:// URL, in every environment (with networkPolicies on, its peers: the ARV-085 rule above);
    loki with networkPolicies on needs networkPolicies.loki peers (the hosts check Loki:Uri themselves, from the appsettings
    secret).
  - when the release can see the cluster (lookup finds the namespace's kube-root-ca.crt ConfigMap), the Secret exists, holds
    the key, and its value is base64 of 32 or more bytes (ariva-platform.pseudonymKeyRefusal); helm template, or a namespace
    that does not exist yet, sees nothing and passes.
- The collectors' CAs (ARV-200; values otel.caSecretName and logging.lokiCaSecretName, for a collector whose certificate
  chains to the site PKI):
  - each a Kubernetes secret name; otel.caSecretName needs otel.endpoint, an https:// URL, and logging.lokiCaSecretName needs
    logging.collector loki: a collector's CA is checked over TLS only (the hosts refuse to start with it over plain HTTP), and
    each is read by its collector's clients alone;
  - when the release can see the cluster (the same kube-root-ca.crt lookup), the Secret exists and holds ca.crt and nothing
    else, so no private key or keystore in any form (a collector's own cert-manager Certificate Secret among them) sits in
    Ariva's namespace, and its ca.crt holds a PEM certificate and no private key, the file the hosts would otherwise refuse to
    start on (ariva-platform.collectorCaRefusal); helm template, or a namespace that does not exist yet, sees nothing and
    passes: the pods wait for the Secret.
- The malware scan beside Ariva.Api.Main (ARV-092c, ASVS 5.0 V5.4.3, V12.3.1; values uploadScan), last, so every other guard
  speaks first. No message repeats an uploadScan value (a mirror URL could carry a credential put there by mistake).
  - uploadScan is a map of enabled, image, signatures, clamd and freshclam, nothing else; enabled is true or false, and true in
    k8s-prd and in any release with logging.required (the Helmfiles' prd): a k8s-prd api-main does not start without a scanner
    on its pod's loopback.
  - With it on: image is a repository, a tag (not latest) and a sha256 digest; signatures is a map of source, mirrorUrl,
    mirrorCaSecretName, claimName and checksPerDay; source is public, mirror or mounted, and k8s-prd has no default (the site
    chooses); mirror needs mirrorUrl, an http:// or https:// URL with a host, an optional port and path and nothing else (no
    credentials, query, space or quote: the URL is written into freshclam.conf), https:// only in k8s-prd and with
    logging.required (every production connection encrypted, ASVS 5.0 V12.3.1), and mirrorCaSecretName, when given, a Kubernetes
    secret name with an https:// URL; mounted needs claimName, a Kubernetes name; a value read by another source only is
    refused; checksPerDay is a whole number from 1 to 24; clamd and freshclam give resources with requests and limits, each with
    cpu and memory.
  - With networkPolicies on and source public or mirror, networkPolicies.clamavMirror has peers: freshclam could not reach the
    mirror otherwise. clamd itself needs no rule: api-main reaches it on the pod's loopback.
*/ -}}
{{- if and (eq .Values.environment "k8s-prd") (or (empty .Values.buildNumber) (eq (toString .Values.buildNumber) "trunk")) }}
{{- fail "k8s-prd needs an explicit buildNumber (for example --set buildNumber=main-20261001.3); trunk and empty are not allowed" }}
{{- end }}
{{- if eq (toString .Values.buildNumber) "latest" }}
{{- fail "buildNumber latest is not allowed; use a build number or the local tag" }}
{{- end }}
{{- if and (eq (.Values.fileStorage.accessMode | default "ReadWriteOnce") "ReadWriteOnce") (or (gt (int (.Values.apiMainReplicas | default .Values.replicas)) 1) (gt (int (.Values.apiMainHpaMin | default 1)) 1) (gt (int (.Values.apiMainHpaMax | default 1)) 1)) }}
{{- fail "api-main with more than one replica needs fileStorage.accessMode ReadWriteMany (the floor plan volume, ARV-018)" }}
{{- end }}
{{- if and (eq .Values.environment "k8s-prd") .Values.demoSeed }}
{{- fail "demoSeed seeds a fictional airport and is not allowed in k8s-prd" }}
{{- end }}
{{- if and .Values.mqtt .Values.mqtt.enabled (empty .Values.mqtt.tlsSecretName) }}
{{- fail "mqtt.enabled needs mqtt.tlsSecretName (a kubernetes.io/tls secret); the MQTT listener is TLS only" }}
{{- end }}
{{- range $service, $digest := (.Values.imageDigests | default dict) }}
{{- if not (has $service (list "api-main" "api-ingest" "api-stream" "api-cronz" "api-integration" "simulation" "web")) }}
{{- fail (printf "imageDigests.%s is not an Ariva service" $service) }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (toString $digest)) }}
{{- fail (printf "imageDigests.%s must be a sha256 digest" $service) }}
{{- end }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" (toString (.Values.validationReader.secretName | default ""))) }}
{{- fail "validationReader.secretName must name the validation reader login's secret (keys username and password; ARV-104g1)" }}
{{- end }}
{{- if not (kindIs "bool" .Values.validationReader.optional) }}
{{- fail "validationReader.optional must be true or false" }}
{{- end }}
{{- if and (eq .Values.environment "k8s-prd") .Values.validationReader.optional }}
{{- fail "k8s-prd needs the validation reader secret: set validationReader.optional false (ARV-104g1)" }}
{{- end }}
{{- range $key, $name := dict "databaseCaSecretName" (.Values.databaseCaSecretName | default "ariva-database-ca") "redisCaSecretName" (.Values.redisCaSecretName | default "ariva-redis-ca") }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" (toString $name)) }}
{{- fail (printf "%s must be a Kubernetes secret name (a secret with the key ca.crt; ARV-082a)" $key) }}
{{- end }}
{{- end }}
{{- $otel := .Values.otel | default dict }}
{{- if not (kindIs "map" $otel) }}
{{- fail "otel must be a map: endpoint, protocol, headersSecret and caSecretName (ARV-082a, ARV-091a, ARV-200)" }}
{{- end }}
{{- range $key, $_ := $otel }}
{{- if not (has $key (list "endpoint" "protocol" "headersSecret" "caSecretName")) }}
{{- fail (printf "otel.%s is not a setting (endpoint, protocol, headersSecret, caSecretName; ARV-091a, ARV-200): the chart names the Secrets that hold the collector's sender headers and its CA, never the headers themselves" $key) }}
{{- end }}
{{- end }}
{{- $otelHeaders := $otel.headersSecret | default dict }}
{{- if not (kindIs "map" $otelHeaders) }}
{{- fail "otel.headersSecret must be a map: name and key, the Kubernetes Secret that holds OTEL_EXPORTER_OTLP_HEADERS (ARV-091a)" }}
{{- end }}
{{- range $key, $_ := $otelHeaders }}
{{- if not (has $key (list "name" "key")) }}
{{- fail (printf "otel.headersSecret.%s is not a setting (name, key; ARV-091a): the chart names the Secret that holds the collector's sender headers, never the headers themselves" $key) }}
{{- end }}
{{- end }}
{{- if and $otelHeaders.name (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" (toString $otelHeaders.name))) }}
{{- fail "otel.headersSecret.name must be a Kubernetes secret name, the Secret that holds OTEL_EXPORTER_OTLP_HEADERS (ARV-091a)" }}
{{- end }}
{{- if not (regexMatch "^[-._a-zA-Z0-9]{1,253}$" (toString ($otelHeaders.key | default "headers"))) }}
{{- fail "otel.headersSecret.key must be a key of a Kubernetes Secret: letters, digits, dot, dash and underscore (ARV-091a)" }}
{{- end }}
{{- $otelEndpoint := toString ((.Values.otel | default dict).endpoint | default "") }}
{{- if and $otelHeaders.name (not (regexMatch "^(?i)https://[^\\s]+$" $otelEndpoint)) }}
{{- if eq $otelEndpoint "" }}
{{- fail "otel.headersSecret needs otel.endpoint, an https:// URL: without one no exporter runs and the headers would be idle (ARV-091a)" }}
{{- else }}
{{- fail "otel.headersSecret needs otel.endpoint to be an https:// URL: the collector's sender headers cross the network encrypted only (ARV-091a)" }}
{{- end }}
{{- end }}
{{- $otelCaSecretName := toString ($otel.caSecretName | default "") }}
{{- if and $otelCaSecretName (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" $otelCaSecretName)) }}
{{- fail "otel.caSecretName must be a Kubernetes secret name, the Secret whose key ca.crt is the CA the OTLP collector's certificate chains to (ARV-200)" }}
{{- end }}
{{- if and $otelCaSecretName (not (regexMatch "^(?i)https://[^\\s]+$" $otelEndpoint)) }}
{{- if eq $otelEndpoint "" }}
{{- fail "otel.caSecretName needs otel.endpoint, an https:// URL: without one no exporter runs and the collector's CA would be idle (ARV-200)" }}
{{- else }}
{{- fail "otel.caSecretName needs otel.endpoint to be an https:// URL: a collector's CA is checked over TLS only, and the hosts refuse to start with it over plain HTTP (ARV-200)" }}
{{- end }}
{{- end }}
{{- if and (eq .Values.environment "k8s-prd") (ne $otelEndpoint "") (not (regexMatch "^(?i)https://[^\\s]+$" $otelEndpoint)) }}
{{- fail "k8s-prd sends telemetry over TLS only: otel.endpoint must be an https:// URL (or stay empty to turn OTLP export off; ARV-082a)" }}
{{- end }}
{{- $podTls := .Values.podTls }}
{{- if not (kindIs "map" $podTls) }}
{{- fail "podTls must be a map: enabled, caSecretName and secretNames (ARV-082b)" }}
{{- end }}
{{- if not (kindIs "bool" $podTls.enabled) }}
{{- fail "podTls.enabled must be true or false (ARV-082b)" }}
{{- end }}
{{- if and (eq .Values.environment "k8s-prd") (not $podTls.enabled) }}
{{- fail "k8s-prd serves the pods over TLS: set podTls.enabled true (ARV-082b); the hosts listen on HTTPS only there" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" (toString ($podTls.caSecretName | default "ariva-cluster-ca"))) }}
{{- fail "podTls.caSecretName must be a Kubernetes secret name (a secret with the key ca.crt, the cluster CA; ARV-082b)" }}
{{- end }}
{{- $tlsServices := list "api-main" "api-ingest" "api-stream" "api-cronz" "api-integration" "web" }}
{{- if not (kindIs "map" ($podTls.secretNames | default dict)) }}
{{- fail "podTls.secretNames must be a map of service to secret name (ARV-082b)" }}
{{- end }}
{{- range $service, $name := ($podTls.secretNames | default dict) }}
{{- if not (has $service $tlsServices) }}
{{- fail (printf "podTls.secretNames.%s is not a service that serves TLS (%s; ARV-082b)" $service (join ", " $tlsServices)) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" (toString ($name | default (printf "ariva-%s-tls" $service)))) }}
{{- fail (printf "podTls.secretNames.%s must be a Kubernetes secret name (a kubernetes.io/tls secret; ARV-082b)" $service) }}
{{- end }}
{{- end }}
{{- if $podTls.enabled }}
{{- if .Values.simulationEnabled }}
{{- fail "podTls.enabled needs simulationEnabled false: the simulator serves plain HTTP and calls the hosts over plain HTTP (ARV-082b)" }}
{{- end }}
{{- $tlsBackends := list }}
{{- range $tlsServices }}{{ $tlsBackends = append $tlsBackends (printf "%s-service" .) }}{{ end }}
{{- $caRefusal := include "ariva-platform.podTlsCaRefusal" (lookup "v1" "Secret" .Release.Namespace (toString ($podTls.caSecretName | default "ariva-cluster-ca"))) }}
{{- if $caRefusal }}
{{- fail $caRefusal }}
{{- end }}
{{- range $ingress := (.Values.ingresses | default list) }}
{{- if not (has (toString $ingress.serviceName) $tlsBackends) }}
{{- fail (printf "ingresses %s: with podTls.enabled an Ingress routes only to a service that serves TLS (%s), not %s (ARV-082b)" (toString $ingress.name) (join ", " $tlsBackends) (toString $ingress.serviceName)) }}
{{- end }}
{{- range $key, $value := ($ingress.annotations | default dict) }}
{{- if or (eq $key "nginx.ingress.kubernetes.io/backend-protocol") (hasPrefix "nginx.ingress.kubernetes.io/proxy-ssl-" $key) }}
{{- fail (printf "ingresses: %s is set by the chart with podTls.enabled; remove it from the ingress's annotations (ARV-082b)" $key) }}
{{- end }}
{{- if regexMatch "(?i)proxy_ssl|grpc_ssl|_pass\\b|_by_lua" (toString $value) }}
{{- fail (printf "ingresses %s: %s writes a proxy_ssl, grpc_ssl, _pass or _by_lua directive itself; with podTls.enabled only the chart's proxy-ssl annotations configure the proxy to the pods, so no snippet can turn the verification off (ARV-082b)" (toString $ingress.name) $key) }}
{{- end }}
{{- if and (eq $key "nginx.ingress.kubernetes.io/proxy-next-upstream") (not (and (has "error" (splitList " " (toString $value))) (has "timeout" (splitList " " (toString $value))))) }}
{{- fail "ingresses: proxy-next-upstream must keep error and timeout with podTls.enabled, so a pod rebinding a renewed certificate costs a retry, not an error (ARV-082b)" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $chartSnippets := list "nginx.ingress.kubernetes.io/server-snippet" "nginx.ingress.kubernetes.io/configuration-snippet" "nginx.ingress.kubernetes.io/modsecurity-snippet" }}
{{- $machineServices := list "api-main-service" "api-ingest-service" "api-integration-service" }}
{{- $webHosts := list }}
{{- range $ingress := (.Values.ingresses | default list) }}
{{- if eq (toString $ingress.serviceName) "web-service" }}{{ $webHosts = append $webHosts (toString $ingress.subdomain) }}{{ end }}
{{- end }}
{{- $hostModes := dict }}
{{- $hostServerSnippets := dict }}
{{- range $ingress := (.Values.ingresses | default list) }}
{{- $name := toString $ingress.name }}
{{- $host := toString $ingress.subdomain }}
{{- $mode := toString ($ingress.plainHttp | default "refuse") }}
{{- if not (has $mode (list "refuse" "redirect")) }}
{{- fail (printf "ingresses %s: plainHttp must be refuse or redirect, not %s (ARV-084)" $name $mode) }}
{{- end }}
{{- if and (eq $.Values.environment "k8s-prd") (eq $mode "redirect") (has (toString $ingress.serviceName) $machineServices) (not (has $host $webHosts)) }}
{{- fail (printf "ingresses %s: k8s-prd refuses plain HTTP on the machine hosts (api-main, api-ingest, api-integration): set plainHttp refuse, so a client sending credentials in clear is answered 403 instead of being redirected (ARV-084, ASVS 5.0 V4.1.2)" $name) }}
{{- end }}
{{- if and (hasKey $hostModes $host) (ne (index $hostModes $host) $mode) }}
{{- fail (printf "ingresses %s: the Ingresses of host %s must share one plainHttp (%s and %s; ARV-084)" $name $host (index $hostModes $host) $mode) }}
{{- end }}
{{- $_ := set $hostModes $host $mode }}
{{- $chart := include "ariva-platform.ingressChartAnnotations" (list $ $ingress) | fromYaml }}
{{- $siteServerSnippet := "" }}
{{- range $key, $value := ($ingress.annotations | default dict) }}
{{- if and (hasKey $chart $key) (not (has $key $chartSnippets)) }}
{{- fail (printf "ingresses %s: %s is set by the chart (ARV-084); remove it from the ingress's annotations (plain HTTP is the entry's plainHttp)" $name $key) }}
{{- end }}
{{- if eq $key "nginx.ingress.kubernetes.io/from-to-www-redirect" }}
{{- fail (printf "ingresses %s: from-to-www-redirect makes ingress-nginx generate a server of its own for www.<host>, which carries none of the chart's headers (HSTS, nosniff, frame-ancestors) and needs a certificate the chart's tls section does not list; add www.<host> as an entry of its own instead (ARV-084)" $name) }}
{{- end }}
{{- if eq $key "nginx.ingress.kubernetes.io/custom-headers" }}
{{- fail (printf "ingresses %s: custom-headers names a ConfigMap the chart cannot read, whose headers would replace the chart's; write headers in a snippet (ARV-084)" $name) }}
{{- end }}
{{- if regexMatch "(?i)strict-transport-security|x-content-type-options|content-security-policy|more_clear_headers" (toString $value) }}
{{- fail (printf "ingresses %s: %s names Strict-Transport-Security, X-Content-Type-Options, Content-Security-Policy or more_clear_headers; the chart sets those headers on every response and no annotation replaces or removes them (ARV-084)" $name $key) }}
{{- end }}
{{- if and (eq $key "nginx.ingress.kubernetes.io/modsecurity-snippet") (regexMatch "(?im)Sec(Rule|Audit)Engine|SecAuditLog|SecDebugLog|SecRemoteRules|ctl:\\s*audit(Engine|LogParts)|^\\s*Include\\s" (toString $value)) }}
