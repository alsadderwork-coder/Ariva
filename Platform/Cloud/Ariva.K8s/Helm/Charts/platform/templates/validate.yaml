{{- range $key, $settings := (.alerts | default dict) }}
{{- if not (has $key $sources) }}
{{- fail (printf "monitoring.alerts.%s names no rule in files/monitoring/alerts" $key) }}
{{- end }}
{{- if not (kindIs "map" $settings) }}
{{- fail (printf "monitoring.alerts.%s must be a map of settings" $key) }}
{{- end }}
{{- if and (hasKey $settings "enabled") (not (kindIs "bool" $settings.enabled)) }}
{{- fail (printf "monitoring.alerts.%s.enabled must be true or false" $key) }}
{{- end }}
{{- range $field, $value := $settings }}
{{- $number := or (kindIs "float64" $value) (kindIs "int64" $value) (kindIs "int" $value) }}
{{- if and (eq $field "minutes") (or (not $number) (lt (float64 $value) 1.0) (gt (float64 $value) 1440.0) (ne (float64 $value) (float64 (int $value)))) }}
{{- fail (printf "monitoring.alerts.%s.minutes must be a whole number from 1 to 1440" $key) }}
{{- end }}
{{- if and (eq $field "severity") (not (has (toString $value) (list "warning" "critical"))) }}
{{- fail (printf "monitoring.alerts.%s.severity must be warning or critical" $key) }}
{{- end }}
{{- if and (eq $field "records") (or (not $number) (lt (float64 $value) 0.0) (ne (float64 $value) (float64 (int $value)))) }}
{{- fail (printf "monitoring.alerts.%s.records must be a whole number, 0 or more" $key) }}
{{- end }}
{{- if and (eq $field "usedPercent") (or (not $number) (lt (float64 $value) 1.0) (gt (float64 $value) 99.0)) }}
{{- fail (printf "monitoring.alerts.%s.usedPercent must be from 1 to 99" $key) }}
{{- end }}
{{- if and (eq $field "share") (or (not $number) (le (float64 $value) 0.0) (gt (float64 $value) 1.0)) }}
{{- fail (printf "monitoring.alerts.%s.share must be above 0 and at most 1" $key) }}
{{- end }}
{{- if and (hasSuffix "Days" $field) (or (not $number) (lt (float64 $value) 1.0) (gt (float64 $value) 365.0) (ne (float64 $value) (float64 (int $value)))) }}
{{- fail (printf "monitoring.alerts.%s.%s must be a whole number of days from 1 to 365" $key $field) }}
{{- end }}
{{- if and (hasSuffix "Hours" $field) (or (not $number) (lt (float64 $value) 6.0) (gt (float64 $value) 168.0) (ne (float64 $value) (float64 (int $value)))) }}
{{- fail (printf "monitoring.alerts.%s.%s must be a whole number of hours from 6 to 168 (the bounds of the hosts' MalwareScan:MaxSignatureAgeHours)" $key $field) }}
{{- end }}
{{- if or (eq $field "claims") (eq $field "services") }}
{{- if or (not (kindIs "slice" $value)) (eq (len $value) 0) }}
{{- fail (printf "monitoring.alerts.%s.%s must be a list of one or more Kubernetes names" $key $field) }}
{{- end }}
{{- range $value }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" (toString .)) }}
{{- fail (printf "monitoring.alerts.%s.%s: %q is not a Kubernetes name" $key $field (toString .)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq $field "kinds" }}
{{- if or (not (kindIs "slice" $value)) (eq (len $value) 0) }}
{{- fail (printf "monitoring.alerts.%s.kinds must be a list of one or more queue engine refusal kinds" $key) }}
{{- end }}
{{- range $value }}
{{- if not (has (toString .) (list "Late" "Future" "Invalid" "UnknownGeometry" "Duplicates" "Reverse" "UnmatchedExits" "NegativeWaits" "BufferFull" "ForcedAdvances" "TooManyDevices" "DeviceShareFull")) }}
{{- fail (printf "monitoring.alerts.%s.kinds: %q is not a queue engine refusal kind (a QueueRejections count, ARV-231)" $key (toString .)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq $field "namespaces" }}
{{- if not (kindIs "slice" $value) }}
{{- fail (printf "monitoring.alerts.%s.namespaces must be a list of namespaces (empty: the release's namespace)" $key) }}
{{- end }}
{{- range $value }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" (toString .)) }}
{{- fail (printf "monitoring.alerts.%s.namespaces: %q is not a Kubernetes namespace name" $key (toString .)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (eq $field "namespaceLabel") (not (has (toString $value) (list "namespace" "exported_namespace"))) }}
{{- fail (printf "monitoring.alerts.%s.namespaceLabel must be namespace or exported_namespace" $key) }}
{{- end }}
{{- end }}
{{- if and (hasKey $settings "warningDays") (hasKey $settings "criticalDays") }}
{{- if ge (float64 $settings.criticalDays) (float64 $settings.warningDays) }}
{{- fail (printf "monitoring.alerts.%s.criticalDays must be below warningDays" $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $scan := .Values.uploadScan }}
{{- if not (kindIs "map" $scan) }}
{{- fail "uploadScan must be a map: enabled, image, signatures, clamd and freshclam (ARV-092c)" }}
{{- end }}
{{- range $key, $_ := $scan }}
{{- if not (has $key (list "enabled" "image" "signatures" "clamd" "freshclam")) }}
{{- fail (printf "uploadScan.%s is not a setting (enabled, image, signatures, clamd, freshclam; ARV-092c)" $key) }}
{{- end }}
{{- end }}
{{- if not (kindIs "bool" $scan.enabled) }}
{{- fail "uploadScan.enabled must be true or false (ARV-092c)" }}
{{- end }}
{{- if and $logRequired (not $scan.enabled) }}
{{- fail (printf "%s scans every upload for malware before it is stored or imported: set uploadScan.enabled true (ARV-092c); a k8s-prd api-main does not start without a scanner on its pod's loopback" $logWhere) }}
{{- end }}
{{- if $scan.enabled }}
{{- $image := $scan.image }}
{{- if or (not (kindIs "map" $image)) (without (keys ($image | default dict)) "repository" "tag" "digest") }}
{{- fail "uploadScan.image must be a map of repository, tag and digest (ARV-092c)" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?(:[0-9]{1,5})?(/[a-z0-9]([a-z0-9._-]{0,126}[a-z0-9])?){1,5}$" (toString ($image.repository | default ""))) }}
{{- fail "uploadScan.image.repository must be an image repository, such as clamav/clamav or a mirror's registry/path/clamav/clamav (ARV-092c)" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$" (toString ($image.tag | default "")))) (eq (toString $image.tag) "latest") }}
{{- fail "uploadScan.image.tag must be an explicit ClamAV tag, not empty or latest (ARV-092c)" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (toString ($image.digest | default ""))) }}
{{- fail "uploadScan.image.digest must be a sha256 digest; the ClamAV image is pinned by tag and digest (ARV-092c)" }}
{{- end }}
{{- $signatures := $scan.signatures }}
{{- if not (kindIs "map" $signatures) }}
{{- fail "uploadScan.signatures must be a map: source, mirrorUrl, mirrorCaSecretName, claimName and checksPerDay (ARV-092c)" }}
{{- end }}
{{- range $key, $_ := $signatures }}
{{- if not (has $key (list "source" "mirrorUrl" "mirrorCaSecretName" "claimName" "checksPerDay")) }}
{{- fail (printf "uploadScan.signatures.%s is not a setting (source, mirrorUrl, mirrorCaSecretName, claimName, checksPerDay; ARV-092c)" $key) }}
{{- end }}
{{- end }}
{{- $source := toString ($signatures.source | default "") }}
{{- $mirrorUrl := toString ($signatures.mirrorUrl | default "") }}
{{- $mirrorCa := toString ($signatures.mirrorCaSecretName | default "") }}
{{- $claim := toString ($signatures.claimName | default "") }}
{{- if and $prd (eq $source "") }}
{{- fail "k8s-prd chooses how clamd's signatures arrive: set uploadScan.signatures.source to public (freshclam from the ClamAV mirrors), mirror (freshclam from the site's mirror, uploadScan.signatures.mirrorUrl) or mounted (a claim the site keeps current, uploadScan.signatures.claimName); wiki 04 section 6.7 (ARV-092c)" }}
{{- end }}
{{- if not (has $source (list "public" "mirror" "mounted")) }}
{{- fail "uploadScan.signatures.source must be public, mirror or mounted (ARV-092c)" }}
{{- end }}
{{- if and (eq $source "mirror") (eq $mirrorUrl "") }}
{{- fail "uploadScan.signatures.source mirror needs uploadScan.signatures.mirrorUrl, the http:// or https:// URL of the site's signature mirror (ARV-092c)" }}
{{- end }}
{{- if and $mirrorUrl (ne $source "mirror") }}
{{- fail "uploadScan.signatures.mirrorUrl is read with source mirror only: clear it or set source mirror (ARV-092c)" }}
{{- end }}
{{- if and $mirrorUrl (not (regexMatch "^https?://([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*|\\[[0-9A-Fa-f:.]{2,45}\\])(:[0-9]{1,5})?(/[A-Za-z0-9._~%/-]*)?$" $mirrorUrl)) }}
{{- fail "uploadScan.signatures.mirrorUrl must be the http:// or https:// URL of the site's signature mirror: a host name or IP address, an optional port and path, and nothing else (no credentials, query, spaces or quotes; ARV-092c)" }}
{{- end }}
{{- if and $mirrorUrl $logRequired (not (hasPrefix "https://" $mirrorUrl)) }}
{{- fail (printf "%s takes signature updates over TLS only: uploadScan.signatures.mirrorUrl must be an https:// URL (ASVS 5.0 V12.3.1; ARV-092c)" $logWhere) }}
{{- end }}
{{- if and $mirrorCa (ne $source "mirror") }}
{{- fail "uploadScan.signatures.mirrorCaSecretName is read with source mirror only (ARV-092c)" }}
{{- end }}
{{- if and $mirrorCa (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?$" $mirrorCa)) }}
{{- fail "uploadScan.signatures.mirrorCaSecretName must be a Kubernetes secret name, the Secret whose key ca.crt is the CA the mirror's certificate chains to (ARV-092c)" }}
{{- end }}
{{- if and $mirrorCa (not (hasPrefix "https://" $mirrorUrl)) }}
{{- fail "uploadScan.signatures.mirrorCaSecretName needs an https:// mirrorUrl: a CA is checked over TLS only (ARV-092c)" }}
{{- end }}
{{- if and (eq $source "mounted") (eq $claim "") }}
{{- fail "uploadScan.signatures.source mounted needs uploadScan.signatures.claimName, the PersistentVolumeClaim that holds the signatures the site keeps current (ARV-092c)" }}
{{- end }}
{{- if and $claim (ne $source "mounted") }}
{{- fail "uploadScan.signatures.claimName is read with source mounted only: clear it or set source mounted (ARV-092c)" }}
{{- end }}
{{- if and $claim (not (regexMatch "^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$" $claim)) }}
{{- fail "uploadScan.signatures.claimName must be a Kubernetes name, the PersistentVolumeClaim of the signatures (ARV-092c)" }}
{{- end }}
{{- $checks := 12 }}
{{- if hasKey $signatures "checksPerDay" }}{{ $checks = $signatures.checksPerDay }}{{ end }}
{{- $checksNumber := or (kindIs "float64" $checks) (kindIs "int64" $checks) (kindIs "int" $checks) }}
{{- if or (not $checksNumber) (lt (float64 $checks) 1.0) (gt (float64 $checks) 24.0) (ne (float64 $checks) (float64 (int $checks))) }}
{{- fail "uploadScan.signatures.checksPerDay must be a whole number from 1 to 24: ClamAV asks for at most one check an hour (ARV-092c)" }}
{{- end }}
{{- range $container := list "clamd" "freshclam" }}
{{- $settings := index $scan $container }}
{{- $complete := false }}
{{- if and (kindIs "map" $settings) (not (without (keys ($settings | default dict)) "resources")) (kindIs "map" $settings.resources) }}
{{- $complete = true }}
{{- range $part := list "requests" "limits" }}
{{- $amounts := index $settings.resources $part }}
{{- if not (kindIs "map" $amounts) }}{{ $complete = false }}
{{- else if or (empty (toString ($amounts.cpu | default ""))) (empty (toString ($amounts.memory | default ""))) }}{{ $complete = false }}{{ end }}
{{- end }}
{{- end }}
{{- if not $complete }}
{{- fail (printf "uploadScan.%s must be a map of resources, with requests and limits each giving cpu and memory (ARV-092c)" $container) }}
{{- end }}
{{- end }}
{{- if and $np.enabled (has $source (list "public" "mirror")) (empty (($np.clamavMirror | default dict).to | default list)) }}
{{- fail "uploadScan.signatures.source public or mirror needs networkPolicies.clamavMirror.to, the signature mirror's peers: with networkPolicies.enabled freshclam could not reach it (ARV-092c)" }}
{{- end }}
{{- end }}
{{- /* ARV-232: the database connections every replica may hold fit what the server allows. */}}
{{- $db := .Values.databaseConnections }}
{{- if not (kindIs "map" $db) }}
{{- fail "databaseConnections must be a map of serverMaxConnections, superuserReserved, migration, operators and poolSize (ARV-232)" }}
{{- end }}
{{- $counts := dict "serverMaxConnections" (list 10 100000) "superuserReserved" (list 0 1000) "migration" (list 1 100) "operators" (list 0 1000) }}
{{- range $key, $range := $counts }}
{{- $value := index $db $key }}
{{- $number := or (kindIs "float64" $value) (kindIs "int64" $value) (kindIs "int" $value) }}
{{- if or (not $number) (lt (float64 $value) (float64 (index $range 0))) (gt (float64 $value) (float64 (index $range 1))) (ne (float64 $value) (float64 (int $value))) }}
{{- fail (printf "databaseConnections.%s must be a whole number from %d to %d (ARV-232)" $key (index $range 0) (index $range 1)) }}
{{- end }}
{{- end }}
{{- $pools := $db.poolSize }}
{{- if not (kindIs "map" $pools) }}
{{- fail "databaseConnections.poolSize must be a map of main, ingest, stream, cronz and integration (ARV-232)" }}
{{- end }}
{{- $hosts := dict "main" "apiMain" "ingest" "apiIngest" "stream" "apiStream" "cronz" "apiCronz" "integration" "apiIntegration" }}
{{- range $key, $_ := $pools }}
{{- if not (hasKey $hosts $key) }}
{{- fail (printf "databaseConnections.poolSize.%s is not a host; the hosts are cronz, ingest, integration, main and stream (ARV-232)" $key) }}
{{- end }}
{{- end }}
{{- $needed := add (int $db.migration) (int $db.operators) }}
{{- $parts := list }}
{{- /* The pools a host keeps besides its runtime pool: api-main's validation reader (4), api-stream's desk term reads (2). */}}
{{- $fixedPools := dict "main" 4 "stream" 2 }}
{{- range $name := list "replicas" "apiMainReplicas" "apiMainHpaMax" "apiIngestReplicas" "apiIngestHpaMax" "apiStreamReplicas" "apiStreamHpaMax" "apiCronzReplicas" "apiCronzHpaMax" "apiIntegrationReplicas" "apiIntegrationHpaMax" }}
{{- $count := index $.Values $name }}
{{- if not (kindIs "invalid" $count) }}
{{- $number := or (kindIs "float64" $count) (kindIs "int64" $count) (kindIs "int" $count) }}
{{- if or (not $number) (lt (float64 $count) 0.0) (gt (float64 $count) 1000.0) (ne (float64 $count) (float64 (int $count))) }}
{{- fail (printf "%s must be a whole number of replicas from 0 to 1000: the database connections are counted over it (ARV-232)" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $key := list "main" "ingest" "stream" "cronz" "integration" }}
{{- $pool := index $pools $key }}
{{- $number := or (kindIs "float64" $pool) (kindIs "int64" $pool) (kindIs "int" $pool) }}
{{- if or (not $number) (lt (float64 $pool) 2.0) (gt (float64 $pool) 100.0) (ne (float64 $pool) (float64 (int $pool))) }}
{{- fail (printf "databaseConnections.poolSize.%s must be a whole number from 2 to 100, the bounds of the hosts' Database:MaxPoolSize (ARV-232)" $key) }}
{{- end }}
{{- $prefix := index $hosts $key }}
{{- $hpaMax := int (index $.Values (printf "%sHpaMax" $prefix) | default 1) }}
{{- $fixed := int (index $.Values (printf "%sReplicas" $prefix) | default $.Values.replicas | default 1) }}
{{- $replicas := max $hpaMax $fixed }}
{{- /* A rolling update starts new pods before the old ones stop: Kubernetes' default maxSurge, 25 percent rounded up. api-main
       recreates instead while its upload volume is ReadWriteOnce (api-main.yaml), so it has no extra pod then. */}}
{{- $surge := int (ceil (divf $replicas 4.0)) }}
{{- if and (eq $key "main") (eq ($.Values.fileStorage.accessMode | default "ReadWriteOnce") "ReadWriteOnce") }}
{{- $surge = 0 }}
{{- end }}
{{- $extra := int (get $fixedPools $key | default 0) }}
{{- $needed = add $needed (mul (add $replicas $surge) (add (int $pool) $extra)) }}
{{- $parts = append $parts (printf "%s (%d + %d) x (%d + %d)" $key $replicas $surge (int $pool) $extra) }}
{{- end }}
{{- $allowed := sub (int $db.serverMaxConnections) (int $db.superuserReserved) }}
{{- if gt $needed $allowed }}
{{- fail (printf "the database connections every replica may hold, %d (%s, migration %d, operators %d), pass what the server allows, %d (databaseConnections.serverMaxConnections %d less superuserReserved %d): raise the server's max_connections with databaseConnections.serverMaxConnections (the Helmfile state value databaseMaxConnections sets both), or lower the replicas or the pools (ARV-232, wiki 04)" $needed (join ", " $parts) (int $db.migration) (int $db.operators) $allowed (int $db.serverMaxConnections) (int $db.superuserReserved)) }}
{{- end }}
