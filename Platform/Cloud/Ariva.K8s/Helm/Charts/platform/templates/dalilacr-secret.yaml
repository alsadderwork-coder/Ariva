{{- if and .Values.imageCredentials .Values.imageCredentials.password }}
---
#Secret: registry pull secret referenced by every Deployment as dalilacr-secret
apiVersion: v1
kind: Secret
metadata:
  name: dalilacr-secret
  labels:
    {{- include "ariva-platform.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "ariva-platform.imagePullSecret" . }}
{{- end }}
