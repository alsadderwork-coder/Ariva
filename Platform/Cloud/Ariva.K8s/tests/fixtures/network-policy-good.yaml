# ARV-085: a production render with every flow the firewall matrix allows (values-k8s-prd.yaml and network-policy-values.yaml),
# trimmed to what networkPolicyFindings reads, with the TimescaleDB release beside it (tests/chart-security.mjs, networkPolicySelfTest;
# generated, then kept as written). network-policy-expected.yaml holds the merged values it was rendered with.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ariva-default-deny
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - api-main
          - api-ingest
          - api-stream
          - api-cronz
          - api-integration
          - web
          - simulation
          - database-migration
          - kafka-topics
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-main-from-ingress-controller
spec:
  podSelector:
    matchLabels:
      app: api-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingest-from-ingress-controller
spec:
