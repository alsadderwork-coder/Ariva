apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-integration-outbound-egress
spec:
  podSelector:
    matchLabels:
      app: api-integration
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.30.0/24
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 2001:db8:40::/48
        - ipBlock:
            cidr: 10.21.0.0/16
            except:
              - 10.21.9.0/24
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
