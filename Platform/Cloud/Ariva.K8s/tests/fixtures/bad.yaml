apiVersion: apps/v1
kind: Deployment
metadata: { name: bad }
spec:
  template:
    spec:
      hostNetwork: true
      securityContext: { runAsUser: 0 }
      containers:
        - name: app
          image: registry.example/app:latest
          securityContext: { privileged: true }
        - name: sidecar
          image: registry.example/side:trunk
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: bad-no-tls }
spec:
  rules: [{ host: ariva.example }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: bad-host }
spec:
  tls: [{ hosts: [other.example], secretName: ariva-tls }]
  rules: [{ host: ariva.example }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-ingest-deployment }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: token-signing, secret: { secretName: ariva-token-signing } }
        - { name: integration-token-signing, secret: { secretName: ariva-integration-token-signing } }
      containers:
        - name: app
          image: registry.example/api-ingest:1.2.3
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: bad-hubs-logged }
spec:
  tls: [{ hosts: [ariva.example], secretName: ariva-tls }]
  rules: [{ host: ariva.example, http: { paths: [{ path: /api }, { path: /hubs }] } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-integration-deployment }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: token-public, secret: { secretName: ariva-token-public } }
      containers:
        - name: app
          image: registry.example/api-integration:main-20261001.1
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
