apiVersion: apps/v1
kind: Deployment
metadata: { name: bad }
spec:
  template:
    spec:
      hostNetwork: true
      securityContext: { runAsUser: 0 }
      containers:
        - name: app
          image: registry.example/app:latest
          securityContext: { privileged: true }
        - name: sidecar
          image: registry.example/side:trunk
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: bad-no-tls }
spec:
  rules: [{ host: ariva.example }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: bad-host }
spec:
  tls: [{ hosts: [other.example], secretName: ariva-tls }]
  rules: [{ host: ariva.example }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-ingest-deployment }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: token-signing, secret: { secretName: ariva-token-signing } }
        - { name: integration-token-signing, secret: { secretName: ariva-integration-token-signing, defaultMode: 0400 } }
      containers:
        - name: app
          image: registry.example/api-ingest:1.2.3
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: bad-hubs-logged }
spec:
  tls: [{ hosts: [ariva.example], secretName: ariva-tls }]
  rules: [{ host: ariva.example, http: { paths: [{ path: /api }, { path: /hubs }] } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-integration-deployment }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: token-public, secret: { secretName: ariva-token-public } }
      containers:
        - name: app
          image: registry.example/api-integration:main-20261001.1
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: bad-database }
spec:
  template:
    metadata: { labels: { app: bad-database } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: db
          image: registry.example/postgres:17
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          env:
            - { name: POSTGRES_PASSWORD, value: hunter2-in-the-manifest }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: selects-another-app }
spec:
  podSelector: { matchLabels: { app: database } }
  policyTypes: [Ingress]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: api-main-configmap }
data: { Storage__LocalRoot: /app/data/files }
---
apiVersion: batch/v1
kind: Job
metadata: { name: kafka-topics }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kafka-topics
          image: registry.example/api-main:main-20261001.1
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: database-init }
data:
  init.sh: |
    CREATE ROLE ariva LOGIN SUPERUSER;
