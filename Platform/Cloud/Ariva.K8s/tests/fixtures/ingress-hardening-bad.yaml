# ARV-084: one Ingress per case, each breaking one ingress hardening rule (its name is the case) (tests/chart-security.mjs, ingressHardeningSelfTest; generated, then kept as written).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hsts-missing
  annotations:
    ariva.dalil.tech/plain-http: refuse
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "false"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: ariva-hsts-missing
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-samesite: Strict
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/server-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      if ($host != "hsts-missing.example.test") {
        return 421;
      }
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      if ($scheme = http) {
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hsts-missing.example.test
      secretName: ariva-tls
  rules:
    - host: hsts-missing.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-main-service
                port:
                  number: 443
---
