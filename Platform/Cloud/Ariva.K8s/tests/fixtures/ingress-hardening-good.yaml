# ARV-084: Ingresses that hold every ingress hardening rule in k8s-prd (tests/chart-security.mjs, ingressHardeningSelfTest; generated, then kept as written).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-main
  annotations:
    ariva.dalil.tech/plain-http: refuse
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "false"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: ariva-api-main
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-samesite: Strict
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/server-snippet: |
      set $ariva_hsts "";
      if ($scheme = https) {
        set $ariva_hsts "max-age=31536000; includeSubDomains";
      }
      more_set_headers "Strict-Transport-Security: $ariva_hsts";
      more_set_headers "X-Content-Type-Options: nosniff";
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      if ($host != "api-main.example.test") {
        return 421;
      }
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      if ($scheme = http) {
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-main.example.test
      secretName: ariva-tls
  rules:
    - host: api-main.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-main-service
                port:
                  number: 443
---
