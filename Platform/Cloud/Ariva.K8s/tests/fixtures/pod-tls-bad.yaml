# web-plain-port: nginx's plain port 3000 beside its TLS port.
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-plain-port }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: pod-tls, secret: { secretName: ariva-web-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] } }
        - { name: nginx-listen, configMap: { name: web-plain-port-listen, items: [{ key: tls.conf, path: tls.conf }] } }
      containers:
        - name: web
          image: registry.example/ariva/web:main-1
          ports: [{ name: https, containerPort: 3443 }, { containerPort: 3000 }]
          volumeMounts:
            - { name: pod-tls, mountPath: /etc/nginx/tls, readOnly: true }
            - { name: nginx-listen, mountPath: /etc/nginx/listen.d, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: 3443, scheme: HTTPS }, periodSeconds: 15, failureThreshold: 4 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: web-plain-port-listen }
data:
  tls.conf: |
    listen 3443 ssl;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL;
---
