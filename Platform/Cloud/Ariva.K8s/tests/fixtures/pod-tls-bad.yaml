# api-subpath-certificate: tls.crt and tls.key mounted one by one with subPath, which a renewal never reaches.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-subpath-certificate }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: pod-tls, secret: { secretName: ariva-api-main-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] } }
      containers:
        - name: app
          image: registry.example/ariva/api-main:main-1
          ports: [{ name: https, containerPort: 8443 }]
          volumeMounts:
            - { name: pod-tls, mountPath: /app/secrets/pod-tls/tls.crt, subPath: tls.crt, readOnly: true }
            - { name: pod-tls, mountPath: /app/secrets/pod-tls/tls.key, subPath: tls.key, readOnly: true }
          readinessProbe: { httpGet: { path: /health/readiness, port: 8443, scheme: HTTPS }, periodSeconds: 15, failureThreshold: 4 }
---
# api-subpath-copy: the directory mounted whole, and the key once more elsewhere with subPath.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-subpath-copy }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: pod-tls, secret: { secretName: ariva-api-main-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] } }
      containers:
