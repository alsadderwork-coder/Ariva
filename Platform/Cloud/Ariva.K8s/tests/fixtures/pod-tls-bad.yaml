# ARV-082b: pod TLS renders that break one rule each, in the namespace ariva-site, parsed as Kubernetes reads them (YAML 1.1).
# Expected secrets: ariva-api-main-tls (api-main image) and ariva-web-tls (web image); the cluster CA ariva-cluster-ca. The
# first objects are valid and produce no finding; every case after them is the base with one change and trips exactly one rule
# (chart-security.mjs --self-test); keep each new case to one change of the base.
# The valid base objects the Service and Ingress cases use; they produce no finding.
apiVersion: apps/v1
kind: Deployment
metadata: { name: base-api }
spec:
  template:
    metadata: { labels: { app: base-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: pod-tls, secret: { secretName: ariva-api-main-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] } }
      containers:
        - name: app
          image: registry.example/ariva/api-main:main-1
          ports: [{ name: https, containerPort: 8443 }]
          volumeMounts:
            - { name: pod-tls, mountPath: /app/secrets/pod-tls, readOnly: true }
          readinessProbe: { httpGet: { path: /health/readiness, port: 8443, scheme: HTTPS }, periodSeconds: 15, failureThreshold: 4 }
---
apiVersion: v1
kind: Service
metadata: { name: base-api-service }
spec:
  selector: { app: base-api }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: base-web }
spec:
  template:
    metadata: { labels: { app: base-web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: pod-tls, secret: { secretName: ariva-web-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] } }
        - { name: nginx-listen, configMap: { name: base-web-listen, items: [{ key: tls.conf, path: tls.conf }] } }
      containers:
        - name: web
          image: registry.example/ariva/web:main-1
          ports: [{ name: https, containerPort: 3443 }]
          volumeMounts:
            - { name: pod-tls, mountPath: /etc/nginx/tls, readOnly: true }
            - { name: nginx-listen, mountPath: /etc/nginx/listen.d, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: 3443, scheme: HTTPS }, periodSeconds: 15, failureThreshold: 4 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: base-web-listen }
data:
  tls.conf: |
    listen 3443 ssl;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL;
---
apiVersion: v1
kind: Service
metadata: { name: base-web-service }
spec:
  selector: { app: base-web }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: base-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "ariva-site/ariva-cluster-ca"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-verify-depth: "2"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "base-api-service.ariva-site.svc"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-protocols: "TLSv1.2 TLSv1.3"
spec:
  rules:
    - host: base-ingress.example
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: base-api-service, port: { number: 443 } } } }
---
# api-plain-port: plain HTTP on 8080 beside the TLS port.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-plain-port }
spec:
  template:
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: pod-tls, secret: { secretName: ariva-api-main-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] } }
      containers:
        - name: app
          image: registry.example/ariva/api-main:main-1
          ports: [{ name: https, containerPort: 8443 }, { containerPort: 8080 }]
          volumeMounts:
            - { name: pod-tls, mountPath: /app/secrets/pod-tls, readOnly: true }
          readinessProbe: { httpGet: { path: /health/readiness, port: 8443, scheme: HTTPS }, periodSeconds: 15, failureThreshold: 4 }
