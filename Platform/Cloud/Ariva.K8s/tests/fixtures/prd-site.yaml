# A production site's own values on top of values-k8s-prd.yaml, which every site gives before its first release (the chart
# refuses k8s-prd without them). tests/chart-security.mjs adds this file after values-k8s-prd.yaml to every render of that file
# (and to the values the render is judged against), and to the Helmfile's prd; the guard cases clear what they prove refused.
# ARV-092c: the site's choice of signature source (wiki/04 section 6.7): its mirror over https with the site's CA, and the
# mirror's peers for the NetworkPolicies.
# ARV-232: the database's max_connections, as the Helmfile sets it from its state value databaseMaxConnections (400 in prd);
# values-k8s-prd.yaml sets none, so a production render without it is refused.
uploadScan:
  signatures:
    source: mirror
    mirrorUrl: https://clamav-mirror.site.example
    mirrorCaSecretName: site-clamav-mirror-ca
networkPolicies:
  clamavMirror:
    to:
      - ipBlock:
          cidr: 10.70.0.0/24
databaseConnections:
  serverMaxConnections: 400
