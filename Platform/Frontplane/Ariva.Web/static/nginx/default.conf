server {
    # The listener (ARV-082b): the image ships listen.d/plain.conf ("listen 3000;"); with pod TLS the chart mounts its
    # ConfigMap web-nginx-listen over the directory, whose tls.conf listens on 3443 with TLS only, so one server block
    # serves both layouts and no plain listener remains where TLS is on.
    include /etc/nginx/listen.d/*.conf;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html/web;
    index index.html;

    # Every text answer names its encoding (ARV-092, ASVS V4.1.1): index.html and the SPA fallback, /healthz, the scripts,
    # styles, JSON and SVG files go out with "; charset=utf-8". nginx always adds it to text/html; charset_types lists the
    # other types (text/javascript too, in case mime.types maps .js to it). Set at server level for every location; these
    # are not add_header directives, so the rule below about add_header in a location does not touch them.
    # scripts/postbuild-nginx.mjs fails the build when either line is missing.
    charset utf-8;
    charset_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers (CWE-79): the same values as csp.config.js and the vite preview server. They are set at
    # server level only, because an add_header inside a location block would drop all of them for that location.
    #
    # The Content-Security-Policy below is the fail-closed source value. `npm run build` runs
    # scripts/postbuild-nginx.mjs, which rewrites this line in build/nginx/default.conf (the file the Dockerfile
    # copies) with the sha256 hash of SvelteKit's inline bootstrap script and the API origins taken from the
    # VITE_ARIVA_* build variables (connect-src). An image built without that step does not start the app
    # instead of running without a policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA fallback: every unknown path is served by index.html (adapter-static fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
