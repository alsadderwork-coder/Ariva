# Local dependencies for Ariva development and integration tests (ARV-003).
#   node scripts/dev-up.mjs     creates .env with random passwords on first run, writes appsettings.local.json,
#                               starts these services and waits for their health checks
#   node scripts/dev-down.mjs   stops them (add --volumes to delete the data)
# Ports bind to 127.0.0.1 only and default away from AMAN's local ports (5432, 9092, 6379) so both stacks can run, and
# ClamAV's away from a system clamd's (3310).
# Images are pinned by tag and digest (ARV-096). scripts/base-images.mjs --check holds each pin to the same digest wherever
# else it is pinned (CI's services, the AppHost, Azure DevOps) and TimescaleDB to the chart's tag and digest; the base-images
# workflow (--resolve) proposes new digests for every copy at once.
name: ariva-dev

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17-ts2.31@sha256:cae378810532f8402c306d5a2bc6acc2c7550193d12f2b5ef9b2532efe0e98c0
    environment:
      POSTGRES_DB: ariva
      POSTGRES_USER: ariva
      POSTGRES_PASSWORD: ${ARIVA_DB_PASSWORD:?run node scripts/dev-up.mjs to create .env}
      ARIVA_READONLY_PASSWORD: ${ARIVA_DB_READONLY_PASSWORD:?run node scripts/dev-up.mjs to create .env}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:${ARIVA_DB_PORT:-5433}:5432"
    volumes:
      - timescaledb-data:/home/postgres/pgdata
      - ./deploy/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariva -d ariva -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${ARIVA_KAFKA_PORT:-19092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Topics are provisioned by the application from KafkaTopics (ADR-0018), not created on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 1048576
    ports:
      - "127.0.0.1:${ARIVA_KAFKA_PORT:-19092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  redis:
    image: redis:8.2-alpine@sha256:d1389b3f3f981460b9b0918c4d7390c6e9decb8c69b9f09a02e1b6fd7554ade7
    command: ["redis-server", "--requirepass", "${ARIVA_REDIS_PASSWORD:?run node scripts/dev-up.mjs to create .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${ARIVA_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${ARIVA_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  smtp4dev:
    image: rnwood/smtp4dev:3.15.0@sha256:25c434c1900a9c5b61e17ead0a774d9e81b80554d05cf64719d69e5ea8c66537 # the same version as the E2E local tool (.config/dotnet-tools.json)
    ports:
      - "127.0.0.1:${ARIVA_SMTP_PORT:-2525}:25"
      - "127.0.0.1:${ARIVA_SMTP_UI_PORT:-5080}:80"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/80'"] # bash built-in; the image has no curl
      interval: 10s
      timeout: 5s
      retries: 30

  # Malware scan of uploads (ARV-092b): Ariva.Api.Main streams each upload to clamd (MalwareScan:Host, MalwareScan:Port)
  # before it stores it. Offline: the image's signature snapshot and no freshclam, so no mirror traffic and the same verdicts
  # in every run. Ariva's limits come from Platform/Cloud/clamav/clamd.conf, mounted read-only.
  # Memory: clamd holds its signatures in memory, about 1 GiB once loaded (about 20 seconds after it starts); give Docker
  # Desktop's or Rancher Desktop's VM room for it.
  clamav:
    image: clamav/clamav:1.4.6@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "127.0.0.1:${ARIVA_CLAMD_PORT:-13310}:3310"
    volumes:
      - ./Platform/Cloud/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"] # the image's own: PING on 3310, healthy on PONG
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

volumes:
  timescaledb-data:
  kafka-data:
  redis-data:
