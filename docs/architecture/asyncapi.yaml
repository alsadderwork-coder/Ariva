          ariva-event-type:
            type: "string"
          ariva-event-version:
            type: "string"
          ariva-correlation-id:
            type: "string"
          ariva-causation-id:
            type: "string"
      bindings:
        kafka:
          key:
            type: "string"
            description: "The zone key <site>/<queue zone name> (ZoneKeys.For): every record of a zone stays on one partition, in order."
          bindingVersion: "0.5.0"
