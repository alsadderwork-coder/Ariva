      name: "DeskIntervalStats"
      title: "DeskIntervalStats"
      summary: "A desk's one-minute totals and service times. AMAN feed contract V1 (Ariva.Business.Contracts, ADR-0010): aggregate only, never an officer, traveller or document identifier; produced by AMAN (by the simulator's AMAN where none is connected), read only for Ariva. In a shared cluster Ariva holds read ACLs on aman.feed. and write ACLs only on ariva.; a member outside the schema is dead-lettered, not read."
      contentType: "application/json"
      payload:
        $ref: "#/components/schemas/DeskIntervalStats"
      bindings:
