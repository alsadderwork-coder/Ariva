            description: "The flight key. Ariva deduplicates on the source event id, not the key."
          bindingVersion: "0.5.0"
    DeadLetter:
      name: "DeadLetter"
      title: "Dead letter"
      summary: "A record a consumer could not read or handle after its retries, with the original bytes (base64, at most 512 KB), headers and the error."
      contentType: "application/json"
      payload:
        $ref: "#/components/schemas/DeadLetter"
      bindings:
        kafka:
          key:
            type: "string"
            description: "The source record's key, or none."
          bindingVersion: "0.5.0"
  schemas:
    TrackSampleBatch:
      type:
        - "object"
        - "null"
      properties:
        samples:
          type:
            - "array"
            - "null"
          items:
            type:
              - "object"
              - "null"
            properties:
              event:
                type:
                  - "object"
                  - "null"
                properties:
                  trackId:
                    type:
                      - "string"
                      - "null"
                  x:
                    type:
                      - "string"
                      - "number"
                    pattern: "^-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?$"
                  "y":
                    type:
                      - "string"
                      - "number"
                    pattern: "^-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?$"
                  heightMetres:
                    type:
                      - "string"
                      - "number"
                      - "null"
                    pattern: "^-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?$"
                  timeUtc:
                    type: "string"
                    format: "date-time"
                required:
                  - "trackId"
                  - "x"
                  - "y"
                  - "heightMetres"
                  - "timeUtc"
              timeUtc:
                type: "string"
                format: "date-time"
