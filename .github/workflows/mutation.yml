# Mutation testing of the pure engines (ARV-069): Stryker.NET mutates the formulas, the queue state engine, realised wait
# attribution and the nowcast in Ariva.Core and runs the unit tests that cover them against each mutant. The score must
# stay at 70 percent or more (the run fails below it; 80 is the target). Weekly and on demand; the HTML and JSON reports
# are an artifact once checked for secrets (ARV-271), and surviving mutants are triaged in backlog/progress.md. Scope and thresholds:
# Platform/Backplane/Ariva.UnitTests/stryker-config.json.
name: mutation

on:
  schedule:
    - cron: '41 1 * * 6' # Saturdays 01:41 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACT_DO_NOT_TRACK: true

jobs:
  stryker:
    name: Stryker.NET on the engines
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: sdk
        with:
          dotnet-version: '10.0.4xx'
      # ARV-214: without a global.json dotnet runs the newest SDK on the runner, preinstalled ones included (setup-dotnet's
      # README), so the job writes a temporary one at the repository root (whatever the job's working directory, so every
      # dotnet under it finds it) naming the SDK setup-dotnet installed, and proves dotnet runs it there.
      - name: Hold the job to the SDK installed (10.0.4xx)
        env:
          SDK: ${{ steps.sdk.outputs.dotnet-version }}
        run: |
          case "$SDK" in 10.0.4[0-9][0-9]) ;; *) echo "::error::setup-dotnet installed '$SDK', not the images' band 10.0.4xx"; exit 1 ;; esac
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' "$SDK" > "$GITHUB_WORKSPACE/global.json"
          cd "$GITHUB_WORKSPACE"
          test "$(dotnet --version)" = "$SDK" || { echo "::error::dotnet runs $(dotnet --version) at the repository root, not $SDK"; exit 1; }
      # The tool has its own manifest beside stryker-config.json: with SDK 10.0.4xx, restoring it from the same manifest
      # as aspire.cli fails ("not contained in the package"), which broke every job that restores the root tools.
      - name: Restore the pinned tool (dotnet-stryker)
        working-directory: Platform/Backplane/Ariva.UnitTests
        run: dotnet tool restore
      # Through scripts/mutation-run.mjs (ARV-069a): the run also fails when a method is in Stryker's safe mode (its mutants
      # removed as compile errors, so it is not measured) or no final score was printed, and (ARV-164a, --tests) when Stryker
      # found fewer tests than the unit test build it made (Debug) lists.
      - name: Mutation gate self-test (its checks fire on a safe-mode log, a log without a score and tests left out)
        run: node scripts/mutation-run.mjs --self-test
      # ARV-271: Stryker's output goes to the log file only (ARIVA_MUTATION_QUIET), not to this public job log: the check below
      # reads that file before anything of it is uploaded.
      - name: Mutation run (fails below the break threshold, on safe mode, without a score or with tests left out)
        working-directory: Platform/Backplane/Ariva.UnitTests
        env:
          ARIVA_MUTATION_QUIET: 'true'
        run: node "$GITHUB_WORKSPACE/scripts/mutation-run.mjs" --log "$GITHUB_WORKSPACE/.verify/mutation.log" --tests "$GITHUB_WORKSPACE/Platform/Backplane/Ariva.UnitTests/bin/Debug/net10.0/Ariva.UnitTests.dll" -- dotnet-stryker --concurrency 4 --output "$GITHUB_WORKSPACE/.verify/stryker"
      # ARV-271 (CWE-532): Stryker's log and report carry test failures' messages, and this repository is public. They are copied
      # to checked/ (links followed, so the check reads what the upload would) and that copy is checked for a credential
      # (Platform/Testing/Ariva.E2E/scripts/artifact-secrets.mjs, as the backend and E2E jobs check theirs) before the copy alone is
      # uploaded; a finding fails the job and nothing is uploaded. The script's self-test holds this wiring (mutationLogWiring).
      - name: Mutation log and report hold no secret (CWE-532)
        id: mutation-logs
        if: ${{ !cancelled() }}
        run: |
          mkdir checked
          for item in .verify/mutation.log .verify/stryker/reports; do
            if [ -e "$item" ]; then cp -RL "$item" checked/; fi
          done
          node Platform/Testing/Ariva.E2E/scripts/artifact-secrets.mjs checked
      - name: Mutation report
        if: ${{ !cancelled() && steps.mutation-logs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            checked/reports/
            checked/mutation.log
          if-no-files-found: warn
