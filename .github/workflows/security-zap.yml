# Dynamic security scan (ARV-063, layer 7 of wiki/13-Security-Guide.md): OWASP ZAP, pinned by digest, against the real
# hosts. Weekly and on demand, not on every pull request: the active scan takes up to an hour and leaves junk records.
#   ephemeral: the E2E stack in this runner (PostgreSQL, Kafka, Redis, clamd, the hosts, the web app under its production nginx
#              configuration); API scans of each host's OpenAPI document signed in as a system administrator, baseline
#              scans of every host and the web app (Platform/Testing/Ariva.E2E/tests/zap).
#   dev:       a baseline scan (spider and passive rules only, no attack) of the dev deployment, when the repository
#              variable ARIVA_DEV_WEB_URL names it.
# Either job fails on a High risk alert that security/zap-triage.json does not accept, and always publishes its reports
# as an artifact (zap-reports, zap-dev-report). Lower risks are triaged in backlog/progress.md.
name: security-zap

on:
  schedule:
    - cron: '41 2 * * 1' # Mondays, before the working week
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-zap
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: '22'
  # ghcr.io/zaproxy/zaproxy:2.17.0; keep in step with tests/zap/zap.spec.ts.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

jobs:
  ephemeral:
    name: ZAP API and baseline scans of the E2E stack
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The same services and settings as the e2e job of ci.yml; the passwords live for this job only.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17-ts2.31@sha256:cae378810532f8402c306d5a2bc6acc2c7550193d12f2b5ef9b2532efe0e98c0
        env:
          POSTGRES_PASSWORD: zap-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2-alpine@sha256:d1389b3f3f981460b9b0918c4d7390c6e9decb8c69b9f09a02e1b6fd7554ade7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: HOST://localhost:19092,INTERNAL://localhost:29092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        ports:
          - 19092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      CI: true
      ARIVA_E2E_ZAP: '1'
      ARIVA_E2E_SCHEMA_UPDATE: 'true'
      ARIVA_E2E_REDIS_URL: redis://localhost:6380
      ARIVA_E2E_KAFKA_BOOTSTRAP: localhost:19092
      # ARV-092b: the clamd started below, as in ci.yml's e2e job.
      ARIVA_E2E_CLAMD: 127.0.0.1:3310
      Database__Host: localhost
      Database__Port: '5433'
      Database__Name: postgres
      Database__Migration__Username: postgres
      Database__Migration__Password: zap-${{ github.run_id }}-${{ github.run_attempt }}
      Database__Username: ariva_app
      Database__Password: zap-runtime-login-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
        working-directory: Platform/Testing/Ariva.E2E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ARV-092b: Ariva.Api.Main scans every upload with clamd, as in ci.yml's e2e job (a step, since a service cannot mount the
      # repository's clamd.conf); it loads while the dependencies install.
      - name: Start clamd (malware scan of uploads)
        run: docker run -d --name ariva-zap-clamd -p 127.0.0.1:3310:3310 -e CLAMAV_NO_FRESHCLAMD=true -v "$GITHUB_WORKSPACE/Platform/Cloud/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" clamav/clamav:1.4.6@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web and test dependencies
        run: |
          npm ci --prefix ../../Frontplane/Ariva.Web
          npm ci
      - name: Wait for clamd to answer PING
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(echo PING | nc -w 3 127.0.0.1 3310 2>/dev/null)" = "PONG" ]; then echo "clamd answers PONG"; exit 0; fi
            sleep 3
          done
          echo "::error::clamd did not answer PING with PONG on 127.0.0.1:3310 within three minutes; its last log lines follow."
          docker logs --tail 40 ariva-zap-clamd
          exit 1
      # ARV-152: the job's account seed (playwright.config.ts keeps a seed it is given), so the artifact check below can derive
      # the scan account's password and the run's other secrets (given to the run from the seed) and look for them; the seed
      # and every value derived from it are masked in this public log.
      - name: Account seed for the run
        run: |
          seed="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$seed"
          ARIVA_E2E_ACCOUNT_SEED="$seed" node scripts/artifact-secrets.mjs --mask github
          echo "ARIVA_E2E_ACCOUNT_SEED=$seed" >> "$GITHUB_ENV"
          ARIVA_E2E_ACCOUNT_SEED="$seed" node scripts/artifact-secrets.mjs --env github >> "$GITHUB_ENV"
      - name: Reserve the hosts' ports from the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=51000-51100,25251,5081,3000
      - name: Scan (Playwright starts the stack; tests/zap runs ZAP)
        id: scan
        run: npx playwright test --project=zap 2>&1 | tee zap.log
      # ARV-152 (CWE-532): the authenticated API scans carry the scan account's bearer token, so before the reports are uploaded
      # nothing in them, in the run's log or in the Playwright report may hold a credential; a finding fails the job and
      # nothing is uploaded (scripts/artifact-secrets.mjs names the file and the kind, never the value).
      - name: No secret in the ZAP reports
        id: artifacts
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: node scripts/artifact-secrets.mjs --require-seed zap-reports zap.log playwright-report test-results
      - name: ZAP reports
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: Platform/Testing/Ariva.E2E/zap-reports
          retention-days: 30
      - name: Findings in the job summary
        if: always() && steps.artifacts.outcome == 'success'
        run: |
          if [ -f zap-reports/summary.md ]; then cat zap-reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  dev:
    name: ZAP baseline scan of the dev deployment
    if: ${{ vars.ARIVA_DEV_WEB_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Passive only: the spider and the passive rules, no attack on a shared environment.
      - name: Baseline scan
        env:
          TARGET: ${{ vars.ARIVA_DEV_WEB_URL }}
        run: |
          mkdir -p zap-dev && chmod 777 zap-dev
          docker run --rm -v "$PWD/zap-dev:/zap/wrk:rw" "$ZAP_IMAGE" zap-baseline.py -t "$TARGET" -m 3 -J dev.json -r dev.html -I
      - name: Gate on High risk findings
        run: node Platform/Testing/Ariva.E2E/scripts/zap-findings.mjs zap-dev/summary.md dev=zap-dev/dev.json
      - name: ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-dev-report
          path: zap-dev
          retention-days: 30
