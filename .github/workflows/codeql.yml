# CodeQL needs GitHub Advanced Security (Code Security) on private repositories. It runs only when the repository
# variable ENABLE_CODEQL is "true", so the workflow stays green until the licence is in place.
# Settings > Secrets and variables > Actions > Variables > New variable: ENABLE_CODEQL = true
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: vars.ENABLE_CODEQL == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'csharp'
        run: dotnet build Ariva.slnx -c Release
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
