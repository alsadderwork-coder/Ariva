# Pull request gate and main branch build (the GitHub equivalent of Ariva.Cicd/AzureDevOps/Common/Analyze-solution.yaml).
# Every job must pass before a pull request can merge: CWE security gate, backend build, unit and integration tests, web check
# and build, then the Playwright API end-to-end and functional suites against the real hosts.
# Actions are pinned to full commit SHAs (supply chain); Dependabot proposes updates (.github/dependabot.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: a step piped into tee must still fail when the command before the pipe fails. Without an explicit
# shell, Actions runs "bash -e" without pipefail, which hid build and test failures behind tee.
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: '22'

jobs:
  security-gate:
    name: CWE security gate and docs rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scanner self-test (every rule fires on the bad fixtures)
        run: node scripts/security/scan.mjs --self-test
      - name: Repository scan (14 CWEs, 40 rules)
        run: node scripts/security/scan.mjs
      - name: Docs writing rules
        run: node scripts/verify.mjs docs
      - name: Base images pinned by version and digest
        run: node scripts/base-images.mjs --check
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # same Helm as the release pipeline
      - name: Chart security (pod security context, read-only root, TLS, release guards)
        working-directory: Platform/Cloud/Ariva.K8s/tests
        run: |
          npm ci
          node chart-security.mjs
      - name: Security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: .verify/security-report.md
          if-no-files-found: ignore

  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # failure summary as a PR comment (job logs are not readable with the repo token scope we use)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Ariva.slnx 2>&1 | tee restore.log
      - name: Build (security analyzers as errors)
        run: dotnet build Ariva.slnx -c Release --no-restore 2>&1 | tee build.log
      - name: Unit, architecture and security tests
        run: dotnet test Platform/Backplane/Ariva.UnitTests/Ariva.UnitTests.csproj -c Release --no-build --logger trx --results-directory TestResults 2>&1 | tee unit.log
      - name: Integration tests (Testcontainers, Docker on the runner)
        run: dotnet test Platform/Backplane/Ariva.IntegrationTests/Ariva.IntegrationTests.csproj -c Release --no-build --logger trx --results-directory TestResults 2>&1 | tee integration.log
      - name: Test counts (fails when a suite ran no tests)
        if: always()
        run: |
          set +o pipefail # head closes pipes early on purpose here
          {
            echo "### Backend tests (${GITHUB_SHA::7})"
            echo '| Suite | Total | Passed | Failed | Skipped |'
            echo '|---|---|---|---|---|'
          } > test-summary.md
          status=0
          for trx in TestResults/*.trx; do
            [ -f "$trx" ] || continue
            counters=$(grep -o '<Counters [^>]*>' "$trx" | head -1)
            get() { echo "$counters" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*'; }
            total=$(get total); passed=$(get passed); failed=$(get failed); executed=$(get executed)
            skipped=$(( ${total:-0} - ${executed:-0} ))
            name=$(grep -o 'storage="[^"]*\.dll"' "$trx" | head -1 | sed 's#.*/##; s#\.dll"##')
            echo "| ${name:-$trx} | ${total:-0} | ${passed:-0} | ${failed:-0} | ${skipped} |" >> test-summary.md
            if [ "${total:-0}" -eq 0 ]; then status=1; fi
          done
          ls TestResults/*.trx >/dev/null 2>&1 || { echo '| no TRX files | 0 | 0 | 0 | 0 |' >> test-summary.md; status=1; }
          for log in unit.log integration.log; do
            [ -f "$log" ] && { echo; echo "\`$log\` (last lines)"; echo '```'; grep -v '^\s*$' "$log" | tail -n 8 | cut -c1-300; echo '```'; } >> test-summary.md
          done
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat test-summary.md
          exit $status
      - name: Post test counts on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: '[ -f test-summary.md ] && gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file test-summary.md || true'
      - name: Vulnerable packages (fails on high or critical)
        run: |
          dotnet list Ariva.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '\b(High|Critical)\b' vulnerable.txt; then echo "::error::High or critical vulnerable package"; exit 1; fi
      - name: Report failures on the pull request
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +o pipefail # head closes pipes early on purpose here
          {
            echo "### Backend job failed (${GITHUB_SHA::7})"
            if [ -f restore.log ] && grep -q ' error ' restore.log; then
              echo '#### Restore'; echo '```'; grep ' error ' restore.log | sort -u | head -40 | cut -c1-400; echo '```'
            fi
            if [ -f build.log ] && grep -Eq ': error [A-Z]+[0-9]+' build.log; then
              echo '#### Build'; echo '```'; grep -E ': error [A-Z]+[0-9]+' build.log | sed 's#/home/runner/work/[^/]*/[^/]*/##' | sort -u | head -60 | cut -c1-400; echo '```'
            fi
            for log in unit.log integration.log; do
              if [ -f "$log" ] && grep -Eq '^\s+Failed |error TESTERROR|\[FAIL\]' "$log"; then
                echo "#### ${log%.log} tests: failing tests"; echo '```'
                grep -E '^\s+Failed [A-Za-z]' "$log" | sed -E 's/^\s+Failed //; s/ \[[0-9.]+ m?s\]$//' | sort -u | head -100 | cut -c1-300
                echo '```'; echo "#### ${log%.log} tests: distinct errors"; echo '```'
                grep -A1 'Error Message:' "$log" | grep -v -E 'Error Message:|^--$' | sed -E 's/^\s+//' | sort | uniq -c | sort -rn | head -25 | cut -c1-300
                echo '```'; echo "#### ${log%.log} tests: first details"; echo '```'
                grep -E -A14 '^\s+Failed [A-Za-z]' "$log" | head -80 | cut -c1-300; echo '```'
              fi
            done
            if [ -f vulnerable.txt ] && grep -Eq '\b(High|Critical)\b' vulnerable.txt; then
              echo '#### Vulnerable packages'; echo '```'; grep -E '>|High|Critical' vulnerable.txt | head -40; echo '```'
            fi
          } > failure.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file failure.md
      - name: Test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Web check, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Platform/Frontplane/Ariva.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Platform/Frontplane/Ariva.Web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: Playwright API end-to-end and functional tests
    needs: [security-gate, backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # failure summary as a PR comment
    # Sign-in (ARV-010a) needs PostgreSQL: the hosts migrate it at startup (vm-local) and Ariva.Api.Main seeds the E2E
    # accounts. Same image as the integration tests and the dev environment. The password only lives for this job.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17-ts2.30
        env:
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      ARIVA_E2E_SCHEMA_UPDATE: 'true'
      Database__Host: localhost
      Database__Port: '5433'
      Database__Name: postgres
      # As in production: the migration login applies the scripts and creates the DML-only runtime login the hosts use.
      Database__Migration__Username: postgres
      Database__Migration__Password: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      Database__Username: ariva_app
      Database__Password: e2e-runtime-login-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: Platform/Testing/Ariva.E2E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web and test dependencies
        run: |
          npm ci --prefix ../../Frontplane/Ariva.Web
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the suite (Playwright starts the hosts and the web preview)
        run: npx playwright test 2>&1 | tee e2e.log
      - name: Report failures on the pull request
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +o pipefail # head closes pipes early on purpose here
          {
            echo "### E2E job failed (${GITHUB_SHA::7})"
            if [ -f e2e.log ]; then
              echo '#### Failing tests'; echo '```'
              grep -E '^\s+[0-9]+\) \[' e2e.log | sed -E 's/ ─+$//' | sort -u | head -60 | cut -c1-300
              echo '```'; echo '#### First failure details'; echo '```'
              sed -n '/^  1) \[/,$p' e2e.log | grep -v '^\s*$' | head -120 | cut -c1-300
              echo '```'; echo '#### Host output (WebServer, last lines)'; echo '```'
              grep '\[WebServer\]' e2e.log | tail -n 40 | cut -c1-300
              echo '```'; echo '#### Last lines'; echo '```'
              grep -v '^\s*$' e2e.log | tail -n 15 | cut -c1-300; echo '```'
            fi
            for log in logs/*/*.log; do
              [ -f "$log" ] || continue
              if grep -qE '"@l":"(Error|Fatal)"|"Level":"(Error|Fatal)"' "$log"; then
                echo "#### ${log##*/}: errors"; echo '```'
                grep -E '"@l":"(Error|Fatal)"|"Level":"(Error|Fatal)"' "$log" | head -8 | cut -c1-600; echo '```'
              fi
            done
          } > failure.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file failure.md
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            Platform/Testing/Ariva.E2E/playwright-report
            Platform/Testing/Ariva.E2E/test-results
          retention-days: 7
