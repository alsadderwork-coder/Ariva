# Pull request gate and main branch build (the GitHub equivalent of Ariva.Cicd/AzureDevOps/Common/Analyze-solution.yaml).
# Every job must pass before a pull request can merge: CWE security gate, backend build and unit tests, web check
# and build, then the Playwright API end-to-end and functional suites against the real hosts.
# Actions are pinned to full commit SHAs (supply chain); Dependabot proposes updates (.github/dependabot.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: '22'

jobs:
  security-gate:
    name: CWE security gate and docs rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scanner self-test (every rule fires on the bad fixtures)
        run: node scripts/security/scan.mjs --self-test
      - name: Repository scan (14 CWEs, 40 rules)
        run: node scripts/security/scan.mjs
      - name: Docs writing rules
        run: node scripts/verify.mjs docs
      - name: Base images pinned by version and digest
        run: node scripts/base-images.mjs --check
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # same Helm as the release pipeline
      - name: Chart security (pod security context, read-only root, TLS, release guards)
        working-directory: Platform/Cloud/Ariva.K8s/tests
        run: |
          npm ci
          node chart-security.mjs
      - name: Security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: .verify/security-report.md
          if-no-files-found: ignore

  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Ariva.slnx
      - name: Build (security analyzers as errors)
        run: dotnet build Ariva.slnx -c Release --no-restore
      - name: Unit, architecture and security tests
        run: dotnet test Platform/Backplane/Ariva.UnitTests/Ariva.UnitTests.csproj -c Release --no-build --logger trx --results-directory TestResults
      - name: Vulnerable packages (fails on high or critical)
        run: |
          dotnet list Ariva.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '\b(High|Critical)\b' vulnerable.txt; then echo "::error::High or critical vulnerable package"; exit 1; fi
      - name: Test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Web check, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Platform/Frontplane/Ariva.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Platform/Frontplane/Ariva.Web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: Playwright API end-to-end and functional tests
    needs: [security-gate, backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        working-directory: Platform/Testing/Ariva.E2E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web and test dependencies
        run: |
          npm ci --prefix ../../Frontplane/Ariva.Web
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the suite (Playwright starts the hosts and the web preview)
        run: npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            Platform/Testing/Ariva.E2E/playwright-report
            Platform/Testing/Ariva.E2E/test-results
          retention-days: 7
