# Container images for every host and the web app, scanned with Trivy, pushed to GitHub Container Registry on
# version tags (v*) or when run by hand from main. Pull requests, and runs from other branches, build and scan without pushing.
# Supply-chain evidence (ARV-073): every pushed image is signed with cosign keyless (GitHub OIDC, Fulcio certificate,
# Rekor transparency log), and its CycloneDX SBOM (Trivy) is attached as a signed attestation; both are verified right
# after. The digests job lists every image by digest with the verification commands for the release notes
# (wiki/18) and as the image-digests artifact. Verify and enforce on a cluster: wiki/04, section 6.5.
# Customer deployments that must use Dalil Container Registry keep the Azure DevOps pipelines in
# Platform/Cloud/Ariva.Cicd/AzureDevOps (Azure Pipelines can build from this GitHub repository).
name: images

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['**/Dockerfile', '.dockerignore', 'Directory.*.props']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write # keyless signing (ARV-073): the job's OIDC token gets a short-lived Fulcio certificate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-main
            dockerfile: Platform/Backplane/Ariva.Api.Main/Dockerfile
            context: .
          - image: api-ingest
            dockerfile: Platform/Backplane/Ariva.Api.Ingest/Dockerfile
            context: .
          - image: api-stream
            dockerfile: Platform/Backplane/Ariva.Api.Stream/Dockerfile
            context: .
          - image: api-cronz
            dockerfile: Platform/Backplane/Ariva.Api.Cronz/Dockerfile
            context: .
          - image: api-integration
            dockerfile: Platform/Backplane/Ariva.Api.Integration/Dockerfile
            context: .
          - image: simulation
            dockerfile: Platform/Simulation/Ariva.Simulation.Api/Dockerfile
            context: .
          - image: web
            dockerfile: Platform/Frontplane/Ariva.Web/Dockerfile
            context: .
    env:
      # ghcr.io/<owner>/ariva/<service>: the chart's imageRepository/<service> layout, as in Dalil Container Registry.
      IMAGE: ghcr.io/${{ github.repository_owner }}/ariva/${{ matrix.image }}
      # Pushed and signed only from a version tag or main, the identities a deployment trusts; elsewhere build and scan.
      PUSH: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
      # Who may have signed: this workflow, on a version tag or main (wiki/04, section 6.5).
      SIGNER: ^https://github\.com/${{ github.repository }}/\.github/workflows/images\.yml@refs/(tags/v.+|heads/main)$
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f "${{ matrix.dockerfile }}" -t "$IMAGE:$TAG" "${{ matrix.context }}"
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          version: v0.75.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-image.txt
      - name: Report findings on the pull request and fail on high or critical
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          if grep -Eq 'Total: [1-9]' trivy-image.txt; then
            if [ -n "$PR" ] && [ "$SAME_REPO" = "true" ]; then
              { echo "### Trivy image scan: $IMAGE_NAME has high or critical findings"; echo '```'; grep -A400 'Total: [1-9]' trivy-image.txt | head -c 50000; echo '```'; } > comment.md
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            fi
            cat trivy-image.txt
            exit 1
          fi
          echo "Trivy: $IMAGE_NAME has no high or critical findings."
      - name: Push to GitHub Container Registry
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          # The digest the registry holds (the manifest pushed), which every signature and attestation names.
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $IMAGE:$TAG"; exit 1; }
          echo "REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Sign the image (keyless)
        if: env.PUSH == 'true'
        run: cosign sign --yes "$REF"
      - name: SBOM (CycloneDX)
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REF }}
          version: v0.75.0
          format: cyclonedx
          output: sbom.cdx.json
      - name: Attach the SBOM as a signed attestation
        if: env.PUSH == 'true'
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - name: Verify the signature and the attestation as a deployment would
        if: env.PUSH == 'true'
        run: |
          cosign verify --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" "$REF" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" "$REF" > /dev/null
          printf '%s\t%s\t%s\n' "${{ matrix.image }}" "$TAG" "$DIGEST" > "digest-${{ matrix.image }}.tsv"
      - name: Digest and SBOM
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: |
            digest-${{ matrix.image }}.tsv
            sbom.cdx.json
          retention-days: 90

  digests:
    name: Image digests for the release notes
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
      - name: Write the table
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Images ($GITHUB_REF_NAME)"
            echo
            echo '| Image | Tag | Digest |'
            echo '|---|---|---|'
            cat digests/*/digest-*.tsv | sort | while IFS=$'\t' read -r image tag digest; do
              echo "| ghcr.io/$OWNER/ariva/$image | $tag | \`$digest\` |"
            done
            echo
            echo 'Verify any of them (wiki/04, section 6.5):'
            echo
            echo '```bash'
            echo "cosign verify --certificate-identity-regexp '^https://github\\.com/$REPOSITORY/\\.github/workflows/images\\.yml@refs/(tags/v.+|heads/main)\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository $REPOSITORY \\"
            echo "  ghcr.io/$OWNER/ariva/<image>@<digest>"
            echo '```'
          } > image-digests.md
          cat image-digests.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests
          path: image-digests.md
          retention-days: 400
